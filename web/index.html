    }

    // ── Obrazovka: náhled ──────────────────────────────────────────────
    function vykresliNahled() {
      const cil = $("o-nahled");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }
      const steny = stav.dokument.steny || [];
      if (!steny.length) {
        cil.innerHTML = `<div class="prazdno">${ikona("oko")}
          <p>${esc(SimteGen.t("nahled.prazdny"))}</p></div>`;
        nastavListu([{ popisek: SimteGen.t("obecne.zpet_na_zakazku"), vedlejsi: true,
          akce: () => jdi("zakazka", { id: stav.dokument.zakazka.id }, true) }]);
        return;
      }

      const vsechnyHlasky = [];
      let kresba = "";
      const pudorys = stav.nahledRezim === "pudorys";
      if (pudorys) {
        kresba = `<div class="karta vykres">${nakresliPudorys(steny)}
          <p class="vykres-popis">${esc(SimteGen.t("nahled.pudorys_legenda"))}</p></div>`;
        for (const stena of steny) {
          for (const h of kontrolaSteny(stena).hlasky) vsechnyHlasky.push(h);
        }
      } else {
        const kusy = [];
        for (const stena of steny) {
          const { kolizni, hlasky } = kontrolaSteny(stena);
          for (const h of hlasky) vsechnyHlasky.push(h);
          kusy.push(`<div class="karta vykres"><p class="stitek">${esc(stena.nazev)}</p>
            ${nakresliPohled(stena, stav.standard, kolizni)}</div>`);
        }
        kresba = kusy.join("");
      }

      // Přepínač jazyka je i tady: truhlář tu kuchyň ukazuje zákazníkovi,
      // a ten nemusí číst česky. Po přepnutí se otevře tentýž náhled.
      cil.innerHTML = `
        ${sekce(SimteGen.t(pudorys ? "nahled.pudorys" : "nahled.pohled"),
          { klic: "prepni", popisek: SimteGen.t(pudorys ? "nahled.na_pohled" : "nahled.na_pudorys") })}
        ${kresba}
        ${legenda()}
        <div data-prepinac-jazyka></div>
        ${sekce(SimteGen.t("nahled.kontrola"))}
        ${vsechnyHlasky.length
          ? `<div class="hlaska varovani">${vsechnyHlasky.map(esc).join("<br>")}</div>`
          : `<div class="hlaska uspech">${esc(SimteGen.t("nahled.v_poradku"))}</div>`}`;

      napojSekce(cil, {
        prepni: () => {
          stav.nahledRezim = pudorys ? "pohled" : "pudorys";
          vykresliNahled();
        },
      });
      nastavListu([{ popisek: SimteGen.t("kusovnik.vygenerovat"), akce: vygenerujKusovnik }]);
    }

    // ── Obrazovka: kusovník ────────────────────────────────────────────
    async function vygenerujKusovnik() {
      if (!stav.dokument) return;
      if (stav.ukladani !== "cisto") await ulozNaServer();
      jdi("kusovnik", { pocitat: true });
    }

    async function vykresliKusovnik(parametry) {
      const cil = $("o-kusovnik");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }

      // Kusovník v paměti musí patřit k otevřené zakázce — jinak by se po
      // přepnutí zakázky ukázala cizí čísla.
      const cizi = stav.kusovnik && stav.kusovnik.zakazka.id !== stav.dokument.zakazka.id;
      if (parametry.pocitat || !stav.kusovnik || cizi) {
        cil.innerHTML = `<div class="kostra kostra-tabulka"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>
          <div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        const { ok, data } = await api("/api/kusovnik", "POST",
          { zakazka_id: stav.dokument.zakazka.id }).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          // Server hlásí česky, že chybí skříňka — to je prázdný stav, ne chyba.
          if (data.chyba && data.chyba.indexOf("skříňku") > -1) {
            cil.innerHTML = `<div class="prazdno">${ikona("kusovnik")}
              <p>${esc(SimteGen.t("kusovnik.prazdny"))}</p></div>`;
          } else {
            cil.innerHTML = `<div class="hlaska chyba">${esc(chybaServeru(data, "kusovnik.chyba"))}</div>`;
          }
          nastavListu([{ popisek: SimteGen.t("obecne.zpet_na_zakazku"), vedlejsi: true,
            akce: () => jdi("zakazka", { id: stav.dokument.zakazka.id }, true) }]);
          return;
        }
        stav.kusovnik = data;
        stav.dokument.posledni_kusovnik = {
          id: data.id, pocet_dilu: data.souhrn.pocet_dilu,
          odhad_desek: data.souhrn.odhad_desek, vytvoreno: data.vytvoreno,
        };
        toast(SimteGen.t("kusovnik.ulozen"));
        if (aktualni.nazev !== "kusovnik") return;
        // Ať se při návratu tlačítkem zpět/vpřed nepočítá (a neukládá) znovu.
        aktualni.parametry = {};
        history.replaceState({ obrazovka: "kusovnik", parametry: {} }, "", adresaObrazovky("kusovnik", {}));
      }

      // Díly, olepení a materiál „Záda“ jsou v uloženém kusovníku česky;
      // anglická obrazovka je přeloží stejně jako anglické CSV (texty-oboru.js).
      const k = stav.kusovnik;
      const plocha = SimteGen.cislo(k.souhrn.plocha_cm2 / 10000, 2);
      const podleMaterialu = new Map();
      for (const p of k.polozky) {
        const klic = `${nazevMaterialu(p.material)} · ${p.tloustka_mm} mm`;
        if (!podleMaterialu.has(klic)) podleMaterialu.set(klic, []);
        podleMaterialu.get(klic).push(p);
      }

      const skupiny = [...podleMaterialu.entries()].map(([nazev, polozky]) => `
        ${sekce(nazev)}
        <ul class="seznam jen-telefon">${polozky.map((p) => `
          <li class="radek"><span class="hlavni">
            <strong>${esc(nazevDilu(p.nazev, p.klic))} ${p.a_mm} × ${p.b_mm}</strong>
            <span>${esc(popisHran(p.hrany_popis))}${p.vlakno ? esc(SimteGen.t("kusovnik.vlakno_po_delce")) : ""}</span>
          </span><span class="vpravo">${p.ks}×</span></li>`).join("")}</ul>
        <div class="tabulka-obal jen-siroke"><table class="tabulka">
          <thead><tr><th>${esc(SimteGen.t("kusovnik.sloupec_dil"))}</th>
            <th>${esc(SimteGen.t("kusovnik.sloupec_rozmer"))}</th>
            <th>${esc(SimteGen.t("kusovnik.sloupec_rez"))}</th>
            <th>${esc(SimteGen.t("kusovnik.sloupec_olepeni"))}</th>
            <th>${esc(SimteGen.t("kusovnik.sloupec_ks"))}</th></tr></thead>
          <tbody>${polozky.map((p) => `<tr>
            <td>${esc(nazevDilu(p.nazev, p.klic))}</td>
            <td class="rozmer-bunka">${p.a_mm} × ${p.b_mm}</td>
            <td class="rozmer-bunka">${p.delka_mm} × ${p.sirka_mm}${p.vlakno ? esc(SimteGen.t("kusovnik.vlakno")) : ""}</td>
            <td><span class="kod">${esc(popisHran(p.hrany_popis))}</span></td>
            <td>${p.ks}</td></tr>`).join("")}</tbody>
        </table></div>`).join("");

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">${esc(SimteGen.t("zakazka.dilu_v_kusovniku"))}</p>
          <div class="cislo-radek"><span class="cislo-obri">${k.souhrn.pocet_dilu}</span>
            <p>${esc(SimteGen.t("kusovnik.odhad", { pocet: SimteGen.pocet(k.souhrn.odhad_desek, "pocet.deska") }))}<br>
            ${esc(SimteGen.t("kusovnik.plocha", { plocha }))}</p></div>
          <p class="vykres-popis">${esc(k.zakazka.nazev)} · ${esc(datum(k.vytvoreno))}</p>
        </div>
        ${sekce(SimteGen.t("kusovnik.jak_cist"))}
        <p class="popisek">${esc(SimteGen.t(k.standard.rozmer_s_olepenim
          ? "kusovnik.rozmery_po_olepeni" : "kusovnik.rozmery_rez"))}
          ${esc(SimteGen.t("kusovnik.sirka_vyska"))}</p>
        <p class="hlaska varovani">${esc(SimteGen.t("kusovnik.zkontrolujte"))}</p>
        ${(k.varovani || []).length
          ? `<div class="hlaska varovani">${k.varovani.map((v) => esc(textHlasky(v))).join("<br>")}</div>` : ""}
        ${skupiny}
        <p class="popisek">${esc(SimteGen.t("kusovnik.odhad_orientacni"))}</p>`;

      nastavListu([
        { popisek: SimteGen.t("kusovnik.stahnout"), akce: () => stahniCsv(k.id) },
        { popisek: SimteGen.t("kusovnik.hotovo"), vedlejsi: true, akce: oznacHotovou },
      ]);
    }

    // Anglická obrazovka stáhne anglické CSV (stejné sloupce, rozměry a pořadí).
    async function stahniCsv(id) {
      toast(SimteGen.t("kusovnik.pripravuji"));
      const en = anglicky();
      const odpoved = await fetch(`/api/kusovnik/${id}/csv${en ? "?jazyk=en" : ""}`).catch(() => null);
      if (!odpoved || !odpoved.ok) { toast(SimteGen.t("kusovnik.chyba_stazeni")); return; }
      const blob = await odpoved.blob();
      const adresa = URL.createObjectURL(blob);
      const odkaz = document.createElement("a");
      odkaz.href = adresa;
      odkaz.download = `${en ? "cutting-list" : "kusovnik"}-${id}.csv`;
      document.body.appendChild(odkaz);
      odkaz.click();
      odkaz.remove();
      setTimeout(() => URL.revokeObjectURL(adresa), 10000);
      toast(SimteGen.t("kusovnik.stazeno"));
    }

    async function oznacHotovou() {
      if (!stav.dokument) return;
      stav.dokument.zakazka.stav = "hotova";
      await ulozNaServer();
      stav.zakazky = null;
      toast(SimteGen.t("kusovnik.zakazka_hotova"));
      jdi("zakazka", { id: stav.dokument.zakazka.id }, true);
    }

    // ── Obrazovka: standard ────────────────────────────────────────────
    async function nactiStandard() {
      const { ok, data } = await api("/api/standard").catch(() => ({ ok: false, data: {} }));
      if (ok) {
        stav.standard = data.standard;
        stav.ukazka = data.ukazka || [];
      }
      const m = await api("/api/materialy").catch(() => ({ ok: false, data: {} }));
      if (m.ok) stav.materialy = m.data.materialy || [];
      return ok;
    }

    // [skupina, klíč nadpisu, [[pole, klíč popisku, klíč nápovědy nebo ""]]]
    // — texty jsou ve web/texty.js.
    const POLE_STANDARDU = [
      ["01", "standard.korpus", [
        ["tloustka_mm", "standard.tloustka", "standard.tloustka_napoveda"],
        ["zada_tloustka_mm", "standard.zada_tloustka", "standard.zada_tloustka_napoveda"],
        ["drazka_hloubka_mm", "standard.drazka_hloubka", "standard.drazka_hloubka_napoveda"],
        ["drazka_odsazeni_mm", "standard.drazka_odsazeni", ""],
        ["odskok_police_mm", "standard.odskok_police", "standard.odskok_police_napoveda"],
        ["traverza_sirka_mm", "standard.traverza_sirka", "standard.traverza_sirka_napoveda"],
      ]],
      ["02", "standard.cela", [
        ["spara_okraj_desetiny", "standard.spara_okraj", "standard.spara_okraj_napoveda"],
        ["spara_mezi_desetiny", "standard.spara_mezi", "standard.spara_mezi_napoveda"],
        ["hrana_pohledova_desetiny", "standard.hrana_pohledova", "standard.hrana_pohledova_napoveda"],
        ["hrana_ostatni_desetiny", "standard.hrana_ostatni", "standard.hrana_ostatni_napoveda"],
      ]],
      ["03", "standard.deska", [
        ["prorez_mm", "standard.prorez", "standard.prorez_napoveda"],
        ["deska_x_mm", "standard.deska_x", ""],
        ["deska_y_mm", "standard.deska_y", ""],
        ["sokl_mm", "standard.sokl", "standard.kvuli_vykresu"],
        ["vyska_horni_mm", "standard.vyska_horni", "standard.kvuli_vykresu"],
      ]],
    ];
    const VSECHNA_POLE = POLE_STANDARDU.flatMap(([, , pole]) => pole);

    async function vykresliStandard() {
      const cil = $("o-standard");
      if (nutnePrihlaseni(cil)) return;
      if (!stav.standard) {
        cil.innerHTML = `<div class="kostra kostra-tabulka"></div>
          <div class="kostra kostra-karta"></div>`;
        nastavListu([]);
        const ok = await nactiStandard();
        if (!ok) {
          cil.innerHTML = `<div class="hlaska chyba">${esc(SimteGen.t("standard.chyba_nacteni"))}</div>`;
          nastavListu([{ popisek: SimteGen.t("obecne.znovu"), vedlejsi: true, akce: vykresliStandard }]);
          return;
        }
        if (aktualni.nazev !== "standard") return;
      }
      const s = stav.standard;

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">${esc(SimteGen.t("standard.tloustka_stitek"))}</p>
          <div class="cislo-radek"><span class="cislo-obri">${s.tloustka_mm}</span>
            <p>mm · ${esc(s.nazev)}<br>${esc(SimteGen.t("standard.podle_toho"))}</p></div>
        </div>
        ${sekce(SimteGen.t("standard.ukazka"))}
        <ul class="seznam" id="ukazka"></ul>
        <p class="popisek">${esc(SimteGen.t("standard.prepocet"))}</p>
        <div class="pole"><label for="std-nazev">${esc(SimteGen.t("standard.nazev"))}</label>
          <input id="std-nazev" type="text" value="${esc(s.nazev)}"></div>
        <div class="pole"><label for="std-zada-typ">${esc(SimteGen.t("zada.nazev"))}</label>
          <select id="std-zada-typ">
            <option value="drazka"${s.zada_typ === "drazka" ? " selected" : ""}>${esc(SimteGen.t("zada.drazka"))}</option>
            <option value="nasazena"${s.zada_typ === "nasazena" ? " selected" : ""}>${esc(SimteGen.t("zada.nasazena"))}</option>
          </select></div>
        <label class="volba"><input type="checkbox" id="std-traverzy"
          ${s.traverzy_spodni ? "checked" : ""}> ${esc(SimteGen.t("standard.traverzy"))}</label>
        <label class="volba"><input type="checkbox" id="std-olepeni"
          ${s.rozmer_s_olepenim ? "checked" : ""}> ${esc(SimteGen.t("standard.olepeni"))}</label>
        <p class="popisek">${esc(SimteGen.t("standard.olepeni_napoveda"))}</p>
        ${POLE_STANDARDU.map(([c, nazev]) => `${sekce(SimteGen.t(nazev))}
          <div class="dvojice-poli" data-skupina="${c}"></div>`).join("")}
        <div id="std-zprava" aria-live="polite"></div>
        ${sekce(SimteGen.t("standard.materialy"), { klic: "material", popisek: SimteGen.t("obecne.pridat") })}
        <div id="std-materialy"></div>`;

      for (const [c, , pole] of POLE_STANDARDU) {
        const misto = cil.querySelector(`[data-skupina="${c}"]`);
        for (const [klic, popisek, napoveda] of pole) {
          const obal = document.createElement("div");
          obal.className = "pole";
          obal.innerHTML = `<label for="std-${klic}">${esc(SimteGen.t(popisek))}</label>
            <input id="std-${klic}" type="number" inputmode="numeric" value="${cislo(s[klic], 0)}">
            ${napoveda ? `<span class="napoveda">${esc(SimteGen.t(napoveda))}</span>` : ""}`;
          misto.appendChild(obal);
        }
      }

      vykresliUkazku();
      cil.querySelectorAll("input, select").forEach((prvek) => {
        prvek.addEventListener("input", prepocitejUkazku);
        prvek.addEventListener("change", prepocitejUkazku);
      });

      vykresliMaterialy();
      napojSekce(cil, { material: panelMaterial });
      nastavListu([{ popisek: SimteGen.t("standard.ulozit"), akce: ulozStandard }]);
    }

    function formularStandardu() {
      const s = { ...stav.standard };
      s.nazev = $("std-nazev").value.trim() || "Můj standard";
      s.zada_typ = $("std-zada-typ").value;
      s.traverzy_spodni = $("std-traverzy").checked ? 1 : 0;
      s.rozmer_s_olepenim = $("std-olepeni").checked ? 1 : 0;
      for (const [klic] of VSECHNA_POLE) s[klic] = cislo($("std-" + klic).value, s[klic]);
      return s;
    }

    let casovacUkazky = null;
    function prepocitejUkazku() {
      if (casovacUkazky) clearTimeout(casovacUkazky);
      casovacUkazky = setTimeout(async () => {
        const { ok, data } = await api("/api/standard/ukazka", "POST", formularStandardu())
          .catch(() => ({ ok: false, data: {} }));
        if (!ok) return;
        stav.ukazka = data.ukazka || [];
        vykresliUkazku();
      }, 400);
    }

    function vykresliUkazku() {
      const seznam = $("ukazka");
      if (!seznam) return;
      seznam.innerHTML = stav.ukazka.map((d) => `
        <li class="radek"><span class="poradi">${esc(d.ks)}×</span>
          <span class="hlavni"><strong>${esc(nazevDilu(d.nazev))}</strong>
          <span>${esc(popisHran(d.hrany))}</span></span>
          <span class="vpravo">${esc(d.rozmer)}</span></li>`).join("");
    }

    async function ulozStandard() {
      const zprava = $("std-zprava");
      zprava.className = "hlaska";
      zprava.textContent = SimteGen.t("ulozeni.ukladam");
      const { ok, data } = await api("/api/standard", "PUT", formularStandardu())
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) {
        zprava.className = "hlaska chyba";
        zprava.textContent = chybaServeru(data, "standard.chyba_ulozeni");
        return;
      }
      stav.standard = data.standard;
      stav.ukazka = data.ukazka || [];
      zprava.className = "hlaska uspech";
      zprava.textContent = SimteGen.t("standard.ulozen");
      toast(SimteGen.t("standard.ulozen"));
      vykresliUkazku();
    }

    function vykresliMaterialy() {
      const misto = $("std-materialy");
      if (!misto) return;
      if (!stav.materialy.length) {
        misto.innerHTML = `<p class="popisek">${esc(SimteGen.t("material.zadny",
          { tloustka: stav.standard.tloustka_mm }))}</p>`;
        return;
      }
      misto.innerHTML = `<ul class="seznam">${stav.materialy.map((m) => `
        <li class="radek"><span class="hlavni"><strong>${esc(m.nazev)}</strong>
          <span>${m.tloustka_mm} mm${m.dekor_kod ? " · " + esc(m.dekor_kod) : ""}${
            m.vlakno ? esc(SimteGen.t("material.ma_vlakno")) : ""}</span></span>
        <button type="button" class="tlacitko vedlejsi" data-smazat="${m.id}">${esc(SimteGen.t("material.smazat"))}</button>
        </li>`).join("")}</ul>`;
      misto.querySelectorAll("[data-smazat]").forEach((b) =>
        b.addEventListener("click", async () => {
          const { ok } = await api(`/api/materialy?id=${b.dataset.smazat}`, "DELETE")
            .catch(() => ({ ok: false }));
          if (!ok) { toast(SimteGen.t("material.chyba_smazani")); return; }
          stav.materialy = stav.materialy.filter((m) => String(m.id) !== b.dataset.smazat);
          vykresliMaterialy();
          toast(SimteGen.t("material.smazan"));
        }));
    }

    function panelMaterial() {
      otevriPanel(SimteGen.t("material.novy"), `
        <div class="pole"><label for="mt-nazev">${esc(SimteGen.t("obecne.nazev"))}</label>
          <input id="mt-nazev" type="text" placeholder="${esc(SimteGen.t("material.nazev_vzor"))}"></div>
        <div class="dvojice-poli">
          <div class="pole"><label for="mt-kod">${esc(SimteGen.t("material.kod"))}</label>
            <input id="mt-kod" type="text" placeholder="H1145"></div>
          <div class="pole"><label for="mt-tloustka">${esc(SimteGen.t("material.tloustka"))}</label>
            <input id="mt-tloustka" type="number" inputmode="numeric" value="18"></div>
        </div>
        <label class="volba"><input type="checkbox" id="mt-vlakno">
          ${esc(SimteGen.t("material.vlakno"))}</label>
        <div id="mt-zprava" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="mt-ulozit">${esc(SimteGen.t("material.pridat"))}</button>
        </div>`,
        (panel) => {
          panel.querySelector("#mt-ulozit").addEventListener("click", async () => {
            const zprava = panel.querySelector("#mt-zprava");
            zprava.className = "hlaska";
            zprava.textContent = SimteGen.t("ulozeni.ukladam");
            const { ok, data } = await api("/api/materialy", "POST", {
              nazev: panel.querySelector("#mt-nazev").value,
              dekor_kod: panel.querySelector("#mt-kod").value,
              tloustka_mm: panel.querySelector("#mt-tloustka").value,
              vlakno: panel.querySelector("#mt-vlakno").checked,
            }).catch(() => ({ ok: false, data: {} }));
            if (!ok) {
              zprava.className = "hlaska chyba";
              zprava.textContent = chybaServeru(data, "material.chyba_pridani");
              return;
            }
            zavriPanel();
            const m = await api("/api/materialy").catch(() => ({ ok: false, data: {} }));
            if (m.ok) stav.materialy = m.data.materialy || [];
            vykresliMaterialy();
            toast(SimteGen.t("material.pridan"));
          });
        });
    }

    // ── Obrazovka: účet ────────────────────────────────────────────────
    // Stav hlášení → klíč ve web/texty.js.
    const STAVY_HLASENI = { nove: "hlaseni.nove", vyrizuje_se: "hlaseni.resime",
      vyrizeno: "hlaseni.vyrizeno", odlozeno: "hlaseni.odlozeno" };

    // Stupnice zbývajícího období: čtyři týdny, rysky po 7 dnech (styl.css
    // kreslí rysku po čtvrtinách), delší období stupnici jen zaplní.
    const STUPNICE_DNI = 28;
    const jeUkazka = (ja) => /@ukazka\.invalid$/.test((ja && ja.email) || "");

    function kartaStavu(ja) {
      const p = ja.predplatne;
      const dni = p ? p.dni_zbyva : 0;
      const popisStavu = !p ? ""
        : p.stav === "aktivni" ? SimteGen.t("ucet.predplatne_do", { datum: datum(p.plati_do) })
        : p.stav === "zkusebni" ? SimteGen.t("ucet.zkusebni_do", { datum: datum(p.plati_do) })
        : SimteGen.t("ucet.vyprselo");
      const plneni = Math.min(100, Math.round((dni / STUPNICE_DNI) * 100));
      return `
        <div class="karta vykres">
          <p class="stitek">${esc(SimteGen.t("ucet.dni_zbyva"))}</p>
          <div class="cislo-radek"><span class="cislo-obri">${dni}</span>
            <p>${esc(popisStavu)}<br>${esc(ja.email || "")}</p></div>
          <div class="stupnice" role="img" aria-label="${esc(SimteGen.t("ucet.zbyva",
            { pocet: SimteGen.pocet(dni, "pocet.den") }))}">
            <div class="stupnice-rysky"></div>
            <div class="stupnice-plneni" style="--hodnota: ${plneni}%"></div>
            <div class="stupnice-popisky"><span>${esc(SimteGen.t("ucet.dnes"))}</span><span>+7</span>
              <span>+14</span><span>+21</span><span>${esc(SimteGen.t("ucet.plus28"))}</span></div>
          </div>
          ${p && p.plati_do ? `<p class="rozmer">${esc(SimteGen.t("ucet.konec_obdobi",
            { datum: SimteGen.datum(p.plati_do, { rok: true }) }))}</p>` : ""}
          ${p && p.stav === "vyprselo" ? `<p class="hlaska chyba">${esc(SimteGen.t("ucet.vyprselo_popis"))}</p>` : ""}
        </div>`;
    }

    async function vykresliUcet() {
      const mrizka = $("ucet-mrizka");
      if (nutnePrihlaseni($("ucet-neprihlasen"))) { mrizka.classList.add("skryte"); return; }
      $("ucet-neprihlasen").innerHTML = "";
      mrizka.classList.remove("skryte");
      nastavListu([]);

      // Stav se čte pokaždé znovu: předplatné se mohlo mezitím prodloužit
      // (nákup v Google Play, zaplacená faktura).
      $("ucet-stav").innerHTML = `<div class="kostra kostra-karta"></div>`;
      const { ok, data } = await api("/api/ja").catch(() => ({ ok: false, data: {} }));
      if (aktualni.nazev !== "ucet") return;
      if (!ok) {
        $("ucet-stav").innerHTML = `<div class="hlaska chyba">${esc(SimteGen.t("ucet.chyba_stavu"))}</div>`;
        const znovu = document.createElement("button");
        znovu.type = "button";
        znovu.className = "tlacitko vedlejsi";
        znovu.textContent = SimteGen.t("obecne.znovu");
        znovu.addEventListener("click", vykresliUcet);
        $("ucet-stav").appendChild(znovu);
      } else {
        stav.ja = data;
        if (!data.prihlasen) { vykresliUcet(); return; }
        $("ucet-stav").innerHTML = kartaStavu(data);
      }
      const ja = stav.ja || {};

      $("ucet-predplatne").innerHTML = `${sekce(SimteGen.t("ucet.predplatne"))}
        <p class="popisek">${esc(SimteGen.t("ucet.predplatne_popis"))}</p>`;

      // Fakturační objednávka: jen v prohlížeči (v aplikaci z Google Play ji
      // schová styl.css podle play.js) a ne v ukázkovém účtu.
      const objednavka = $("ucet-objednavka");
      objednavka.classList.toggle("skryte", jeUkazka(ja));
      if (jeUkazka(ja)) objednavka.innerHTML = "";
      else vykresliObjednavku(objednavka);

      // Přepínač jazyka kreslí simtegen.js do [data-prepinac-jazyka]; musí
      // být přímým potomkem, aby si ho všiml i po překreslení obrazovky.
      $("ucet-dalsi").innerHTML = `
        ${sekce(SimteGen.t("ucet.jazyk"))}
        <div data-prepinac-jazyka></div>
        ${sekce(SimteGen.t("ucet.hlaseni"))}
        <div id="hl-seznam"></div>
        ${sekce(SimteGen.t("ucet.data"))}
        <ul class="seznam" id="ucet-akce"></ul>
        ${paticka(false)}`;

      nactiHlaseni();

      const akce = $("ucet-akce");
      pridejAkci(akce, SimteGen.t("ucet.stahnout"), SimteGen.t("ucet.stahnout_popis"),
        () => { location.href = "/api/ucet/export"; });
      pridejAkci(akce, SimteGen.t("ucet.odhlasit"), "", async () => {
        await api("/api/odhlaseni", "POST");
        zahodKoncept();
        location.reload();
      });
      pridejAkci(akce, SimteGen.t("ucet.smazat"), SimteGen.t("akce.nevratne"), smazUcet);

      nastavListu([]);
    }

    function vykresliObjednavku(cil) {
      // Anglická stránka má popisky přeložené, ale podmínky i faktura jsou
      // česky — řekne to věta nad tlačítkem.
      cil.innerHTML = `
        <p class="stitek">${esc(SimteGen.t("objednavka.nadpis"))}</p>
        ${cenikSeznam()}
        <div class="pole"><label for="ob-mesice">${esc(SimteGen.t("objednavka.delka"))}</label>
          <select id="ob-mesice">${[1, 3, 12].map((n) =>
            `<option value="${n}">${esc(SimteGen.pocet(n, "pocet.mesic"))}</option>`).join("")}
          </select></div>
        <p class="popisek" id="ob-vybrana"></p>
        <p class="titulek-cena" id="ob-celkem"></p>
        <div class="pole"><label for="ob-fakturace">${esc(SimteGen.t("objednavka.fakturace"))}</label>
          <textarea id="ob-fakturace" rows="3" maxlength="600"
            placeholder="${esc(SimteGen.t("objednavka.fakturace_vzor"))}"></textarea></div>
        <label class="volba"><input type="checkbox" id="ob-spotrebitel">
          ${esc(SimteGen.t("objednavka.spotrebitel"))}</label>
        <label class="volba skryte" id="ob-souhlas-radek"><input type="checkbox" id="ob-souhlas">
          ${esc(SimteGen.t("objednavka.souhlas"))}</label>
        ${anglicky() ? `<p class="popisek">${esc(SimteGen.t("objednavka.jen_cesky"))}</p>` : ""}
        <button type="button" class="tlacitko" id="ob-poslat">${esc(SimteGen.t("objednavka.poslat"))}</button>
        <div id="ob-zprava" aria-live="polite"></div>`;
      nastavObjednavku(cil);
    }

    function nastavObjednavku(cil) {
      // Objednat jde jen varianta s definovaným obsahem (viz CENIK_VARIANTY).
      const vybrana = () => VARIANTY.find((v) => v.objednat);
      const prepocti = () => {
        const mesice = Number($("ob-mesice").value);
        const v = vybrana();
        $("ob-vybrana").textContent = SimteGen.t("objednavka.vybrana",
          { nazev: v.nazev, cena: SimteGen.kc(v.mesic) });
        $("ob-celkem").textContent = SimteGen.t("objednavka.celkem",
          { cena: SimteGen.kc(mesice * v.mesic), obdobi: SimteGen.pocet(mesice, "pocet.mesic") });
      };
      prepocti();
      $("ob-mesice").addEventListener("change", prepocti);
      $("ob-spotrebitel").addEventListener("change", () => {
        $("ob-souhlas-radek").classList.toggle("skryte", !$("ob-spotrebitel").checked);
      });
      $("ob-poslat").addEventListener("click", async () => {
        const zprava = $("ob-zprava");
        zprava.className = "hlaska";
        zprava.textContent = SimteGen.t("obecne.odesilam");
        const mesice = Number($("ob-mesice").value);
        const varianta = vybrana();
        const { ok, data } = await api("/api/objednavka", "POST", {
          mesice,
          varianta: varianta.klic,
          cena_czk: mesice * varianta.mesic,
          fakturace: $("ob-fakturace").value,
          spotrebitel: $("ob-spotrebitel").checked,
          souhlas_zahajeni: $("ob-spotrebitel").checked && $("ob-souhlas").checked,
        }).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          zprava.className = "hlaska chyba";
          zprava.textContent = chybaServeru(data, "objednavka.chyba");
          return;
        }
        zprava.className = "hlaska uspech";
        zprava.textContent = SimteGen.t("objednavka.prijata");
        toast(SimteGen.t("objednavka.prijata_kratce"));
      });
    }

    // Formulář pro nové hlášení řídí web/simtegen.js (tlačítko .nahlasit-chybu
    // v navigaci, hlavičce a patičce) — tady se jen ukazuje, co jste poslali
    // a co jsme odpověděli.
    async function nactiHlaseni() {
      const seznam = $("hl-seznam");
      if (!seznam) return;
      const { ok, data } = await api("/api/hlaseni").catch(() => ({ ok: false, data: {} }));
      if (!seznam.isConnected) return;
      const polozky = ok ? (data.hlaseni || []) : [];
      if (!polozky.length) {
        seznam.innerHTML = `<p class="popisek">${esc(SimteGen.t("hlaseni.zadne"))}</p>`;
        return;
      }
      // Text hlášení a odpověď jsou zprávy mezi zákazníkem a námi — nepřekládají se.
      seznam.innerHTML = `<ul class="seznam">${polozky.map((h) => `
        <li class="radek"><span class="hlavni"><strong>${esc(h.text)}</strong>
          <span>${esc(datum(h.vytvoreno))} · ${esc(STAVY_HLASENI[h.stav]
            ? SimteGen.t(STAVY_HLASENI[h.stav]) : h.stav)}${
            h.odpoved ? esc(SimteGen.t("hlaseni.odpoved", { odpoved: h.odpoved })) : ""}</span></span></li>`)
        .join("")}</ul>`;
    }

    async function smazUcet() {
      if (!await SimteGen.potvrd(SimteGen.t("ucet.smazat_otazka"), {
        popis: SimteGen.t("ucet.smazat_popis"),
        ano: SimteGen.t("ucet.smazat_ano"), nebezpecne: true })) return;
      const { ok, data } = await api("/api/ucet/smazat", "POST")
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(chybaServeru(data, "obecne.chyba_smazani")); return; }
      zahodKoncept();
      location.reload();
    }

    // ── Start ──────────────────────────────────────────────────────────
    sledujKlavesnici();

    /**
     * Po novém načtení stránky (přepnutí jazyka, obnovení v prohlížeči) se
     * otevře obrazovka z adresy. Vnitřní obrazovka nese číslo zakázky
     * (#nahled/12, #stena/12/0); pod ni se do historie vloží Zakázky
     * a zakázka, aby tlačítko Zpět vedlo tam, kam vede jindy. Kusovník se
     * znovu nepočítá — otevře se zakázka, odkud je na jedno klepnutí.
     */
    async function obnovObrazovku() {
      const [nazev, idText, indexText] = (location.hash || "").replace("#", "").split("/");
      if (KORENOVE[nazev]) { jdi(nazev, {}, true); return; }
      const id = Number(idText);
      if (VNITRNI[nazev] && Number.isInteger(id) && id > 0) {
        const { ok } = await nactiDokument(id);
        if (ok) {
          history.replaceState({ obrazovka: "zakazky", parametry: {} }, "", "#zakazky");
          if (nazev === "zakazka" || nazev === "kusovnik") { jdi("zakazka", { id }); return; }
          history.pushState({ obrazovka: "zakazka", parametry: { id } }, "", `#zakazka/${id}`);
          jdi(nazev, nazev === "stena" ? { index: cislo(indexText, 0) } : {});
          return;
        }
      }
      jdi("zakazky", {}, true);
    }

    // Kdo je přihlášený, ví simtegen.js: bez spojení je to „offline“, ne
    // odhlášení — zůstane poslední obrazovka a pruh nabídne zkusit to znovu.
    async function start() {
      const kdo = await SimteGen.kdoJsem();
      if (kdo.stav === "offline") {
        SimteGen.offline(start);
        return;
      }
      SimteGen.spojeno();
      stav.ja = kdo.ja;
      if (kdo.stav === "odhlasen") {
        jdi("uvod", {}, true);
        return;
      }
      await nactiStandard();
      await obnovObrazovku();
    }

    start();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
