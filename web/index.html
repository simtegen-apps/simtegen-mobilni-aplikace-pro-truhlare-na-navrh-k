        <div class="pole">
          <label for="nz-zakaznik">Označení zákazníka (nepovinné)</label>
          <input id="nz-zakaznik" type="text" placeholder="Novák, Brno">
          <span class="napoveda">Pište jen to, co opravdu potřebujete — jsou to údaje
          vašeho zákazníka.</span>
        </div>
        <div id="nz-zprava" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="nz-ulozit">Založit zakázku</button>
        </div>`,
        (panel) => {
          panel.querySelector("#nz-ulozit").addEventListener("click", async () => {
            const zprava = panel.querySelector("#nz-zprava");
            zprava.className = "hlaska";
            zprava.textContent = "Zakládám…";
            const { ok, data } = await api("/api/zakazky", "POST", {
              nazev: panel.querySelector("#nz-nazev").value,
              oznaceni_zakaznika: panel.querySelector("#nz-zakaznik").value,
            }).catch(() => ({ ok: false, data: {} }));
            if (!ok) {
              zprava.className = "hlaska chyba";
              zprava.textContent = data.chyba || "Zakázku se nepodařilo založit.";
              return;
            }
            zavriPanel();
            stav.zakazky = null;
            toast("Zakázka založena.");
            jdi("zakazka", { id: data.id });
          });
        });
    }

    // ── Obrazovka: zakázka ─────────────────────────────────────────────
    async function vykresliZakazku(parametry) {
      const cil = $("o-zakazka");
      if (nutnePrihlaseni(cil)) return;
      const id = Number(parametry.id);
      if (!stav.dokument || stav.dokument.zakazka.id !== id) {
        // Předchozí zakázka může mít úpravu, která čeká na uložení — po
        // výměně dokumentu by se už neuložila.
        if (stav.dokument && stav.ukladani !== "cisto") await ulozNaServer();
        cil.innerHTML = `<div class="kostra kostra-karta"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        const { ok, data } = await api(`/api/zakazky/${id}`).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          cil.innerHTML = `<div class="hlaska chyba">${esc(data.chyba
            || "Zakázku se nepodařilo načíst.")}</div>`;
          nastavListu([{ popisek: "Zpět na zakázky", vedlejsi: true, akce: () => jdi("zakazky") }]);
          return;
        }
        stav.dokument = normalizujDokument(data);
        stav.kusovnik = null;
        stav.ukladani = "cisto";
        stav.chybaUlozeni = "";
        stav.mistnostIndex = 0;
        const koncept = nactiKoncept(id);
        if (koncept && koncept.cas > (data.zakazka.zmeneno || 0)) {
          stav.dokument = normalizujDokument(koncept.dokument);
          toast("Obnovili jsme neuložené měření z telefonu.");
          zmeneno();
        }
        if (aktualni.nazev !== "zakazka") return;
      }
      if (!stav.standard) await nactiStandard();

      const dokument = stav.dokument;
      $("titulek").textContent = dokument.zakazka.nazev;
      const skrinek = (dokument.steny || []).reduce((s, x) => s + (x.skrinky || []).length, 0);
      const posledni = dokument.posledni_kusovnik;
      const platny = posledni && posledni.vytvoreno >= (dokument.zakazka.zmeneno || 0);

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">${platny ? "Dílů v kusovníku" : "Skříněk v zakázce"}</p>
          <div class="cislo-radek">
            <span class="cislo-obri">${platny ? posledni.pocet_dilu : skrinek}</span>
            <p>${esc(dokument.zakazka.oznaceni_zakaznika || "bez označení zákazníka")}<br>
            ${platny ? "odhad " + posledni.odhad_desek + " desek · " + datum(posledni.vytvoreno)
              : (dokument.steny || []).length + "× stěna"}</p>
          </div>
          ${posledni && !platny ? `<p class="hlaska varovani">Zakázka se od posledního
            kusovníku změnila — přepočítejte ho.</p>` : ""}
          <p data-ulozeni class="rozmer">Uloženo</p>
        </div>
        ${sekce("01", "Stěny", { klic: "stena", popisek: "Přidat" })}
        <div id="seznam-sten"></div>
        ${sekce("02", "Zakázka")}
        <ul class="seznam" id="akce-zakazky"></ul>`;

      const seznamSten = $("seznam-sten");
      if (!(dokument.steny || []).length) {
        seznamSten.innerHTML = `<div class="prazdno">${ikona("metr")}
          <p>Zakázka je prázdná — přidejte první stěnu.</p></div>`;
        const start = document.createElement("button");
        start.type = "button";
        start.className = "tlacitko vedlejsi";
        start.textContent = "Přidat stěnu";
        start.addEventListener("click", () => pridejStenuAOtevri());
        seznamSten.querySelector(".prazdno").appendChild(start);
      } else {
        // Víc místností: stěny se dělí podle místnosti s mono podnadpisem
        // „KUCHYŇ · 4 STĚNY“. U jedné místnosti zůstává seznam jako dřív.
        const vice = dokument.mistnosti.length > 1;
        dokument.mistnosti.forEach((mistnost, mi) => {
          const steny = stenyMistnosti(dokument, mi);
          if (vice) {
            const nadpis = document.createElement("p");
            nadpis.className = "stitek";
            nadpis.textContent = `${mistnost.nazev} · ${pocetSten(steny.length)}`;
            seznamSten.appendChild(nadpis);
          }
          if (!steny.length) {
            const nic = document.createElement("p");
            nic.className = "popisek";
            nic.textContent = "Zatím bez stěn — přidáte je v Prostoru u místnosti.";
            seznamSten.appendChild(nic);
            return;
          }
          const seznam = document.createElement("ul");
          seznam.className = "seznam";
          steny.forEach(({ stena, index }, poradi) => {
            const { hlasky } = kontrolaSteny(stena);
            seznam.appendChild(radekTlacitko(
              `<span class="poradi">${String(poradi + 1).padStart(2, "0")}</span>
               <span class="hlavni"><strong>${esc(stena.nazev)}</strong>
               <span>${stena.delka_mm} × ${stena.vyska_mm} mm ·
               ${(stena.skrinky || []).length}× skříňka</span></span>
               <span class="vpravo">${hlasky.length ? hlasky.length + " ⚠" : "›"}</span>`,
              () => jdi("stena", { index })));
          });
          seznamSten.appendChild(seznam);
        });
      }

      const akce = $("akce-zakazky");
      pridejAkci(akce, "Prostor a kontrola", "půdorys místností, rozvinutý pohled, varování",
        () => jdi("prostor"));
      pridejAkci(akce, "Kopírovat jako šablonu", "nová zakázka se stejnými stěnami", kopirujZakazku);
      pridejAkci(akce, "Upravit název a poznámku", "", panelUpravZakazku);
      pridejAkci(akce, "Smazat zakázku", "nevratné", smazZakazku);

      napojSekce(cil, { stena: () => pridejStenuAOtevri() });
      prekresliStavUlozeni();
      nastavListu([
        { popisek: "Vygenerovat kusovník", akce: vygenerujKusovnik, zakazane: skrinek === 0 },
      ]);
    }

    function pridejAkci(seznam, nazev, popis, akce) {
      seznam.appendChild(radekTlacitko(
        `<span class="hlavni"><strong>${esc(nazev)}</strong>${
          popis ? `<span>${esc(popis)}</span>` : ""}</span><span class="vpravo">›</span>`,
        akce));
    }

    /** 1 stěna, 2 stěny, 5 stěn. */
    function pocetSten(n) {
      return `${n} ${n === 1 ? "stěna" : n >= 2 && n <= 4 ? "stěny" : "stěn"}`;
    }

    /** Nová stěna na konec místnosti — naposledy otevřené, nebo zadané. */
    function pridejStenu(mistnostIndex, delka) {
      const dokument = stav.dokument;
      const mi = Math.min(dokument.mistnosti.length - 1,
        Math.max(0, cislo(mistnostIndex, stav.mistnostIndex)));
      const vMistnosti = stenyMistnosti(dokument, mi);
      const predchozi = vMistnosti.length ? vMistnosti[vMistnosti.length - 1].stena : null;
      dokument.steny.push({
        nazev: `Stěna ${String.fromCharCode(65 + (vMistnosti.length % 26))}`,
        delka_mm: delka || 3600,
        vyska_mm: predchozi ? cislo(predchozi.vyska_mm, 2600) : 2600,
        roh_vlevo: 0, roh_vpravo: 0, mistnost: mi, zatoceni: "dovnitr",
        otvory: [], skrinky: [],
      });
      stav.mistnostIndex = mi;
      zmeneno();
      return dokument.steny.length - 1;
    }

    function pridejStenuAOtevri(mistnostIndex) {
      const index = pridejStenu(mistnostIndex);
      jdi("stena", { index });
    }

    function panelUpravZakazku() {
      const z = stav.dokument.zakazka;
      otevriPanel("Zakázka", `
        <div class="pole"><label for="uz-nazev">Název</label>
          <input id="uz-nazev" type="text" value="${esc(z.nazev)}"></div>
        <div class="pole"><label for="uz-zakaznik">Označení zákazníka</label>
          <input id="uz-zakaznik" type="text" value="${esc(z.oznaceni_zakaznika || "")}"></div>
        <div class="pole"><label for="uz-poznamka">Poznámka</label>
          <textarea id="uz-poznamka" rows="3" maxlength="1000">${esc(z.poznamka || "")}</textarea></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="uz-ulozit">Uložit</button>
        </div>`,
        (panel) => {
          panel.querySelector("#uz-ulozit").addEventListener("click", () => {
            z.nazev = panel.querySelector("#uz-nazev").value.trim() || z.nazev;
            z.oznaceni_zakaznika = panel.querySelector("#uz-zakaznik").value.trim();
            z.poznamka = panel.querySelector("#uz-poznamka").value.trim();
            zavriPanel();
            zmeneno();
            stav.zakazky = null;
            vykresliZakazku({ id: z.id });
            toast("Uloženo.");
          });
        });
    }

    async function kopirujZakazku() {
      // Kopíruje se to, co je na serveru — nejdřív tam tedy pošleme i
      // poslední úpravu, která ještě čeká na uložení.
      if (stav.ukladani !== "cisto") await ulozNaServer();
      const id = stav.dokument.zakazka.id;
      toast("Kopíruji…");
      const { ok, data } = await api(`/api/zakazky/${id}/kopie`, "POST", {})
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(data.chyba || "Kopii se nepodařilo vytvořit."); return; }
      stav.zakazky = null;
      stav.dokument = null;
      toast("Kopie je hotová.");
      jdi("zakazka", { id: data.id });
    }

    async function smazZakazku() {
      const z = stav.dokument.zakazka;
      if (!confirm(`Opravdu smazat zakázku „${z.nazev}“ včetně stěn a kusovníků? `
        + "Krok je nevratný.")) return;
      const { ok, data } = await api(`/api/zakazky/${z.id}`, "DELETE")
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(data.chyba || "Smazání se nepovedlo."); return; }
      zahodKoncept();
      stav.dokument = null;
      stav.zakazky = null;
      toast("Zakázka smazána.");
      jdi("zakazky", {}, true);
    }

    // ── Obrazovka: stěna ───────────────────────────────────────────────
    // Stěna se VŽDY dohledává v dokumentu podle indexu v okamžiku akce, ne
    // přes odkaz zachycený při vykreslení — dokument se mezitím může změnit
    // (vrácení posunu, obnovený koncept, smazaná stěna).
    function aktualniStena(index) {
      return stav.dokument ? (stav.dokument.steny || [])[index] || null : null;
    }

    const mmText = (n) => Math.round(Number(n) || 0).toLocaleString("cs-CZ");
    const omez = (n, min, max) => Math.min(max, Math.max(min, n));

    function pocetKolizi(n) {
      return n === 1 ? "kolize" : n >= 2 && n <= 4 ? "kolize" : "kolizí";
    }

    /** Obří číslo stěny: volné místo ve spodní řadě, při kolizi jejich počet. */
    function cisloSteny(stena, kolizni) {
      if (kolizni.size) {
        return `<p class="stitek">Kolize ve výkresu</p>
          <div class="cislo-radek"><span class="cislo-obri">${kolizni.size}</span>
          <p>${pocetKolizi(kolizni.size)}<br>opravte posunutím ve výkresu</p></div>`;
      }
      return `<p class="stitek">Volné ve spodní řadě</p>
        <div class="cislo-radek"><span class="cislo-obri">${mmText(volnoVeSpodniRade(stena))}</span>
        <p>mm volné<br>stěna ${cislo(stena.delka_mm, 0)} × ${cislo(stena.vyska_mm, 0)} mm</p></div>`;
    }

    function vykresliStenu(parametry) {
      const cil = $("o-stena");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }
      const index = cislo(parametry.index, stav.stenaIndex);
      const stena = aktualniStena(index);
      if (!stena) { jdi("zakazka", { id: stav.dokument.zakazka.id }, true); return; }
      stav.stenaIndex = index;
      stav.mistnostIndex = cislo(stena.mistnost, 0);
      $("titulek").textContent = stena.nazev;
      const uprava = stav.uprava && stav.uprava.stenaIndex === index ? stav.uprava : null;
      if (!uprava) stav.uprava = null;

      cil.innerHTML = `
        <div class="mrizka">
          <div class="s8 sloupec prilepeny">
            ${sekce("01", "Výkres", { klic: "uprava", popisek: uprava ? "Hotovo" : "Upravit ve výkresu" })}
            <div class="karta vykres">
              <div id="st-cislo"></div>
              <div id="st-vykres"></div>
              ${uprava ? `<p class="rozmer koty" id="st-koty" aria-live="polite"></p>
                <div class="posun" id="st-posun"></div>` : ""}
              ${legenda()}
            </div>
            <div id="st-hlasky"></div>
          </div>
          <div class="s4 sloupec">
            ${sekce("02", "Rozměry stěny")}
            <div class="dvojice-poli">
              <div class="pole"><label for="st-delka">Délka (mm)</label>
                <input id="st-delka" type="number" inputmode="numeric" min="200" max="20000"
                       value="${cislo(stena.delka_mm, 3600)}"></div>
              <div class="pole"><label for="st-vyska">Výška (mm)</label>
                <input id="st-vyska" type="number" inputmode="numeric" min="500" max="5000"
                       value="${cislo(stena.vyska_mm, 2600)}"></div>
            </div>
            <div class="pole"><label for="st-nazev">Název stěny</label>
              <input id="st-nazev" type="text" value="${esc(stena.nazev)}"></div>
            <label class="volba"><input type="checkbox" id="st-roh-vlevo"
              ${stena.roh_vlevo ? "checked" : ""}> Roh vlevo (sousední stěna ubírá hloubku korpusu)</label>
            <label class="volba"><input type="checkbox" id="st-roh-vpravo"
              ${stena.roh_vpravo ? "checked" : ""}> Roh vpravo</label>
            <div class="pole"><label for="st-zatoceni">Na konci stěny zatáčí</label>
              <select id="st-zatoceni">
                <option value="dovnitr"${stena.zatoceni !== "ven" ? " selected" : ""}>Dovnitř — běžný roh místnosti</option>
                <option value="ven"${stena.zatoceni === "ven" ? " selected" : ""}>Ven — vnější roh (místnost tvaru L)</option>
              </select>
              <span class="napoveda">Podle toho se v Prostoru skládá půdorys místnosti.</span></div>
            ${sekce("03", "Okna a dveře", { klic: "otvor", popisek: "Přidat" })}
            <div id="seznam-otvoru"></div>
            ${sekce("04", "Skříňky")}
            <div id="seznam-skrinek"></div>
            <p data-ulozeni class="rozmer">Uloženo</p>
            <ul class="seznam" id="akce-steny"></ul>
          </div>
        </div>`;

      obnovVykres(index);
      if (uprava) napojTah(index);

      const napoj = (id, klic, jeCislo) => {
        const prvek = $(id);
        prvek.addEventListener("change", () => {
          const s = aktualniStena(index);
          if (!s) return;
          s[klic] = jeCislo ? cislo(prvek.value, s[klic])
            : (prvek.type === "checkbox" ? (prvek.checked ? 1 : 0) : prvek.value.trim());
          zmeneno();
          vykresliStenu({ index });
        });
      };
      napoj("st-delka", "delka_mm", true);
      napoj("st-vyska", "vyska_mm", true);
      napoj("st-nazev", "nazev", false);
      napoj("st-roh-vlevo", "roh_vlevo", false);
      napoj("st-roh-vpravo", "roh_vpravo", false);
      napoj("st-zatoceni", "zatoceni", false);

      const { kolizni } = kontrolaSteny(stena);
      vykresliSeznamOtvoru(stena, index);
      vykresliSeznamSkrinek(stena, index, kolizni);

      pridejAkci($("akce-steny"), "Prostor a kontrola", "půdorys celé místnosti", () => jdi("prostor"));
      pridejAkci($("akce-steny"), "Smazat stěnu", "i se skříňkami na ní", () => {
        const s = aktualniStena(index);
        if (!s || !confirm(`Opravdu smazat ${s.nazev} i se skříňkami?`)) return;
        stav.dokument.steny.splice(index, 1);
        stav.uprava = null;
        zmeneno();
        toast("Stěna smazána.");
        jdi("zakazka", { id: stav.dokument.zakazka.id }, true);
      });

      napojSekce(cil, {
        otvor: () => panelOtvor(index, -1),
        uprava: () => {
          stav.uprava = uprava ? null : { stenaIndex: index, vybrany: null, zpet: null };
          vykresliStenu({ index });
        },
      });
      prekresliStavUlozeni();
      if (uprava) {
        nastavListu([
          { popisek: "Hotovo", akce: () => { stav.uprava = null; vykresliStenu({ index }); } },
          { popisek: "Vrátit posun", vedlejsi: true, zakazane: !uprava.zpet, akce: vratPosun },
        ]);
      } else {
        nastavListu([{ popisek: "Přidat skříňku", akce: () => panelSkrinka(index, -1) }]);
      }
    }

    // Okna a dveře: na telefonu a tabletu seznam řádků, na notebooku tabulka.
    function vykresliSeznamOtvoru(stena, index) {
      const misto = $("seznam-otvoru");
      const otvory = stena.otvory || [];
      if (!otvory.length) {
        misto.innerHTML = `<p class="popisek">Žádné okno ani dveře. Přidejte je, ať vidíte,
          kam skříňka nesmí.</p>`;
        return;
      }
      const seznam = document.createElement("ul");
      seznam.className = "seznam bez-notebooku";
      otvory.forEach((o, i) => {
        seznam.appendChild(radekTlacitko(
          `<span class="hlavni">
           <strong>${o.typ === "dvere" ? "Dveře" : "Okno"} ${cislo(o.sirka_mm, 0)} × ${cislo(o.vyska_mm, 0)} mm</strong>
           <span>od ${cislo(o.odsazeni_mm, 0)} mm${o.typ === "dvere" ? ""
             : " · parapet " + cislo(o.parapet_mm, 0) + " mm"}</span>
           </span><span class="vpravo">›</span>`,
          () => panelOtvor(index, i)));
      });
      misto.appendChild(seznam);
      misto.appendChild(tabulkaPrvku(otvory.map((o, i) => ({
        nazev: o.typ === "dvere" ? "Dveře" : "Okno",
        od: cislo(o.odsazeni_mm, 0),
        rozmer: `${cislo(o.sirka_mm, 0)} × ${cislo(o.vyska_mm, 0)}${o.typ === "dvere" ? ""
          : " · P " + cislo(o.parapet_mm, 0)}`,
        akce: () => panelOtvor(index, i),
      }))));
    }

    function vykresliSeznamSkrinek(stena, index, kolizni) {
      const misto = $("seznam-skrinek");
      const skrinky = stena.skrinky || [];
      if (!skrinky.length) {
        misto.innerHTML = `<div class="prazdno">${ikona("skrinka")}
          <p>Zatím žádná skříňka. Přidejte první — rozměry jsou předvyplněné.</p></div>`;
        const pridat = document.createElement("button");
        pridat.type = "button";
        pridat.className = "tlacitko vedlejsi";
        pridat.textContent = "Přidat skříňku";
        pridat.addEventListener("click", () => panelSkrinka(index, -1));
        misto.querySelector(".prazdno").appendChild(pridat);
        return;
      }
      const seznam = document.createElement("ul");
      seznam.className = "seznam bez-notebooku";
      skrinky.forEach((sk, i) => {
        seznam.appendChild(radekTlacitko(
          `<span class="poradi">${String(i + 1).padStart(2, "0")}</span>
           ${ikona("skrinka")}<span class="hlavni">
           <strong>${esc(TYPY_SKRINEK[sk.typ] || "Skříňka")}
             ${sk.sirka_mm} × ${sk.vyska_mm} × ${sk.hloubka_mm}</strong>
           <span>od ${cislo(sk.odsazeni_mm, 0)} mm · ${sk.pocet_polic}× police ·
             ${sk.pocet_dvirek}× dvířka${sk.pocet_zasuvek ? " · " + sk.pocet_zasuvek + "× zásuvka" : ""}</span>
           </span><span class="vpravo">${kolizni.has(i) ? "⚠" : "›"}</span>`,
          () => panelSkrinka(index, i)));
      });
      misto.appendChild(seznam);
      misto.appendChild(tabulkaPrvku(skrinky.map((sk, i) => ({
        nazev: `${String(i + 1).padStart(2, "0")} ${TYPY_SKRINEK[sk.typ] || "Skříňka"}${kolizni.has(i) ? " ⚠" : ""}`,
        od: cislo(sk.odsazeni_mm, 0),
        rozmer: `${sk.sirka_mm} × ${sk.vyska_mm} × ${sk.hloubka_mm}`,
        akce: () => panelSkrinka(index, i),
      }))));
    }

    function tabulkaPrvku(radky) {
      const obal = document.createElement("div");
      obal.className = "tabulka-obal jen-notebook";
      obal.innerHTML = `<table class="tabulka"><thead><tr><th>Prvek</th><th>Od</th>
        <th>Š × V × H</th></tr></thead><tbody></tbody></table>`;
      const telo = obal.querySelector("tbody");
      for (const r of radky) {
        const tr = document.createElement("tr");
        const prvni = document.createElement("td");
        const tlacitko = document.createElement("button");
        tlacitko.type = "button";
        tlacitko.className = "bunka-akce";
        tlacitko.textContent = r.nazev;
        tlacitko.addEventListener("click", r.akce);
        prvni.appendChild(tlacitko);
        const od = document.createElement("td");
        od.className = "rozmer-bunka";
        od.textContent = `${r.od}`;
        const rozmer = document.createElement("td");
        rozmer.className = "rozmer-bunka";
        rozmer.textContent = r.rozmer;
        tr.append(prvni, od, rozmer);
        telo.appendChild(tr);
      }
      return obal;
    }

    // ── Úpravy ve výkresu ──────────────────────────────────────────────
    /** Překreslí jen výkres, obří číslo, kóty a varování — během tahu prstem. */
    function obnovVykres(index, viewBox) {
      const stena = aktualniStena(index);
      const misto = $("st-vykres");
      if (!stena || !misto) return;
      const u = stav.uprava && stav.uprava.stenaIndex === index ? stav.uprava : null;
      const { kolizni, hlasky } = kontrolaSteny(stena);
      const fokus = document.activeElement && misto.contains(document.activeElement)
        ? document.activeElement.getAttribute("data-prvek") : null;

      misto.innerHTML = nakresliPohled(stena, stav.standard, kolizni, {
        upravy: !!u, vybrany: u ? u.vybrany : null,
        sirkaPx: misto.clientWidth || 360, viewBox,
      });
      $("st-cislo").innerHTML = cisloSteny(stena, kolizni);
      $("st-hlasky").innerHTML = hlasky.length
        ? `<div class="hlaska varovani">${hlasky.map(esc).join("<br>")}</div>` : "";
      if (!u) return;
      $("st-koty").textContent = u.vybrany
        ? kotyPrvku(stena, u.vybrany.druh, u.vybrany.index, stav.standard)
        : "Klepněte na skříňku, okno, dveře nebo na úchyt stěny vpravo a nahoře.";
      vykresliPosun(index);
      if (fokus) {
        const znovu = misto.querySelector(`[data-prvek="${fokus}"]`);
        if (znovu) znovu.focus({ preventScroll: true });
      }
    }

    // Šipky pod výkresem: posun vybraného prvku po 10 mm. Přesné číslo jde
    // dál zadat v panelu — tohle je na doladění u zákazníka palcem.
    const SMERY_POSUNU = {
      vlevo: { znak: "←", popis: "doleva", dx: -10, dy: 0 },
      vpravo: { znak: "→", popis: "doprava", dx: 10, dy: 0 },
      nahoru: { znak: "↑", popis: "nahoru", dx: 0, dy: 10 },
      dolu: { znak: "↓", popis: "dolů", dx: 0, dy: -10 },
    };

    function vykresliPosun(index) {
      const misto = $("st-posun");
      if (!misto) return;
      misto.innerHTML = "";
      const u = stav.uprava;
      if (!u || !u.vybrany) return;
      const stena = aktualniStena(index);
      const { druh, index: i } = u.vybrany;
      let nazev = "";
      let smery = ["vlevo", "vpravo"];
      if (druh === "skrinka") {
        const sk = (stena.skrinky || [])[i];
        nazev = sk ? `${TYPY_SKRINEK[sk.typ] || "Skříňka"} ${sk.sirka_mm}` : "";
      } else if (druh === "otvor") {
        const o = (stena.otvory || [])[i];
        nazev = o ? `${o.typ === "dvere" ? "Dveře" : "Okno"} ${cislo(o.sirka_mm, 0)}` : "";
        if (o && o.typ !== "dvere") smery = ["vlevo", "vpravo", "nahoru", "dolu"];
      } else if (druh === "delka") {
        nazev = "Délka stěny";
      } else {
        nazev = "Výška stěny";
        smery = ["nahoru", "dolu"];
      }
      const popisek = document.createElement("span");
      popisek.className = "rozmer";
      popisek.textContent = `${nazev} · po 10 mm`;
      misto.appendChild(popisek);
      for (const klic of smery) {
        const smer = SMERY_POSUNU[klic];
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tlacitko ikona";
        b.dataset.smer = klic;
        b.textContent = smer.znak;
        b.setAttribute("aria-label", `Posunout ${smer.popis} o 10 mm`);
        b.addEventListener("click", () => {
          posunVybrany(index, smer.dx, smer.dy);
          const zpet = $("st-posun") && $("st-posun").querySelector(`[data-smer="${klic}"]`);
          if (zpet) zpet.focus({ preventScroll: true });
        });
        misto.appendChild(b);
      }
    }

    function zapamatujZpet(index) {
      if (!stav.uprava) return;
      stav.uprava.zpet = { stenaIndex: index, stena: JSON.parse(JSON.stringify(aktualniStena(index))) };
    }

    function vratPosun() {
      const u = stav.uprava;
      if (!u || !u.zpet || !stav.dokument.steny[u.zpet.stenaIndex]) return;
      stav.dokument.steny[u.zpet.stenaIndex] = u.zpet.stena;
      u.zpet = null;
      zmeneno();
      vykresliStenu({ index: u.stenaIndex });
      toast("Posun vrácen.");
    }

    /** Posun šipkou (tlačítko nebo klávesnice): o dx/dy mm, bez přichytávání. */
    function posunVybrany(index, dx, dy) {
      const stena = aktualniStena(index);
      const u = stav.uprava;
      if (!stena || !u || !u.vybrany) return;
      const { druh, index: i } = u.vybrany;
      // Šipka, která s prvkem nic neudělá (nahoru u skříňky), nesmí přepsat
      // „Vrátit posun“ předchozího tahu.
      if (druh === "skrinka" && (!dx || !(stena.skrinky || [])[i])) return;
      if (druh === "otvor") {
        const o = (stena.otvory || [])[i];
        if (!o || (o.typ === "dvere" && !dx)) return;
      }
      if ((druh === "delka" && !dx) || (druh === "vyska" && !dy)) return;
      zapamatujZpet(index);
      if (druh === "skrinka") {
        const s = stena.skrinky[i];
        s.odsazeni_mm = Math.max(0, cislo(s.odsazeni_mm, 0) + dx);
      } else if (druh === "otvor") {
        const o = stena.otvory[i];
        o.odsazeni_mm = Math.max(0, cislo(o.odsazeni_mm, 0) + dx);
        if (o.typ !== "dvere") o.parapet_mm = Math.max(0, cislo(o.parapet_mm, 0) + dy);
      } else if (druh === "delka") {
        stena.delka_mm = omez(cislo(stena.delka_mm, 3600) + dx, 200, 20000);
      } else if (druh === "vyska") {
        stena.vyska_mm = omez(cislo(stena.vyska_mm, 2600) + dy, 500, 5000);
      }
      zmeneno();
      vykresliStenu({ index });
    }

    /** Tah prstem: poloha z původní hodnoty + posun, s přichytáváním. */
    function nastavTahem(stena, tah, dx, dy) {
      const puv = tah.puvodni;
      const i = tah.index;
      if (tah.druh === "skrinka") {
        const s = (stena.skrinky || [])[i];
        const p = (puv.skrinky || [])[i];
        if (!s || !p) return;
        s.odsazeni_mm = Math.max(0, prichytniUsek(cislo(p.odsazeni_mm, 0) + dx,
          cislo(p.sirka_mm, 0), hranyNaStene(stena, "skrinka", i)));
      } else if (tah.druh === "otvor") {
        const o = (stena.otvory || [])[i];
        const p = (puv.otvory || [])[i];
        if (!o || !p) return;
        o.odsazeni_mm = Math.max(0, prichytniUsek(cislo(p.odsazeni_mm, 0) + dx,
          cislo(p.sirka_mm, 0), hranyNaStene(stena, "otvor", i)));
        if (o.typ !== "dvere") o.parapet_mm = Math.max(0, prichytni(cislo(p.parapet_mm, 0) + dy, []));
      } else if (tah.druh === "delka") {
        // Bez obou konců stěny: pravý konec se právě hýbe a přichytával by sám k sobě.
        const hrany = hranyNaStene(stena, "delka").slice(2);
        stena.delka_mm = omez(prichytni(cislo(puv.delka_mm, 3600) + dx, hrany), 200, 20000);
      } else if (tah.druh === "vyska") {
        stena.vyska_mm = omez(prichytni(cislo(puv.vyska_mm, 2600) + dy, []), 500, 5000);
      }
    }

    function popisPosunu(stena, druh, i) {
      if (druh === "skrinka") {
        return `Skříňka posunuta na ${mmText((stena.skrinky[i] || {}).odsazeni_mm)} mm.`;
      }
      if (druh === "otvor") {
        const o = stena.otvory[i] || {};
        return o.typ === "dvere" ? `Dveře posunuty na ${mmText(o.odsazeni_mm)} mm.`
          : `Okno posunuto na ${mmText(o.odsazeni_mm)} mm, parapet ${mmText(o.parapet_mm)} mm.`;
      }
      if (druh === "delka") return `Délka stěny ${mmText(stena.delka_mm)} mm.`;
      return `Výška stěny ${mmText(stena.vyska_mm)} mm.`;
    }

    function napojTah(index) {
      const misto = $("st-vykres");
      let tah = null;

      const vyber = (prvekSvg) => {
        if (!stav.uprava) return null;
        if (!prvekSvg) { stav.uprava.vybrany = null; return null; }
        const [druh, i] = prvekSvg.getAttribute("data-prvek").split(":");
        stav.uprava.vybrany = { druh, index: Number(i) };
        return stav.uprava.vybrany;
      };

      misto.addEventListener("pointerdown", (u) => {
        if (u.button !== undefined && u.button > 0) return;
        const svg = misto.querySelector("svg");
        const stena = aktualniStena(index);
        if (!svg || !stena) return;
        const vybrany = vyber(u.target.closest ? u.target.closest("[data-prvek]") : null);
        const matice = svg.getScreenCTM();
        const vb = svg.viewBox && svg.viewBox.baseVal;
        const viewBox = vb ? [vb.x, vb.y, vb.width, vb.height] : null;
        if (!vybrany || !matice) { obnovVykres(index); return; }
        const inverzni = matice.inverse();
        tah = {
          druh: vybrany.druh, index: vybrany.index, pointerId: u.pointerId,
          start: new DOMPoint(u.clientX, u.clientY).matrixTransform(inverzni),
          startX: u.clientX, startY: u.clientY, inverzni, viewBox,
          puvodni: JSON.parse(JSON.stringify(stena)), pohnuto: false,
        };
        try { misto.setPointerCapture(u.pointerId); } catch { /* starší prohlížeč */ }
        u.preventDefault();
        obnovVykres(index, viewBox);
      });

      misto.addEventListener("pointermove", (u) => {
        if (!tah || u.pointerId !== tah.pointerId) return;
        // Pár pixelů je chvění prstu při klepnutí, ne posun.
        if (!tah.pohnuto && Math.hypot(u.clientX - tah.startX, u.clientY - tah.startY) < 6) return;
        tah.pohnuto = true;
        // Převod pixelů na milimetry podle AKTUÁLNÍHO výkresu: když se stěna
        // úchytem prodlouží, výkres se zmenší a stará převodní matice by
        // úchyt nechala zaostávat za prstem.
        const svg = misto.querySelector("svg");
        const matice = svg && svg.getScreenCTM();
        const inverzni = matice ? matice.inverse() : tah.inverzni;
        const start = new DOMPoint(tah.startX, tah.startY).matrixTransform(inverzni);
        const p = new DOMPoint(u.clientX, u.clientY).matrixTransform(inverzni);
        const stena = aktualniStena(index);
        if (!stena) return;
        nastavTahem(stena, tah, p.x - start.x, -(p.y - start.y));
        obnovVykres(index, tah.viewBox);
      });

      const konec = (u) => {
        if (!tah || u.pointerId !== tah.pointerId) return;
        const hotovy = tah;
        tah = null;
        if (!hotovy.pohnuto) return;   // jen klepnutí = výběr
        const stena = aktualniStena(index);
        if (!stena || !stav.uprava) return;
        // Jedno uložení na celý tah, ne na každý pohyb prstu.
        stav.uprava.zpet = { stenaIndex: index, stena: hotovy.puvodni };
        zmeneno();
        vykresliStenu({ index });
        toast(popisPosunu(stena, hotovy.druh, hotovy.index));
      };
      misto.addEventListener("pointerup", konec);
      misto.addEventListener("pointercancel", konec);

      // Klávesnice: Tab na prvek, Enter nebo mezerník ho vybere.
      misto.addEventListener("keydown", (u) => {
        if (u.key !== "Enter" && u.key !== " ") return;
        const prvekSvg = u.target.closest ? u.target.closest("[data-prvek]") : null;
        if (!prvekSvg) return;
        u.preventDefault();
        vyber(prvekSvg);
        obnovVykres(index);
      });
    }

    // Šipky na klávesnici posouvají vybraný prvek: 10 mm, se Shiftem 100 mm.
    document.addEventListener("keydown", (u) => {
      if (aktualni.nazev !== "stena" || !stav.uprava || !stav.uprava.vybrany) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(u.target.tagName || "")) return;
      if ($("panel-misto").children.length) return;
      const krok = u.shiftKey ? 100 : 10;
      const smer = { ArrowLeft: [-krok, 0], ArrowRight: [krok, 0],
        ArrowUp: [0, krok], ArrowDown: [0, -krok] }[u.key];
      if (!smer) return;
      u.preventDefault();
      posunVybrany(stav.uprava.stenaIndex, smer[0], smer[1]);
      const prvekSvg = $("st-vykres") && $("st-vykres").querySelector(
        `[data-prvek="${stav.uprava.vybrany.druh}:${stav.uprava.vybrany.index}"]`);
      if (prvekSvg) prvekSvg.focus({ preventScroll: true });
    });

    function panelOtvor(stenaIndex, poradi) {
      const stena = aktualniStena(stenaIndex);
      if (!stena) return;
      const novy = poradi < 0;
      const delka = cislo(stena.delka_mm, 3600);
      const o = novy
        ? { typ: "okno", odsazeni_mm: delka >= 2400 ? 1200 : Math.max(0, Math.round((delka - 1200) / 20) * 10),
          sirka_mm: Math.min(1200, delka), vyska_mm: 1400, parapet_mm: 900 }
        : { ...stena.otvory[poradi] };
      otevriPanel(novy ? "Nové okno nebo dveře" : "Okno nebo dveře", `
        <div class="pole"><label for="ot-typ">Typ</label>
          <select id="ot-typ">
            <option value="okno"${o.typ === "okno" ? " selected" : ""}>Okno</option>
            <option value="dvere"${o.typ === "dvere" ? " selected" : ""}>Dveře</option>
          </select></div>
        <div class="trojice">
          <div class="pole"><label for="ot-odsazeni">Od kraje</label>
            <input id="ot-odsazeni" type="number" inputmode="numeric" value="${o.odsazeni_mm}"></div>
          <div class="pole"><label for="ot-sirka">Šířka</label>
            <input id="ot-sirka" type="number" inputmode="numeric" value="${o.sirka_mm}"></div>
          <div class="pole"><label for="ot-vyska">Výška</label>
            <input id="ot-vyska" type="number" inputmode="numeric" value="${o.vyska_mm}"></div>
        </div>
        <div class="pole"><label for="ot-parapet">Parapet nad podlahou (mm)</label>
          <input id="ot-parapet" type="number" inputmode="numeric" value="${o.parapet_mm}">
          <span class="napoveda">U dveří se parapet nepoužije.</span></div>
        <div id="ot-chyba" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="ot-ulozit">${novy ? "Přidat na stěnu" : "Uložit"}</button>
          ${novy ? "" : `<button type="button" class="tlacitko varovne" id="ot-smazat">Smazat</button>`}
        </div>`,
        (panel) => {
          panel.querySelector("#ot-ulozit").addEventListener("click", () => {
            // Stěna se dohledá TEĎ, ne při otevření panelu (viz aktualniStena).
            const s = aktualniStena(stenaIndex);
            if (!s) { zavriPanel(); return; }
            const novyOtvor = {
              typ: panel.querySelector("#ot-typ").value === "dvere" ? "dvere" : "okno",
              odsazeni_mm: Math.max(0, cislo(panel.querySelector("#ot-odsazeni").value, 0)),
              sirka_mm: cislo(panel.querySelector("#ot-sirka").value, 0),
              vyska_mm: cislo(panel.querySelector("#ot-vyska").value, 0),
              parapet_mm: Math.max(0, cislo(panel.querySelector("#ot-parapet").value, 900)),
            };
            const dvere = novyOtvor.typ === "dvere";
            const chyba = panel.querySelector("#ot-chyba");
            panel.querySelectorAll(".pole").forEach((p) => p.classList.remove("chybne"));
            const oznac = (text, ...pole) => {
              chyba.className = "hlaska chyba";
              chyba.textContent = text;
              for (const id of pole) panel.querySelector("#" + id).closest(".pole").classList.add("chybne");
            };
            if (novyOtvor.sirka_mm < 50 || novyOtvor.vyska_mm < 50) {
              oznac("Šířka i výška musí být aspoň 50 mm.", "ot-sirka", "ot-vyska");
              return;
            }
            const presahDelky = novyOtvor.odsazeni_mm + novyOtvor.sirka_mm - cislo(s.delka_mm, 0);
            if (presahDelky > 0) {
              oznac(`${dvere ? "Dveře přesahují" : "Okno přesahuje"} stěnu o ${presahDelky} mm.`,
                "ot-odsazeni", "ot-sirka");
              return;
            }
            const presahVysky = (dvere ? 0 : novyOtvor.parapet_mm) + novyOtvor.vyska_mm
              - cislo(s.vyska_mm, 0);
            if (presahVysky > 0) {
              oznac(`${dvere ? "Dveře sahají" : "Okno sahá"} výš než stěna o ${presahVysky} mm.`,
                "ot-vyska", ...(dvere ? [] : ["ot-parapet"]));
              return;
            }
            if (!Array.isArray(s.otvory)) s.otvory = [];
            if (novy || !s.otvory[poradi]) s.otvory.push(novyOtvor);
            else s.otvory[poradi] = novyOtvor;
            zavriPanel();
            zmeneno();
            vykresliStenu({ index: stenaIndex });
            toast(novy ? (dvere ? "Dveře přidány." : "Okno přidáno.")
              : (dvere ? "Dveře uloženy." : "Okno uloženo."));
          });
          const smazat = panel.querySelector("#ot-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              const s = aktualniStena(stenaIndex);
              if (s && s.otvory && s.otvory[poradi]) s.otvory.splice(poradi, 1);
              if (stav.uprava && stav.uprava.vybrany && stav.uprava.vybrany.druh === "otvor") {
                stav.uprava.vybrany = null;
              }
              zavriPanel();
              zmeneno();
              vykresliStenu({ index: stenaIndex });
              toast("Smazáno.");
            });
          }
        });
    }

    function panelSkrinka(stenaIndex, poradi) {
      const stena = aktualniStena(stenaIndex);
      if (!stena) return;
      const novy = poradi < 0;
      const predchozi = (stena.skrinky || [])[(stena.skrinky || []).length - 1];
      const sk = novy
        ? {
            typ: "spodni",
            odsazeni_mm: predchozi
              ? cislo(predchozi.odsazeni_mm, 0) + cislo(predchozi.sirka_mm, 600) : 0,
            ...VYCHOZI_ROZMERY.spodni,
            pocet_zasuvek: 0, zasuvka_vyska_mm: 140, zada_typ_prepis: "",
            material_id: null, poznamka: "",
          }
        : { ...stena.skrinky[poradi] };

      const volbyMaterialu = [`<option value="">Výchozí (LTD ${
        stav.standard ? stav.standard.tloustka_mm : 18} mm)</option>`]
        .concat(stav.materialy.map((m) =>
          `<option value="${m.id}"${Number(sk.material_id) === m.id ? " selected" : ""}>`
          + `${esc(m.nazev)}</option>`)).join("");

      otevriPanel(novy ? "Nová skříňka" : "Skříňka", `
        <div class="trojice">
          <div class="pole"><label for="sk-sirka">Šířka</label>
            <input id="sk-sirka" type="number" inputmode="numeric" min="100" max="1400"
                   value="${cislo(sk.sirka_mm, 600)}"></div>
          <div class="pole"><label for="sk-vyska">Výška</label>
            <input id="sk-vyska" type="number" inputmode="numeric" min="100" max="2600"
                   value="${cislo(sk.vyska_mm, 720)}"></div>
          <div class="pole"><label for="sk-hloubka">Hloubka</label>
            <input id="sk-hloubka" type="number" inputmode="numeric" min="100" max="900"
                   value="${cislo(sk.hloubka_mm, 510)}"></div>
        </div>
        <p class="popisek">Rozměry korpusu v mm, hloubka bez dvířek.</p>
        <div class="pole"><label for="sk-typ">Typ</label>
          <select id="sk-typ">${Object.keys(TYPY_SKRINEK).map((t) =>
            `<option value="${t}"${sk.typ === t ? " selected" : ""}>${TYPY_SKRINEK[t]}</option>`).join("")}
          </select></div>
        <div class="pole"><label for="sk-odsazeni">Odsazení od levého kraje stěny (mm)</label>
          <input id="sk-odsazeni" type="number" inputmode="numeric" value="${cislo(sk.odsazeni_mm, 0)}"></div>
        <div class="trojice">
          <div class="pole"><label for="sk-police">Police</label>
            <input id="sk-police" type="number" inputmode="numeric" min="0" max="12"
                   value="${cislo(sk.pocet_polic, 0)}"></div>
          <div class="pole"><label for="sk-dvirka">Dvířka</label>
            <input id="sk-dvirka" type="number" inputmode="numeric" min="0" max="4"
                   value="${cislo(sk.pocet_dvirek, 0)}"></div>
          <div class="pole"><label for="sk-zasuvky">Zásuvky</label>
            <input id="sk-zasuvky" type="number" inputmode="numeric" min="0" max="8"
                   value="${cislo(sk.pocet_zasuvek, 0)}"></div>
        </div>
        <div class="pole"><label for="sk-celo">Výška čela zásuvky (mm)</label>
          <input id="sk-celo" type="number" inputmode="numeric" min="50" max="600"
                 value="${cislo(sk.zasuvka_vyska_mm, 140)}">
          <span class="napoveda">Použije se, když má skříňka zásuvky i dvířka —
          zásuvky sedí nahoře, dvířka doberou zbytek.</span></div>
        <div class="pole"><label for="sk-material">Materiál</label>
          <select id="sk-material">${volbyMaterialu}</select></div>
        <div class="pole"><label for="sk-zada">Záda</label>
          <select id="sk-zada">
            <option value=""${!sk.zada_typ_prepis ? " selected" : ""}>Podle standardu</option>
            <option value="drazka"${sk.zada_typ_prepis === "drazka" ? " selected" : ""}>Do drážky</option>
            <option value="nasazena"${sk.zada_typ_prepis === "nasazena" ? " selected" : ""}>Nasazená</option>
          </select></div>
        <div id="sk-chyba" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="sk-ulozit">Uložit skříňku</button>
          ${novy ? "" : `<button type="button" class="tlacitko varovne" id="sk-smazat">Smazat skříňku</button>`}
        </div>`,
        (panel) => {
          panel.querySelector("#sk-typ").addEventListener("change", (u) => {
            const vychozi = VYCHOZI_ROZMERY[u.target.value];
            if (!vychozi) return;
            panel.querySelector("#sk-sirka").value = vychozi.sirka_mm;
            panel.querySelector("#sk-vyska").value = vychozi.vyska_mm;
            panel.querySelector("#sk-hloubka").value = vychozi.hloubka_mm;
            panel.querySelector("#sk-police").value = vychozi.pocet_polic;
            panel.querySelector("#sk-dvirka").value = vychozi.pocet_dvirek;
          });

          panel.querySelector("#sk-ulozit").addEventListener("click", () => {
            const chyba = panel.querySelector("#sk-chyba");
            const sirka = cislo(panel.querySelector("#sk-sirka").value, 0);
            const vyska = cislo(panel.querySelector("#sk-vyska").value, 0);
            const hloubka = cislo(panel.querySelector("#sk-hloubka").value, 0);
            const meze = [
              [sirka, 100, 1400, "Šířka", "sk-sirka"],
              [vyska, 100, 2600, "Výška", "sk-vyska"],
              [hloubka, 100, 900, "Hloubka", "sk-hloubka"],
            ];
            panel.querySelectorAll(".pole").forEach((p) => p.classList.remove("chybne"));
            for (const [hodnota, min, max, nazev, idPole] of meze) {
              if (hodnota < min || hodnota > max) {
                chyba.className = "hlaska chyba";
                chyba.textContent = `${nazev} musí být ${min}–${max} mm.`;
                panel.querySelector("#" + idPole).closest(".pole").classList.add("chybne");
                return;
              }
            }
            const nova = {
              typ: panel.querySelector("#sk-typ").value,
              odsazeni_mm: Math.max(0, cislo(panel.querySelector("#sk-odsazeni").value, 0)),
              sirka_mm: sirka, vyska_mm: vyska, hloubka_mm: hloubka,
              pocet_polic: Math.max(0, cislo(panel.querySelector("#sk-police").value, 0)),
              pocet_dvirek: Math.max(0, cislo(panel.querySelector("#sk-dvirka").value, 0)),
              pocet_zasuvek: Math.max(0, cislo(panel.querySelector("#sk-zasuvky").value, 0)),
              zasuvka_vyska_mm: cislo(panel.querySelector("#sk-celo").value, 140),
              zada_typ_prepis: panel.querySelector("#sk-zada").value,
              material_id: panel.querySelector("#sk-material").value
                ? Number(panel.querySelector("#sk-material").value) : null,
              poznamka: sk.poznamka || "",
            };
            // Stěna se dohledá TEĎ, ne při otevření panelu (viz aktualniStena).
            const s = aktualniStena(stenaIndex);
            if (!s) { zavriPanel(); return; }
            if (!Array.isArray(s.skrinky)) s.skrinky = [];
            if (novy || !s.skrinky[poradi]) s.skrinky.push(nova);
            else s.skrinky[poradi] = nova;
            zavriPanel();
            zmeneno();
            vykresliStenu({ index: stenaIndex });
            toast("Skříňka uložena.");
          });

          const smazat = panel.querySelector("#sk-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              const s = aktualniStena(stenaIndex);
              if (s && s.skrinky && s.skrinky[poradi]) s.skrinky.splice(poradi, 1);
              if (stav.uprava && stav.uprava.vybrany && stav.uprava.vybrany.druh === "skrinka") {
                stav.uprava.vybrany = null;
              }
              zavriPanel();
              zmeneno();
              vykresliStenu({ index: stenaIndex });
              toast("Skříňka smazána.");
            });
          }
        });
    }

    // ── Obrazovka: prostor ─────────────────────────────────────────────
    // Celý zadaný prostor: půdorys všech místností zakázky, kontrola, jestli
    // se naměřené stěny sejdou, a rozvinutý pohled vybrané místnosti.

    /** Při víc místnostech nese varování i název místnosti („Spíž · Stěna A“). */
    function stenaSPredponou(stena) {
      const mistnosti = (stav.dokument && stav.dokument.mistnosti) || [];
      if (mistnosti.length < 2) return stena;
      const m = mistnosti[cislo(stena.mistnost, 0)];
      return { ...stena, nazev: `${m ? m.nazev : "Místnost"} · ${stena.nazev}` };
    }

    function obrysVybrane(dokument, mi) {
      return obrysMistnosti(dokument.mistnosti[mi], stenyMistnosti(dokument, mi));
    }

    const plochaText = (m2) => Number(m2).toLocaleString("cs-CZ",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    /** Obří číslo Prostoru — výsledek kontroly měření vybrané místnosti. */
    function cisloProstoru(o, mistnost) {
      const nazev = esc(mistnost.nazev);
      const n = o.zdi.length;
      if (o.stav === "sedi") {
        return `<p class="stitek">Měření se uzavírá</p>
          <div class="cislo-radek"><span class="cislo-obri">Sedí</span>
          <p>${plochaText(o.plocha_m2)} m² podlahy<br>${nazev} · ${pocetSten(n)}</p></div>`;
      }
      if (o.stav === "chybi" || o.stav === "odchylka") {
        return `<p class="stitek">Odchylka uzavření</p>
          <div class="cislo-radek"><span class="cislo-obri">${mmText(o.odchylka_mm)}</span>
          <p>mm · ${o.stav === "chybi" ? `chybí stěna ${mmText(o.chybejici_mm)} mm`
            : "zkontrolujte délky stěn"}<br>${nazev} · ${pocetSten(n)}</p></div>`;
      }
      if (o.stav === "otevreny") {
        return `<p class="stitek">Otevřený půdorys</p>
          <div class="cislo-radek"><span class="cislo-obri">${n}</span>
          <p>${pocetSten(n).replace(/^\d+ /, "")} · otevřený půdorys<br>${nazev}</p></div>`;
      }
      return `<p class="stitek">Místnost bez stěn</p>
        <div class="cislo-radek"><span class="cislo-obri">0</span>
        <p>stěn · ${nazev}<br>přidejte první stěnu</p></div>`;
    }

    function popisMistnosti(o) {
      if (o.stav === "sedi") return `${pocetSten(o.zdi.length)} · ${plochaText(o.plocha_m2)} m²`;
      if (o.stav === "chybi") return `${pocetSten(o.zdi.length)} · chybí stěna ${mmText(o.chybejici_mm)} mm`;
      if (o.stav === "odchylka") return `${pocetSten(o.zdi.length)} · odchylka ${mmText(o.odchylka_mm)} mm`;
      if (o.stav === "otevreny") return `${pocetSten(o.zdi.length)} · otevřený půdorys`;
      return "zatím bez stěn";
    }

    async function vykresliProstor() {
      const cil = $("o-prostor");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }
      const dokument = stav.dokument;
      if (!stav.standard) {
        cil.innerHTML = `<div class="kostra kostra-vykres"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        await nactiStandard();
        if (aktualni.nazev !== "prostor" || stav.dokument !== dokument) return;
      }
      const zpet = { popisek: "Zpět na zakázku", vedlejsi: true,
        akce: () => jdi("zakazka", { id: dokument.zakazka.id }, true) };

      if (!(dokument.steny || []).length) {
        cil.innerHTML = `<div class="prazdno">${ikona("oko")}
          <p>Přidejte stěnu, ať je co ukázat.</p></div>`;
        const pridat = document.createElement("button");
        pridat.type = "button";
        pridat.className = "tlacitko";
        pridat.textContent = "Přidat stěnu";
        pridat.addEventListener("click", () => pridejStenuAOtevri());
        cil.querySelector(".prazdno").appendChild(pridat);
        nastavListu([zpet]);
        return;
      }

      stav.mistnostIndex = Math.min(dokument.mistnosti.length - 1, Math.max(0, stav.mistnostIndex));
      if (dokument.mistnosti.length < 2) stav.rozmistovani = false;
      const mi = stav.mistnostIndex;
      const mistnost = dokument.mistnosti[mi];
      const rozvinuty = stav.prostorRezim === "rozvinuty";

      let o;
      let pudorys;
      let rozvinutaKresba;
      try {
        o = obrysVybrane(dokument, mi);
        pudorys = nakresliPudorys(dokument, { rozmistovani: stav.rozmistovani, vybranaMistnost: mi });
        rozvinutaKresba = nakresliRozvinuty(dokument, mi, stav.standard);
      } catch {
        cil.innerHTML = `<div class="hlaska chyba">Půdorys se nepodařilo vykreslit — zkontrolujte
          délky stěn.</div><ul class="seznam" id="pr-steny"></ul>`;
        dokument.steny.forEach((stena, index) => $("pr-steny").appendChild(radekTlacitko(
          `<span class="hlavni"><strong>${esc(stena.nazev)}</strong>
           <span>${cislo(stena.delka_mm, 0)} × ${cislo(stena.vyska_mm, 0)} mm</span></span>
           <span class="vpravo">›</span>`, () => jdi("stena", { index }))));
        nastavListu([zpet]);
        return;
      }

      const hlasky = [];
      dokument.mistnosti.forEach((m, i) => {
        const oi = obrysVybrane(dokument, i);
        if (oi.stav === "chybi") {
          hlasky.push(`${m.nazev}: chybí stěna ${mmText(oi.chybejici_mm)} mm`
            + (oi.odchylka_mm ? ` a stěny se míjejí o ${mmText(oi.odchylka_mm)} mm.` : "."));
        } else if (oi.stav === "odchylka") {
          hlasky.push(`${m.nazev}: stěny se nesejdou o ${mmText(oi.odchylka_mm)} mm — zkontrolujte délky.`);
        }
      });
      for (const stena of dokument.steny) {
        for (const h of kontrolaSteny(stenaSPredponou(stena)).hlasky) hlasky.push(h);
      }
      const uzavrene = dokument.mistnosti.some((m, i) => obrysVybrane(dokument, i).stav === "sedi");

      cil.innerHTML = `
        <div class="mrizka">
          <div class="s8 sloupec prilepeny">
            ${sekce("01", rozvinuty ? "Rozvinutý pohled" : "Půdorys",
              { klic: "prepni", popisek: rozvinuty ? "Půdorys" : "Rozvinutý pohled" })}
            <div class="karta vykres">
              ${cisloProstoru(o, mistnost)}
              <div class="${rozvinuty ? "jen-notebook" : ""}">
                <div id="pr-pudorys">${pudorys.svg}</div>
                <p class="vykres-popis">${stav.rozmistovani
                  ? "Táhněte místnost · rohy se přichytí k sousední"
                  : "Klepnutím na zeď otevřete stěnu · šrafovaně zeď · D = dveře"}</p>
              </div>
            </div>
            <div class="karta ${rozvinuty ? "" : "jen-notebook"}">
              <p class="stitek">Rozvinutý pohled · ${esc(mistnost.nazev)}</p>
              ${rozvinutaKresba || `<p class="popisek">Místnost zatím nemá stěny.</p>`}
              ${legenda()}
            </div>
          </div>
          <div class="s4 sloupec">
            ${sekce("02", "Místnosti", dokument.mistnosti.length < MAX_MISTNOSTI
              ? { klic: "mistnost", popisek: "Přidat místnost" } : null)}
            <ul class="seznam" id="pr-mistnosti"></ul>
            <ul class="seznam" id="pr-akce"></ul>
            ${sekce("03", "Kontrola")}
            ${hlasky.length
              ? `<div class="hlaska varovani">${hlasky.map(esc).join("<br>")}</div>`
              : `<div class="hlaska uspech">${uzavrene
                ? "Nic se nepřekrývá a půdorys se uzavírá."
                : "Nic se nepřekrývá a nic nezasahuje do oken."}</div>`}
            <p data-ulozeni class="rozmer">Uloženo</p>
          </div>
        </div>`;

      const seznam = $("pr-mistnosti");
      dokument.mistnosti.forEach((m, i) => {
        const oi = obrysVybrane(dokument, i);
        seznam.appendChild(radekTlacitko(
          `<span class="poradi">${String(i + 1).padStart(2, "0")}</span>
           <span class="hlavni"><strong>${esc(m.nazev)}</strong><span>${esc(popisMistnosti(oi))}</span></span>
           <span class="vpravo${i === mi ? " dnes" : ""}">${i === mi ? "zobrazena" : "›"}</span>`,
          () => { stav.mistnostIndex = i; vykresliProstor(); panelMistnost(i); }));
      });

      const akce = $("pr-akce");
      if (o.stav === "chybi") {
        pridejAkci(akce, `Dopočítat chybějící stěnu (${mmText(o.chybejici_mm)} mm)`,
          `doplní stěnu do místnosti ${mistnost.nazev}`, () => {
            pridejStenu(mi, o.chybejici_mm);
            toast(`Stěna dopočítána: ${mmText(o.chybejici_mm)} mm.`);
            vykresliProstor();
          });
      }
      pridejAkci(akce, `Přidat stěnu do místnosti ${mistnost.nazev}`, "na konec obvodu",
        () => pridejStenuAOtevri(mi));
      if (dokument.mistnosti.length > 1 && !stav.rozmistovani) {
        pridejAkci(akce, "Upravit rozmístění", "posun a otočení místností v půdorysu", () => {
          stav.rozmistovani = true;
          vykresliProstor();
        });
      }

      napojSekce(cil, {
        prepni: () => {
          stav.prostorRezim = rozvinuty ? "pudorys" : "rozvinuty";
          vykresliProstor();
        },
        mistnost: () => panelMistnost(-1),
      });

      const plocha = $("pr-pudorys");
      if (stav.rozmistovani) {
        napojRozmistovani(plocha);
        nastavListu([
          { popisek: "Hotovo", akce: () => { stav.rozmistovani = false; vykresliProstor(); } },
          { popisek: "Otočit o 90°", vedlejsi: true, akce: otocMistnost },
        ]);
      } else {
        plocha.addEventListener("click", (u) => {
          const zed = u.target.closest ? u.target.closest("[data-stena]") : null;
          if (zed) jdi("stena", { index: Number(zed.getAttribute("data-stena")) });
        });
        nastavListu([{ popisek: "Vygenerovat kusovník", akce: vygenerujKusovnik }]);
      }
      prekresliStavUlozeni();
    }

    function otocMistnost() {
      const m = stav.dokument.mistnosti[stav.mistnostIndex];
      if (!m) return;
      m.otoceni = normalizujOtoceni(cislo(m.otoceni, 0) + 90);
      zmeneno();
      vykresliProstor();
      toast(`${m.nazev} otočena o 90°.`);
    }

    // Rozmístění místností tahem: místnost se posouvá po 10 mm a roh se
    // přichytí k rohu sousední místnosti, když je do 150 mm.
    function napojRozmistovani(plocha) {
      let tah = null;
      plocha.addEventListener("pointerdown", (u) => {
        if (u.button !== undefined && u.button > 0) return;
        const svg = plocha.querySelector("svg");
        const skupina = u.target.closest ? u.target.closest("[data-mistnost]") : null;
        if (!svg || !skupina) return;
        const mi = Number(skupina.getAttribute("data-mistnost"));
        const m = stav.dokument.mistnosti[mi];
        const matice = svg.getScreenCTM();
        if (!m || !matice) return;
        stav.mistnostIndex = mi;
        const vb = svg.viewBox.baseVal;
        const inverzni = matice.inverse();
        tah = {
          mi, inverzni, pointerId: u.pointerId, pohnuto: false,
          start: new DOMPoint(u.clientX, u.clientY).matrixTransform(inverzni),
          startX: u.clientX, startY: u.clientY,
          x: cislo(m.x_mm, 0), y: cislo(m.y_mm, 0),
          viewBox: [vb.x, vb.y, vb.width, vb.height],
        };
        try { plocha.setPointerCapture(u.pointerId); } catch { /* starší prohlížeč */ }
        u.preventDefault();
        plocha.innerHTML = nakresliPudorys(stav.dokument,
          { rozmistovani: true, vybranaMistnost: mi, viewBox: tah.viewBox }).svg;
      });
      plocha.addEventListener("pointermove", (u) => {
        if (!tah || u.pointerId !== tah.pointerId) return;
        if (!tah.pohnuto && Math.hypot(u.clientX - tah.startX, u.clientY - tah.startY) < 6) return;
        tah.pohnuto = true;
        const p = new DOMPoint(u.clientX, u.clientY).matrixTransform(tah.inverzni);
        const dokument = stav.dokument;
        const m = dokument.mistnosti[tah.mi];
        m.x_mm = Math.round((tah.x + p.x - tah.start.x) / 10) * 10;
        m.y_mm = Math.round((tah.y + p.y - tah.start.y) / 10) * 10;
        const ostatni = [];
        dokument.mistnosti.forEach((jina, j) => {
          if (j !== tah.mi) ostatni.push(...rohyMistnosti(jina, stenyMistnosti(dokument, j)));
        });
        const posun = prichytniRoh(rohyMistnosti(m, stenyMistnosti(dokument, tah.mi)), ostatni, 150);
        if (posun) {
          m.x_mm += posun[0];
          m.y_mm += posun[1];
        }
        plocha.innerHTML = nakresliPudorys(dokument,
          { rozmistovani: true, vybranaMistnost: tah.mi, viewBox: tah.viewBox }).svg;
      });
      const konec = (u) => {
        if (!tah || u.pointerId !== tah.pointerId) return;
        const hotovy = tah;
        tah = null;
        if (hotovy.pohnuto) {
          zmeneno();
          toast(`${stav.dokument.mistnosti[hotovy.mi].nazev} posunuta.`);
        }
        vykresliProstor();
      };
      plocha.addEventListener("pointerup", konec);
      plocha.addEventListener("pointercancel", konec);
    }

    function panelMistnost(mi) {
      const dokument = stav.dokument;
      const novy = mi < 0;
      if (novy && dokument.mistnosti.length >= MAX_MISTNOSTI) {
        toast(`Zakázka může mít nejvýš ${MAX_MISTNOSTI} místností.`);
        return;
      }
      const m = novy ? { nazev: "" } : dokument.mistnosti[mi];
      if (!m) return;
      const steny = novy ? [] : stenyMistnosti(dokument, mi);
      const o = novy ? null : obrysMistnosti(m, steny);
      const skrinek = steny.reduce((s, { stena }) => s + (stena.skrinky || []).length, 0);
      const lzeSmazat = !novy && !skrinek && dokument.mistnosti.length > 1;

      otevriPanel(novy ? "Nová místnost" : "Místnost", `
        ${novy ? "" : `<div class="cislo-radek"><span class="cislo-obri">${steny.length}</span>
          <p>${pocetSten(steny.length).replace(/^\d+ /, "")}<br>${o.stav === "sedi"
            ? plochaText(o.plocha_m2) + " m² podlahy" : "plocha až po uzavření půdorysu"}</p></div>`}
        <div class="pole"><label for="mi-nazev">Název místnosti</label>
          <input id="mi-nazev" type="text" maxlength="60" placeholder="Kuchyň, Spíž…"
                 value="${esc(m.nazev)}" enterkeyhint="done">
          <span class="napoveda">${novy ? "Místnost se v půdorysu postaví vedle ostatních; "
            + "stěny do ní přidáte v Prostoru." : "Podle toho ji poznáte v půdorysu i v kusovníku."}</span></div>
        <div id="mi-chyba" aria-live="polite"></div>
        ${!novy && skrinek ? `<p class="popisek">Místnost se skříňkami nejde smazat — nejdřív
          skříňky na jejích stěnách smažte.</p>` : ""}
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="mi-ulozit">Uložit místnost</button>
          ${lzeSmazat ? `<button type="button" class="tlacitko varovne" id="mi-smazat">Smazat místnost</button>` : ""}
        </div>`,
        (panel) => {
          panel.querySelector("#mi-ulozit").addEventListener("click", () => {
            const nazev = panel.querySelector("#mi-nazev").value.trim().slice(0, 60);
            if (!nazev) {
              const chyba = panel.querySelector("#mi-chyba");
              chyba.className = "hlaska chyba";
              chyba.textContent = "Napište název místnosti.";
              panel.querySelector("#mi-nazev").closest(".pole").classList.add("chybne");
              return;
            }
            if (novy) {
              // Nová místnost se postaví vpravo od všeho, co v půdorysu už je.
              let vpravo = 0;
              let nahore = 0;
              dokument.mistnosti.forEach((jina, j) => {
                const body = rohyMistnosti(jina, stenyMistnosti(dokument, j));
                if (body.length > 1) {
                  vpravo = Math.max(vpravo, ...body.map((b) => b[0]));
                  nahore = Math.min(nahore, ...body.map((b) => b[1]));
                }
              });
              dokument.mistnosti.push({ nazev, x_mm: vpravo + 1000, y_mm: nahore, otoceni: 0 });
              stav.mistnostIndex = dokument.mistnosti.length - 1;
            } else {
              dokument.mistnosti[mi].nazev = nazev;
            }
            zavriPanel();
            zmeneno();
            if (aktualni.nazev === "prostor") vykresliProstor();
            toast("Místnost uložena.");
          });
          const smazat = panel.querySelector("#mi-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              if (!confirm(`Opravdu smazat místnost „${m.nazev}“ i s jejími stěnami?`)) return;
              dokument.steny = dokument.steny.filter((s) => cislo(s.mistnost, 0) !== mi);
              for (const s of dokument.steny) {
                if (cislo(s.mistnost, 0) > mi) s.mistnost = cislo(s.mistnost, 0) - 1;
              }
              dokument.mistnosti.splice(mi, 1);
              stav.mistnostIndex = 0;
              zavriPanel();
              zmeneno();
              if (aktualni.nazev === "prostor") vykresliProstor();
              toast("Místnost smazána.");
            });
          }
        });
    }

    // ── Obrazovka: kusovník ────────────────────────────────────────────
    async function vygenerujKusovnik() {

      jdi("kusovnik", { pocitat: true });

    async function vykresliKusovnik(parametry) {
      const cil = $("o-kusovnik");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }

      // Kusovník v paměti musí patřit k otevřené zakázce — jinak by se po
      // přepnutí zakázky ukázala cizí čísla.
      const cizi = stav.kusovnik && stav.kusovnik.zakazka.id !== stav.dokument.zakazka.id;
      if (parametry.pocitat || !stav.kusovnik || cizi) {
        cil.innerHTML = `<div class="kostra kostra-tabulka"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>
          <div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        const { ok, data } = await api("/api/kusovnik", "POST",
          { zakazka_id: stav.dokument.zakazka.id }).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          if (data.chyba && data.chyba.indexOf("skříňku") > -1) {
            cil.innerHTML = `<div class="prazdno">${ikona("kusovnik")}
              <p>Nejdřív přidejte aspoň jednu skříňku.</p></div>`;
          } else {
            cil.innerHTML = `<div class="hlaska chyba">${esc(data.chyba
              || "Kusovník se nepodařilo spočítat.")}</div>`;
          }
          nastavListu([{ popisek: "Zpět na zakázku", vedlejsi: true,
            akce: () => jdi("zakazka", { id: stav.dokument.zakazka.id }, true) }]);
          return;
        }
        stav.kusovnik = data;
        stav.dokument.posledni_kusovnik = {
          id: data.id, pocet_dilu: data.souhrn.pocet_dilu,
          odhad_desek: data.souhrn.odhad_desek, vytvoreno: data.vytvoreno,
        };
        toast("Kusovník uložen do zakázky.");
        if (aktualni.nazev !== "kusovnik") return;
        // Ať se při návratu tlačítkem zpět/vpřed nepočítá (a neukládá) znovu.
        aktualni.parametry = {};
        history.replaceState({ obrazovka: "kusovnik", parametry: {} }, "", "#kusovnik");
      }

      const k = stav.kusovnik;
      const plocha = (k.souhrn.plocha_cm2 / 10000).toFixed(2).replace(".", ",");
      const podleMaterialu = new Map();
      for (const p of k.polozky) {
        const klic = `${p.material} · ${p.tloustka_mm} mm`;
        if (!podleMaterialu.has(klic)) podleMaterialu.set(klic, []);
        podleMaterialu.get(klic).push(p);
      }

      const skupiny = [...podleMaterialu.entries()].map(([nazev, polozky], i) => `
        ${sekce(String(i + 2).padStart(2, "0"), nazev)}
        <ul class="seznam jen-telefon">${polozky.map((p) => `
          <li class="radek"><span class="hlavni">
            <strong>${esc(p.nazev)} ${p.a_mm} × ${p.b_mm}</strong>
            <span>${esc(p.hrany_popis)}${p.vlakno ? " · vlákno po délce" : ""}</span>
          </span><span class="vpravo">${p.ks}×</span></li>`).join("")}</ul>
        <div class="tabulka-obal jen-siroke"><table class="tabulka">
          <thead><tr><th>Díl</th><th>Rozměr</th><th>Řez pro pilu</th><th>Olepení</th><th>Ks</th></tr></thead>
          <tbody>${polozky.map((p) => `<tr>
            <td>${esc(p.nazev)}</td>
            <td class="rozmer-bunka">${p.a_mm} × ${p.b_mm}</td>
            <td class="rozmer-bunka">${p.delka_mm} × ${p.sirka_mm}${p.vlakno ? " · vlákno" : ""}</td>
            <td><span class="kod">${esc(p.hrany_popis)}</span></td>
            <td>${p.ks}</td></tr>`).join("")}</tbody>
        </table></div>`).join("");

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">Dílů v kusovníku</p>
          <div class="cislo-radek"><span class="cislo-obri">${k.souhrn.pocet_dilu}</span>
            <p>odhad ${k.souhrn.odhad_desek} desek<br>${plocha} m² plochy</p></div>
          <p class="vykres-popis">${esc(k.zakazka.nazev)} · ${datum(k.vytvoreno)}</p>
        </div>
        ${sekce("01", "Jak číst rozměry")}
        <p class="popisek">${k.standard.rozmer_s_olepenim
          ? "Uvedené rozměry jsou hotové díly po olepení."
          : "Uvedené rozměry jsou řez bez olepení."}
          U dílu je šířka × výška, jak leží ve skříňce; v CSV je délka po vlákně.</p>
        <p class="hlaska varovani">Rozměry před odesláním do nářezového centra zkontrolujte.</p>
        ${(k.varovani || []).length
          ? `<div class="hlaska varovani">${k.varovani.map(esc).join("<br>")}</div>` : ""}
        ${skupiny}
        <p class="popisek">Odhad desek je orientační — nářezové centrum si nářez
        optimalizuje samo a většinou vyjde líp.</p>`;

      nastavListu([
        { popisek: "Stáhnout CSV", akce: () => stahniCsv(k.id) },
        { popisek: "Hotovo", vedlejsi: true, akce: oznacHotovou },
      ]);
    }

    async function stahniCsv(id) {
      toast("Připravuji soubor…");
      const odpoved = await fetch(`/api/kusovnik/${id}/csv`).catch(() => null);
      if (!odpoved || !odpoved.ok) { toast("Soubor se nepodařilo stáhnout."); return; }
      const blob = await odpoved.blob();
      const adresa = URL.createObjectURL(blob);
      const odkaz = document.createElement("a");
      odkaz.href = adresa;
      odkaz.download = `kusovnik-${id}.csv`;
      document.body.appendChild(odkaz);
      odkaz.click();
      odkaz.remove();
      setTimeout(() => URL.revokeObjectURL(adresa), 10000);
      toast("Soubor je stažený.");
    }

      await ulozNaServer();
      stav.zakazky = null;

          <label class="volba"><input type="checkbox" id="ob-spotrebitel">
            Objednávám jako spotřebitel (mimo podnikání)</label>
          <label class="volba skryte" id="ob-souhlas-radek"><input type="checkbox" id="ob-souhlas">
            Výslovně souhlasím, aby placená služba začala před uplynutím 14denní lhůty
            pro odstoupení, a beru na vědomí, že tím právo na odstoupení ztrácím
            (§ 1837 písm. l) občanského zákoníku).</label>
          <button type="button" class="tlacitko" id="ob-poslat">Objednávka zavazující k platbě</button>
          <div id="ob-zprava" aria-live="polite"></div>` : ""}
        ${sekce(objednavka ? "02" : "01", "Vaše hlášení")}
        <div id="hl-seznam"></div>
        ${sekce(objednavka ? "03" : "02", "Vaše data")}
        <ul class="seznam" id="ucet-akce"></ul>
        <div class="paticka">
          <a href="zasady.html">Zásady zpracování údajů</a>
          <a href="podminky.html">Obchodní podmínky</a>
          <a href="zpracovatelska-smlouva.html">Zpracovatelská smlouva</a>
          <a href="odstoupeni-formular.html">Odstoupení od smlouvy</a>
          <button type="button" class="nahlasit-chybu">Nahlásit chybu</button>
        </div>`;

      if (objednavka) nastavObjednavku();
      nactiHlaseni();

      const akce = $("ucet-akce");
      pridejAkci(akce, "Stáhnout moje data", "všechno, co o vás vedeme, v jednom souboru",
        () => { location.href = "/api/ucet/export"; });
      pridejAkci(akce, "Odhlásit se", "", async () => {
        await api("/api/odhlaseni", "POST");
        zahodKoncept();
        location.reload();
      });
      pridejAkci(akce, "Smazat účet a všechna data", "nevratné", smazUcet);

      nastavListu([]);
    }

    function nastavObjednavku() {
      const prepocti = () => {
        const mesice = Number($("ob-mesice").value);
        $("ob-celkem").textContent = CENIK
          ? `${mesice * CENIK.mesic} ${CENIK.mena} za ${mesice} měs.`
          : "podle ceníku";
      };
      prepocti();
      $("ob-mesice").addEventListener("change", prepocti);
      $("ob-spotrebitel").addEventListener("change", () => {
        $("ob-souhlas-radek").classList.toggle("skryte", !$("ob-spotrebitel").checked);
      });
      $("ob-poslat").addEventListener("click", async () => {
        const zprava = $("ob-zprava");
        zprava.className = "hlaska";
        zprava.textContent = "Odesílám…";
        const mesice = Number($("ob-mesice").value);
        const { ok, data } = await api("/api/objednavka", "POST", {
          mesice,
          cena_czk: CENIK ? mesice * CENIK.mesic : null,
          fakturace: $("ob-fakturace").value,
          spotrebitel: $("ob-spotrebitel").checked,
          souhlas_zahajeni: $("ob-spotrebitel").checked && $("ob-souhlas").checked,
        }).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          zprava.className = "hlaska chyba";
          zprava.textContent = data.chyba || "Objednávku se nepodařilo odeslat.";
          return;
        }
        zprava.className = "hlaska uspech";
        zprava.textContent = "Děkujeme, objednávku máme. Fakturu pošleme e-mailem.";
      });
    }

    // Formulář pro nové hlášení řídí web/simtegen.js (tlačítko .nahlasit-chybu
    // v navigaci, hlavičce a patičce) — tady se jen ukazuje, co jste poslali
    // a co jsme odpověděli.
    async function nactiHlaseni() {
      const seznam = $("hl-seznam");
      if (!seznam) return;
      const { ok, data } = await api("/api/hlaseni").catch(() => ({ ok: false, data: {} }));
      if (!seznam.isConnected) return;
      const polozky = ok ? (data.hlaseni || []) : [];
      if (!polozky.length) {
        seznam.innerHTML = `<p class="popisek">Zatím jste nic nehlásili. Tlačítkem
          „Nahlásit chybu“ nám napíšete a odpověď uvidíte tady.</p>`;
        return;
      }
      seznam.innerHTML = `<ul class="seznam">${polozky.map((h) => `
        <li class="radek"><span class="hlavni"><strong>${esc(h.text)}</strong>
          <span>${datum(h.vytvoreno)} · ${esc(STAVY_HLASENI[h.stav] || h.stav)}${
            h.odpoved ? " · odpověď: " + esc(h.odpoved) : ""}</span></span></li>`).join("")}</ul>`;
    }

    async function smazUcet() {
      if (!confirm("Opravdu smazat účet, všechny zakázky i kusovníky? Krok je nevratný.")) return;
      const { ok, data } = await api("/api/ucet/smazat", "POST")
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(data.chyba || "Smazání se nepovedlo."); return; }
      zahodKoncept();
      location.reload();
    }

    // ── Start ──────────────────────────────────────────────────────────
    sledujKlavesnici();

    async function start() {
      const { data } = await api("/api/ja").catch(() => ({ data: {} }));
      stav.ja = data;
      if (!data.prihlasen) {
        jdi("uvod", {}, true);
        return;
      }
      await nactiStandard();
      // Obnovit se dá jen kořenová obrazovka — vnitřní obrazovky potřebují
      // zakázku, kterou z adresy vyčíst nejde.
      const hash = (location.hash || "").replace("#", "");
      jdi(KORENOVE[hash] ? hash : "zakazky", {}, true);
    }

    start();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
