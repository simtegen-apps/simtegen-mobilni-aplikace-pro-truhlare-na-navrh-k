<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: vysunutá klávesnice zmenší
       layoutový viewport, takže spodní panel i akční lišta zůstanou nad ní.
       Prohlížeče, které to neumí, dorovná visualViewport v sledujKlavesnici. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="application-name" content="Kusovník pro truhláře">
  <meta name="simtegen-verze" content="1.0">
  <title>Kusovník pro truhláře</title>
  <link rel="stylesheet" href="styl.css">
  <link rel="stylesheet" href="produkt.css">
  <style>
    /* Jen rozložení obrazovek tohohle produktu. Barvy, písma, rozměry
       a komponenty jsou v návrhovém systému (styl.css) a barva produktu
       v produkt.css — tady se z nich jenom skládá. */

    /* ── Klávesnice pod spodním panelem ─────────────────────────────
       Panel je position: fixed, a ten se drží LAYOUTOVÉHO viewportu —
       ten se vysunutím klávesnice nezmenší, takže formulář zmizí pod ní.
       --klavesnice drží, kolik pixelů zespodu klávesnice ukousla, a
       počítá ji visualViewport (funkce sledujKlavesnici). */
    :root { --klavesnice: 0px; --viditelna-vyska: 100dvh; }
    .panel {
      bottom: var(--klavesnice);
      max-height: calc(var(--viditelna-vyska) - var(--mezera-6));
    }
    /* Hlavní akce panelu zůstane v dosahu palce i u dlouhého formuláře
       a i když je nad ní vysunutá klávesnice. */
    .panel-akce {
      position: sticky; bottom: 0; z-index: 1;
      display: flex; flex-direction: column; gap: var(--mezera-2);
      margin-top: var(--mezera-1);
      padding: var(--mezera-3) 0 var(--mezera-2);
      background: var(--barva-papir);
      border-top: 1px solid var(--barva-linka);
    }

    /* Odkaz vpravo v číslovaném nadpisu sekce je tlačítko (přepíná obrazovku,
       ne adresu) — vzhled i dotykový cíl musí odpovídat odkazu. */
    .sekce-titulek button {
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      background: none; border: 0; padding: 0 0 0 var(--mezera-3);
      min-height: var(--dotyk); color: var(--barva-inkoust); font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }

    /* Výkres stěny a půdorysu. Šířka vždy 100 %, výška podle poměru,
       takže se na 360 px nic nevysouvá vodorovně. */
    .vykres-plocha { width: 100%; height: auto; display: block; }
    .vykres-popis { font-family: var(--pismo-mono); font-size: var(--velikost-5);
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--barva-tuzka); }

    /* Trojice rozměrů Š/V/H vedle sebe — palcem dosažitelná i na 360 px. */
    .trojice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--mezera-3); }
    .dvojice-poli { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--mezera-3); }
    .trojice .pole input { font-size: var(--velikost-1); }

    /* Řádek seznamu, který je akce, a ne odkaz na adresu: návrhový systém
       počítá u .radek s <li> a <a>, takže tlačítku je potřeba srovnat
       výchozí vzhled prohlížeče (rám, pozadí, zarovnání). Barvy se dědí. */
    button.radek { width: 100%; background: none; border-left: 0; border-right: 0;
      border-top: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    button.radek:hover { background: var(--barva-list); }
    .seznam > li { display: flex; }

    /* Ikony v navigaci a prázdných stavech: inline SVG, barvu dědí z textu. */
    .ikona-svg { width: 22px; height: 22px; display: block; flex: none; }
    .prazdno .ikona-svg { width: 40px; height: 40px; }
    .radek > .ikona-svg { color: var(--barva-tuzka); }

    /* Kostry načítání mají tvar toho, co přijde. */
    .kostra-radek { height: 56px; margin-bottom: 1px; }
    .kostra-nadpis { height: var(--mezera-6); width: 60%; }
    .kostra-radka { height: var(--mezera-4); }
    .kostra-karta { height: 9rem; }
    .kostra-tabulka { height: 6rem; }
  </style>
  <!-- aplikace: vykresli_aplikaci.py -->
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <script src="simtegen.js"></script>
  <div class="appka">
    <nav class="navigace" aria-label="Hlavní menu">
      <a class="znacka" href="/" aria-label="SimteGen">
        <span class="znacka-ctverec"></span><span class="znacka-slovo">simtegen</span></a>
      <button type="button" data-cil="zakazky" aria-current="page"><svg class="ikona-svg"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4"
        width="18" height="16"/><path d="M3 12h18M12 4v16M10.2 8.6v1.6M10.2 14.4v1.6M13.8 8.6v1.6M13.8 14.4v1.6"/>
        </svg>Zakázky</button>
      <button type="button" data-cil="standard"><svg class="ikona-svg" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="20" height="8"/>
        <path d="M6.5 8v3.2M10 8v4.6M13.5 8v3.2M17 8v4.6"/></svg>Standard</button>
      <button type="button" data-cil="ucet"><svg class="ikona-svg" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/>
        <path d="M4.8 20c0-3.7 3.2-5.8 7.2-5.8s7.2 2.1 7.2 5.8"/></svg>Účet</button>
      <span class="mezera"></span>
      <button type="button" class="nahlasit-chybu"><svg class="ikona-svg" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 2.8 19.5h18.4Z"/>
        <path d="M12 10v4M12 16.8v.4"/></svg>Nahlásit chybu</button>
      <span class="verze">V 1.0</span>
    </nav>

    <header class="hlavicka">
      <button type="button" class="tlacitko ikona skryte" id="zpet" aria-label="Zpět">
        <svg class="ikona-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 5 7.5 12l7 7"/></svg></button>
      <h1 id="titulek">Kusovník pro truhláře</h1>
      <button type="button" class="nahlasit-chybu jen-telefon" aria-label="Nahlásit chybu">
        <svg class="ikona-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4.5 2.8 19.5h18.4Z"/><path d="M12 10v4M12 16.8v.4"/></svg></button>
    </header>

    <main class="obsah" id="obsah">
      <section class="obrazovka aktivni" id="o-nacitani" aria-live="polite">
        <p class="stitek">Načítám</p>
        <div class="kostra kostra-nadpis"></div>
        <div class="kostra kostra-radka"></div>
        <div class="kostra kostra-karta"></div>
      </section>

      <section class="obrazovka" id="o-uvod"></section>
      <section class="obrazovka" id="o-zakazky"></section>
      <section class="obrazovka" id="o-zakazka"></section>
      <section class="obrazovka" id="o-stena"></section>
      <section class="obrazovka" id="o-nahled"></section>
      <section class="obrazovka" id="o-kusovnik"></section>
      <section class="obrazovka" id="o-standard"></section>
      <section class="obrazovka" id="o-ucet"></section>
    </main>

    <div class="lista-dole skryte" id="lista-dole"></div>
  </div>

  <div id="panel-misto"></div>
  <div id="toast-misto" aria-live="polite"></div>

  <script type="module">
    // Modul, ne klasický skript: pravidla kolizí a svislého rozsahu skříněk
    // si aplikace bere ze stejného souboru jako server (web/kolize.js), aby
    // se varování na obrazovce nerozešla s varováními v uloženém kusovníku.
    import { TYPY_SKRINEK, celeCislo, svislyRozsah, zkontrolujStenu } from "./kolize.js";

    // Tohle je jen ZOBRAZENÍ ceny. Závazný ceník je na serveru (cenik.js) —
    // podle něj se počítá částka objednávky a číslo odtud slouží jen jako
    // kontrola, že zákazník viděl totéž. Doplní se tedy obojí najednou ze
    // SCHVÁLENÉ ceny, ve stejném kroku, ve kterém se do data-manifest.json
    // zapíše `cena_dph`. Dokud je null, aplikace nikde neslibuje číslo,
    // které neprošlo bránou majitele.
    // Tvar: window.CENIK = { mesic: 490, mena: "Kč" };
    window.CENIK = null;
    const CENIK = window.CENIK;

    const KLIC_KONCEPTU = "rozpracovana-zakazka";

    const $ = (id) => document.getElementById(id);
    const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (z) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
    const cislo = celeCislo;
    const datum = (unix) => new Date(unix * 1000).toLocaleDateString("cs-CZ");

    // Ikony kreslené jedním tahem na mřížce 24, tah 1,6 — z tématu dílny.
    const IKONY = {
      linka: '<rect x="3" y="4" width="18" height="16"/>'
        + '<path d="M3 12h18M12 4v16M10.2 8.6v1.6M10.2 14.4v1.6M13.8 8.6v1.6M13.8 14.4v1.6"/>',
      metr: '<rect x="2" y="9" width="20" height="7"/><circle cx="7" cy="12.5" r="1.9"/>'
        + '<path d="M12.5 9v2M15.5 9v2.8M18.5 9v2"/>',
      skrinka: '<rect x="4" y="3" width="16" height="18"/><path d="M12 3v18"/>'
        + '<path d="M10.2 11.2v1.6M13.8 11.2v1.6"/>',
      kusovnik: '<rect x="5" y="3" width="14" height="18"/>'
        + '<path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>',
      oko: '<path d="M2.5 12S6 6.2 12 6.2 21.5 12 21.5 12 18 17.8 12 17.8 2.5 12 2.5 12Z"/>'
        + '<circle cx="12" cy="12" r="2.6"/>',
    };

    function ikona(nazev) {
      return `<svg class="ikona-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">${IKONY[nazev] || ""}</svg>`;
    }

    function sekce(cisloSekce, nazev, akce) {
      return `<div class="sekce-titulek"><span>${cisloSekce} — ${esc(nazev)}</span>${
        akce ? `<button type="button" data-sekce="${esc(akce.klic)}">${esc(akce.popisek)} →</button>` : ""
      }</div>`;
    }

    const VYCHOZI_ROZMERY = {
      spodni: { sirka_mm: 600, vyska_mm: 720, hloubka_mm: 510, pocet_polic: 1, pocet_dvirek: 1 },
      horni: { sirka_mm: 600, vyska_mm: 720, hloubka_mm: 320, pocet_polic: 1, pocet_dvirek: 1 },
      vysoka: { sirka_mm: 600, vyska_mm: 2000, hloubka_mm: 560, pocet_polic: 4, pocet_dvirek: 2 },
      rohova: { sirka_mm: 900, vyska_mm: 720, hloubka_mm: 510, pocet_polic: 1, pocet_dvirek: 1 },
    };

    const stav = {
      ja: null,
      zakazky: null,
      zakazkyChyba: false,
      vseZakazky: false,
      dokument: null,
      stenaIndex: 0,
      kusovnik: null,
      standard: null,
      ukazka: [],
      materialy: [],
      hlaseni: [],
      nahledRezim: "pohled",
      ukladani: "cisto",   // cisto | ceka | chyba
    };

    // ── Komunikace s vlastním API ──────────────────────────────────────
    async function api(cesta, metoda, telo) {
      const odpoved = await fetch(cesta, {
        method: metoda || "GET",
        headers: telo ? { "Content-Type": "application/json" } : undefined,
        body: telo ? JSON.stringify(telo) : undefined,
      });
      const data = await odpoved.json().catch(() => ({}));
      if (odpoved.status === 402) {
        toast("Předplatné vypršelo — podrobnosti najdete u účtu.");
        jdi("ucet");
      }
      return { ok: odpoved.ok, status: odpoved.status, data };
    }

    function toast(text) {
      const misto = $("toast-misto");
      misto.innerHTML = "";
      const bublina = document.createElement("div");
      bublina.className = "toast";
      bublina.textContent = text;
      misto.appendChild(bublina);
      setTimeout(() => { if (bublina.parentNode) bublina.remove(); }, 3200);
    }

    // ── Router ─────────────────────────────────────────────────────────
    // Vlastní historie: aplikace běží bez adresního řádku, takže hardwarové
    // tlačítko zpět na Androidu musí mít co vracet. Každá obrazovka proto
    // přidá záznam do history a reaguje na popstate.
    const OBRAZOVKY = {
      uvod: { titulek: "Kusovník pro truhláře", vykresli: vykresliUvod },
      zakazky: { titulek: "Zakázky", vykresli: vykresliZakazky },
      zakazka: { titulek: "Zakázka", zpet: true, vykresli: vykresliZakazku },
      stena: { titulek: "Stěna", zpet: true, vykresli: vykresliStenu },
      nahled: { titulek: "Náhled", zpet: true, vykresli: vykresliNahled },
      kusovnik: { titulek: "Kusovník", zpet: true, vykresli: vykresliKusovnik },
      standard: { titulek: "Můj standard", vykresli: vykresliStandard },
      ucet: { titulek: "Účet", vykresli: vykresliUcet },
    };
    const KORENOVE = { zakazky: 1, standard: 1, ucet: 1 };

    let aktualni = { nazev: "uvod", parametry: {} };

    function jdi(nazev, parametry, nahradit) {
      const kam = { nazev, parametry: parametry || {} };
      const stavHistorie = { obrazovka: nazev, parametry: kam.parametry };
      if (nahradit) history.replaceState(stavHistorie, "", "#" + nazev);
      else history.pushState(stavHistorie, "", "#" + nazev);
      zobraz(kam);
    }

    function zobraz(kam) {
      aktualni = kam;
      const def = OBRAZOVKY[kam.nazev] || OBRAZOVKY.zakazky;
      document.querySelectorAll(".obrazovka").forEach((o) =>
        o.classList.toggle("aktivni", o.id === "o-" + kam.nazev));
      $("titulek").textContent = def.titulek;
      // .skryte, ne atribut hidden: komponenty návrhového systému mají
      // display v třídě, a ta by atribut přebila.
      $("zpet").classList.toggle("skryte", !def.zpet);
      document.querySelectorAll(".navigace [data-cil]").forEach((b) => {
        const aktivni = b.dataset.cil === kam.nazev;
        if (aktivni) b.setAttribute("aria-current", "page");
        else b.removeAttribute("aria-current");
      });
      nastavListu([]);
      window.scrollTo(0, 0);
      def.vykresli(kam.parametry);
    }

    // Vizuální kontrola (vizualni_kontrola.py) prochází obrazovky tímhle
    // jménem — bez něj by jen přepnula třídu a změřila prázdnou sekci.
    window.ukaz = (id) => {
      const nazev = String(id || "").replace(/^o-/, "");
      if (OBRAZOVKY[nazev]) jdi(nazev, {}, true);
    };

    window.addEventListener("popstate", (udalost) => {
      const s = udalost.state;
      if (s && s.obrazovka) zobraz({ nazev: s.obrazovka, parametry: s.parametry || {} });
      else zobraz({ nazev: stav.ja && stav.ja.prihlasen ? "zakazky" : "uvod", parametry: {} });
    });

    $("zpet").addEventListener("click", () => history.back());
    document.querySelectorAll(".navigace [data-cil]").forEach((b) =>
      b.addEventListener("click", () => jdi(b.dataset.cil)));

    function nastavListu(tlacitka) {
      const lista = $("lista-dole");
      lista.innerHTML = "";
      lista.classList.toggle("skryte", !tlacitka.length);
      for (const t of tlacitka) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tlacitko" + (t.vedlejsi ? " vedlejsi" : "");
        button.textContent = t.popisek;
        if (t.zakazane) button.disabled = true;
        button.addEventListener("click", t.akce);
        lista.appendChild(button);
      }
    }

    /** Položka seznamu, která je akce: <li> s tlačítkem ve tvaru řádku. */
    function radekTlacitko(obsahHtml, akce) {
      const li = document.createElement("li");
      const polozka = document.createElement("button");
      polozka.type = "button";
      polozka.className = "radek";
      polozka.innerHTML = obsahHtml;
      polozka.addEventListener("click", akce);
      li.appendChild(polozka);
      return li;
    }

    function napojSekce(cil, akce) {
      cil.querySelectorAll("[data-sekce]").forEach((b) => {
        const fn = akce[b.dataset.sekce];
        if (fn) b.addEventListener("click", fn);
      });
    }

    /**
     * Obrazovka za přihlášením otevřená bez přihlášení. Menu je vidět vždy
     * (je to kostra aplikace), takže na ni jde klepnout i z úvodu — ať tam
     * místo prázdna nebo hlášky o chybě stojí, co s tím.
     */
    function nutnePrihlaseni(cil) {
      if (stav.ja && stav.ja.prihlasen) return false;
      cil.innerHTML = `<div class="prazdno">${ikona("linka")}
        <p>Nejste přihlášeni. Na úvodní obrazovce zadejte e-mail — pošleme vám
        jednorázový odkaz a vaše zakázky i standard se zase objeví.</p></div>`;
      const tlacitko = document.createElement("button");
      tlacitko.type = "button";
      tlacitko.className = "tlacitko";
      tlacitko.textContent = "Na úvodní obrazovku";
      tlacitko.addEventListener("click", () => jdi("uvod"));
      cil.querySelector(".prazdno").appendChild(tlacitko);
      nastavListu([]);
      return true;
    }

    // ── Klávesnice ─────────────────────────────────────────────────────
    // Spodní panel je position: fixed, a ten se drží layoutového viewportu.
    // Ten se vysunutím klávesnice NEZMENŠÍ, takže formulář zůstane pod ní.
    // visualViewport jako jediný ví, kolik místa klávesnice sebrala.
    function sledujKlavesnici() {
      const vv = window.visualViewport;
      if (!vv) return;
      const koren = document.documentElement;
      const prepocti = () => {
        const skryto = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        koren.style.setProperty("--klavesnice", `${skryto}px`);
        koren.style.setProperty("--viditelna-vyska", `${Math.round(vv.height)}px`);
      };
      vv.addEventListener("resize", prepocti);
      vv.addEventListener("scroll", prepocti);
      prepocti();
    }

    // ── Spodní panel ───────────────────────────────────────────────────
    function otevriPanel(titulek, obsahHtml, pripoj) {
      zavriPanel();
      const misto = $("panel-misto");
      const pozadi = document.createElement("div");
      pozadi.className = "panel-pozadi";
      pozadi.addEventListener("click", zavriPanel);
      const panel = document.createElement("div");
      panel.className = "panel";
      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-modal", "true");
      panel.setAttribute("aria-label", titulek);
      panel.innerHTML = `<p class="stitek">Úprava</p><h2>${esc(titulek)}</h2>${obsahHtml}`;
      misto.appendChild(pozadi);
      misto.appendChild(panel);
      if (pripoj) pripoj(panel);

      // Klávesnice se vysune až po fokusu, takže se na políčko musí
      // doscrollovat s odstupem — jinak by se rolovalo do místa, které
      // za okamžik zakryje.
      panel.addEventListener("focusin", (u) => {
        if (!u.target.scrollIntoView) return;
        setTimeout(() => u.target.scrollIntoView({ block: "center", behavior: "smooth" }), 280);
      });
      // Enter odešle: v textovém poli spustí hlavní akci panelu.
      panel.addEventListener("keydown", (u) => {
        if (u.key === "Escape") { zavriPanel(); return; }
        if (u.key !== "Enter" || u.target.tagName === "TEXTAREA") return;
        const hlavni = panel.querySelector(".panel-akce .tlacitko");
        if (!hlavni) return;
        u.preventDefault();
        hlavni.click();
      });

      const prvni = panel.querySelector("input, select, textarea, button");
      if (prvni) prvni.focus({ preventScroll: true });
    }

    function zavriPanel() {
      $("panel-misto").innerHTML = "";
    }

    // ── Rozepsaná zakázka v telefonu ───────────────────────────────────
    // U zákazníka bývá mizerný signál. Rozepsaná zakázka se proto drží
    // i v telefonu a po uložení na server se odsud maže.
    function ulozKoncept() {
      if (!stav.dokument) return;
      try {
        localStorage.setItem(KLIC_KONCEPTU, JSON.stringify({
          zakazka_id: stav.dokument.zakazka.id,
          dokument: stav.dokument,
          cas: Math.floor(Date.now() / 1000),
        }));
      } catch { /* plná nebo zakázaná paměť prohlížeče nesmí shodit měření */ }
    }

    function nactiKoncept(zakazkaId) {
      try {
        const text = localStorage.getItem(KLIC_KONCEPTU);
        if (!text) return null;
        const koncept = JSON.parse(text);
        return koncept && koncept.zakazka_id === zakazkaId ? koncept : null;
      } catch {
        return null;
      }
    }

    function zahodKoncept() {
      try { localStorage.removeItem(KLIC_KONCEPTU); } catch { /* nevadí */ }
    }

    // ── Ukládání zakázky ───────────────────────────────────────────────
    let casovacUlozeni = null;

    function zmeneno() {
      stav.ukladani = "ceka";
      ulozKoncept();
      if (casovacUlozeni) clearTimeout(casovacUlozeni);
      casovacUlozeni = setTimeout(ulozNaServer, 1200);
    }

    async function ulozNaServer() {
      if (!stav.dokument) return;
      if (casovacUlozeni) { clearTimeout(casovacUlozeni); casovacUlozeni = null; }
      const id = stav.dokument.zakazka.id;
      const { ok, data } = await api(`/api/zakazky/${id}`, "PUT", stav.dokument)
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) {
        stav.ukladani = "chyba";
        prekresliStavUlozeni();
        return;
      }
      stav.dokument = data;
      stav.ukladani = "cisto";
      zahodKoncept();
      prekresliStavUlozeni();
    }

    function prekresliStavUlozeni() {
      document.querySelectorAll("[data-ulozeni]").forEach((prvek) => {
        if (stav.ukladani === "cisto") {
          prvek.className = "rozmer";
          prvek.textContent = "Uloženo";
        } else if (stav.ukladani === "ceka") {
          prvek.className = "rozmer";
          prvek.textContent = "Ukládám…";
        } else {
          prvek.className = "hlaska varovani";
          prvek.textContent = "Zatím neuloženo — měření máte v telefonu, "
            + "uložíme ho, jakmile bude signál.";
        }
      });
    }

    // ── Výkres: pohled na stěnu a půdorys ──────────────────────────────
    // Kreslí se jako na papír: podlaha, sokl, pracovní deska, dvířka se
    // spárou a úchytkou, police čárkovaně jako skrytá hrana a pod stěnou
    // kóta s celkovou délkou. Úchytky nesou barvu produktu — jediné místo
    // ve výkrese, kde se používá, a nese informaci „tohle je čelo“.
    function nakresliPohled(stena, standard, kolizni) {
      const st = standard || {};
      const kolize = kolizni || new Set();
      const D = Math.max(1, cislo(stena.delka_mm, 3600));
      const V = Math.max(1, cislo(stena.vyska_mm, 2600));
      // Tloušťky čar a písmo jsou zlomky výšky stěny, protože viewBox je
      // v milimetrech — jinak by čára na krátké stěně byla jako prkno.
      const tenka = Math.max(3, Math.round(V / 330));
      const stredni = Math.max(5, Math.round(V / 190));
      const silna = Math.max(8, Math.round(V / 115));
      const pismo = Math.round(V / 24);
      const kota = Math.round(V * 0.13);
      const okraj = Math.round(Math.max(D, V) * 0.05);
      const carka = `${Math.round(V / 55)} ${Math.round(V / 90)}`;
      const y = (mm) => V - mm;            // výška nad podlahou → osa SVG
      const c = [];

      c.push(`<rect x="0" y="0" width="${D}" height="${V}"
        fill="var(--barva-list)" stroke="var(--barva-linka)" stroke-width="${tenka}"/>`);

      for (const o of stena.otvory || []) {
        const x = cislo(o.odsazeni_mm, 0);
        const s = Math.max(1, cislo(o.sirka_mm, 0));
        const v = Math.max(1, cislo(o.vyska_mm, 0));
        const dole = o.typ === "dvere" ? 0 : Math.max(0, cislo(o.parapet_mm, 0));
        c.push(`<rect x="${x}" y="${y(dole + v)}" width="${s}" height="${v}"
          fill="var(--barva-papir)" stroke="var(--barva-tuzka-2)" stroke-width="${stredni}"/>`);
        c.push(`<path d="M${x + s / 2} ${y(dole + v)}V${y(dole)}M${x} ${y(dole + v / 2)}H${x + s}"
          stroke="var(--barva-tuzka-2)" stroke-width="${tenka}"/>`);
        if (o.typ !== "dvere") {
          c.push(`<rect x="${x - s * 0.03}" y="${y(dole)}" width="${s * 1.06}"
            height="${Math.round(V / 70)}" fill="var(--barva-tuzka-2)"/>`);
        }
      }

      const skrinky = stena.skrinky || [];
      skrinky.forEach((sk, index) => {
        const x = cislo(sk.odsazeni_mm, 0);
        const s = Math.max(1, cislo(sk.sirka_mm, 0));
        const [y1, y2] = svislyRozsah(sk, st);
        const v = Math.max(1, y2 - y1);
        const problem = kolize.has(index);
        const barva = problem ? "var(--barva-chyba)" : "var(--barva-inkoust)";

        if (sk.typ !== "horni" && y1 > 0) {
          c.push(`<rect x="${x + s * 0.04}" y="${y(y1)}" width="${s * 0.92}" height="${y1}"
            fill="var(--barva-plocha-2)" stroke="var(--barva-linka)" stroke-width="${tenka}"/>`);
        }

        c.push(`<rect x="${x}" y="${y(y2)}" width="${s}" height="${v}"
          fill="${problem ? "var(--barva-chyba-pozadi)" : "var(--barva-list)"}"
          stroke="${barva}" stroke-width="${stredni}"/>`);

        const police = Math.max(0, cislo(sk.pocet_polic, 0));
        for (let i = 1; i <= police; i += 1) {
          const yy = y1 + (v * i) / (police + 1);
          c.push(`<line x1="${x + s * 0.1}" y1="${y(yy)}" x2="${x + s * 0.9}" y2="${y(yy)}"
            stroke="var(--barva-linka-2)" stroke-width="${tenka}" stroke-dasharray="${carka}"/>`);
        }

        // Pořadí čel je stejné jako v rozpadu: zásuvky nahoře, dvířka pod nimi.
        const zasuvek = Math.max(0, cislo(sk.pocet_zasuvek, 0));
        const dvirek = Math.max(0, cislo(sk.pocet_dvirek, 0));
        const madlo = Math.max(Math.round(V / 95), Math.round(v / 16));
        let hranice = y2;
        for (let i = 0; i < zasuvek; i += 1) {
          const vyskaCela = dvirek > 0
            ? Math.min(cislo(sk.zasuvka_vyska_mm, 140), v / (zasuvek + 1))
            : v / zasuvek;
          hranice -= vyskaCela;
          if (hranice < y1) break;
          if (i < zasuvek - 1 || dvirek > 0) {
            c.push(`<line x1="${x}" y1="${y(hranice)}" x2="${x + s}" y2="${y(hranice)}"
              stroke="${barva}" stroke-width="${tenka}"/>`);
          }
          c.push(`<rect x="${x + s * 0.3}" y="${y(hranice + vyskaCela / 2 + madlo / 2)}"
            width="${s * 0.4}" height="${madlo}" fill="var(--barva-produktu)"/>`);
        }
        if (dvirek > 0 && hranice > y1) {
          const sirkaDvirek = s / dvirek;
          const stredDvirek = y1 + (hranice - y1) / 2;
          const delkaMadla = Math.min((hranice - y1) * 0.35, 220);
          for (let i = 0; i < dvirek; i += 1) {
            const leve = x + sirkaDvirek * i;
            if (i > 0) {
              c.push(`<line x1="${leve}" y1="${y(hranice)}" x2="${leve}" y2="${y(y1)}"
                stroke="${barva}" stroke-width="${tenka}"/>`);
            }
            // Úchytka u otevírací hrany — u dvojice dvířek tedy uprostřed.
            const mx = dvirek > 1 && i === 0
              ? leve + sirkaDvirek * 0.88
              : leve + sirkaDvirek * 0.12;
            c.push(`<rect x="${mx - madlo / 2}" y="${y(stredDvirek + delkaMadla / 2)}"
              width="${madlo}" height="${delkaMadla}" fill="var(--barva-produktu)"/>`);
          }
        }

        if (s > D / 10) {
          c.push(`<text x="${x + s / 2}" y="${y(y1) - pismo * 0.5}" text-anchor="middle"
            font-size="${pismo}" fill="var(--barva-tuzka)">${s}</text>`);
        }
      });

      // Pracovní deska leží na spodní řadě — bez ní to není kuchyně.
      const spodniRada = skrinky.filter((sk) => sk.typ === "spodni");
      if (spodniRada.length) {
        const odX = Math.min(...spodniRada.map((sk) => cislo(sk.odsazeni_mm, 0)));
        const doX = Math.max(...spodniRada.map((sk) =>
          cislo(sk.odsazeni_mm, 0) + cislo(sk.sirka_mm, 0)));
        const vrch = Math.max(...spodniRada.map((sk) => svislyRozsah(sk, st)[1]));
        const tl = Math.round(V / 65);
        c.push(`<rect x="${odX - tl}" y="${y(vrch + tl)}" width="${doX - odX + 2 * tl}"
          height="${tl}" fill="var(--barva-tuzka)"/>`);
      }

      c.push(`<line x1="${-okraj}" y1="${V}" x2="${D + okraj}" y2="${V}"
        stroke="var(--barva-inkoust)" stroke-width="${silna}"/>`);
      const ky = V + kota;
      c.push(`<path d="M0 ${ky}H${D}M0 ${ky - kota * 0.28}V${ky + kota * 0.28}M${D} ${ky - kota * 0.28}V${ky + kota * 0.28}"
        stroke="var(--barva-tuzka)" stroke-width="${tenka}"/>`);
      c.push(`<text x="${D / 2}" y="${ky - kota * 0.42}" text-anchor="middle"
        font-size="${pismo}" fill="var(--barva-tuzka)">${D} mm</text>`);

      return `<svg class="vykres-plocha"
        viewBox="${-okraj} ${-okraj} ${D + 2 * okraj} ${V + okraj + kota * 1.3}"
        role="img" aria-label="Pohled na stěnu ${esc(stena.nazev || "")}, ${D} krát ${V}
        milimetrů, ${skrinky.length} skříněk">${c.join("")}</svg>`;
    }

    function nakresliPudorys(steny) {
      // Stěny se skládají za sebou a po každé se zatáčí o 90° dovnitř —
      // tak vznikne tvar rovné, L i U kuchyně. Zdi jsou šrafované na 45°,
      // jak se kreslí řez ve výkrese; skříňky mají čelo silnější čarou.
      const idSrafy = `srafy-${Math.random().toString(36).slice(2, 8)}`;
      const tloustkaZdi = 120;
      let x = 0;
      let y = 0;
      let dx = 1;
      let dy = 0;
      const body = [];
      const zdi = [];
      const kusy = [];
      for (const stena of steny) {
        const D = Math.max(1, cislo(stena.delka_mm, 3600));
        const x2 = x + dx * D;
        const y2 = y + dy * D;
        const nx = -dy;   // normála dovnitř místnosti
        const ny = dx;

        const zed = [
          [x, y],
          [x2, y2],
          [x2 - nx * tloustkaZdi, y2 - ny * tloustkaZdi],
          [x - nx * tloustkaZdi, y - ny * tloustkaZdi],
        ];
        for (const bod of zed) body.push(bod);
        zdi.push(`<polygon points="${zed.map((b) => b.join(",")).join(" ")}"
          fill="url(#${idSrafy})" stroke="var(--barva-inkoust)" stroke-width="24"/>`);

        for (const sk of stena.skrinky || []) {
          const o = cislo(sk.odsazeni_mm, 0);
          const s = Math.max(1, cislo(sk.sirka_mm, 0));
          const h = Math.max(1, cislo(sk.hloubka_mm, 510));
          const ax = x + dx * o;
          const ay = y + dy * o;
          const rohy = [
            [ax, ay],
            [ax + dx * s, ay + dy * s],
            [ax + dx * s + nx * h, ay + dy * s + ny * h],
            [ax + nx * h, ay + ny * h],
          ];
          for (const bod of rohy) body.push(bod);
          kusy.push(`<polygon points="${rohy.map((b) => b.join(",")).join(" ")}"
            fill="var(--barva-list)" stroke="var(--barva-inkoust)" stroke-width="40"`
            + (sk.typ === "horni" ? ' stroke-dasharray="130 90"' : "") + "/>");
          if (sk.typ !== "horni") {
            kusy.push(`<line x1="${rohy[3][0]}" y1="${rohy[3][1]}"
              x2="${rohy[2][0]}" y2="${rohy[2][1]}" stroke="var(--barva-produktu)"
              stroke-width="90"/>`);
          }
        }
        x = x2;
        y = y2;
        dx = nx;
        dy = ny;
      }
      if (!body.length) return "";
      const xs = body.map((b) => b[0]);
      const ys = body.map((b) => b[1]);
      const minX = Math.min(...xs) - 300;
      const minY = Math.min(...ys) - 300;
      const sirka = Math.max(...xs) - minX + 600;
      const vyska = Math.max(...ys) - minY + 600;
      const defs = `<defs><pattern id="${idSrafy}" width="140" height="140"
        patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="140" stroke="var(--barva-tuzka-3)" stroke-width="24"/>
        </pattern></defs>`;
      return `<svg class="vykres-plocha" viewBox="${minX} ${minY} ${sirka} ${vyska}" role="img"
        aria-label="Půdorys místnosti">${defs}${zdi.join("")}${kusy.join("")}</svg>`;
    }

    // Pořadí položek odpovídá barvám, které jim styl.css dá: inkoust,
    // tužka, linka — tedy skříňka, okno, police.
    function legenda() {
      return `<ul class="legenda"><li>Skříňka</li><li>Okno a dveře</li>
        <li>Police (skrytá hrana)</li></ul>`;
    }

    // Kontrola stěny je JEDNA funkce sdílená se serverem (web/kolize.js);
    // tohle je jen zkratka, aby se nemusely pokaždé vypisovat skříňky.
    function kontrolaSteny(stena) {
      return zkontrolujStenu(stena, stena.skrinky || [], stav.standard);
    }

    // Ukázková stěna pro úvodní obrazovku. Kreslí ji TÝŽ kód jako zakázky,
    // takže návštěvník na první pohled vidí přesně to, co dostane.
    const UKAZKOVA_STENA = {
      nazev: "Ukázka", delka_mm: 3000, vyska_mm: 2500, roh_vlevo: 0, roh_vpravo: 0,
      otvory: [{ typ: "okno", odsazeni_mm: 1250, sirka_mm: 800, vyska_mm: 1100, parapet_mm: 950 }],
      skrinky: [
        { typ: "spodni", odsazeni_mm: 0, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 1, pocet_dvirek: 1, pocet_zasuvek: 0 },
        { typ: "spodni", odsazeni_mm: 600, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 0, pocet_dvirek: 0, pocet_zasuvek: 3 },
        { typ: "spodni", odsazeni_mm: 1200, sirka_mm: 900, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 1, pocet_dvirek: 2, pocet_zasuvek: 0 },
        { typ: "spodni", odsazeni_mm: 2100, sirka_mm: 900, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 1, pocet_dvirek: 2, pocet_zasuvek: 0 },
        { typ: "horni", odsazeni_mm: 0, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 320,
          pocet_polic: 1, pocet_dvirek: 1, pocet_zasuvek: 0 },
        { typ: "horni", odsazeni_mm: 600, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 320,
          pocet_polic: 1, pocet_dvirek: 1, pocet_zasuvek: 0 },
        { typ: "horni", odsazeni_mm: 2100, sirka_mm: 900, vyska_mm: 720, hloubka_mm: 320,
          pocet_polic: 1, pocet_dvirek: 2, pocet_zasuvek: 0 },
      ],
    };

    // ── Obrazovka: úvod a přihlášení ───────────────────────────────────
    function vykresliUvod() {
      $("o-uvod").innerHTML = `
        <p class="stitek">Pro truhláře, kteří měří u zákazníka</p>
        <h2 class="titulek-velky">Kuchyň změříte na místě, kusovník máte hned</h2>
        <div class="karta vykres">
          ${nakresliPohled(UKAZKOVA_STENA, null, null)}
          ${legenda()}
        </div>
        ${sekce("01", "Co to dělá")}
        <ul class="seznam">
          <li class="radek"><span class="poradi">01</span><span class="hlavni">
            <strong>Kusovník místo přepisování</strong>
            <span>rozměry dílů i olepení hran</span></span></li>
          <li class="radek"><span class="poradi">02</span><span class="hlavni">
            <strong>Váš konstrukční standard</strong>
            <span>tloušťka desky · záda v drážce · spáry</span></span></li>
          <li class="radek"><span class="poradi">03</span><span class="hlavni">
            <strong>Zakázky zůstanou uložené</strong>
            <span>kopie staré zakázky jako šablona</span></span></li>
        </ul>
        ${sekce("02", "Cena")}
        <p class="titulek-cena" id="uvod-cena">Ceník sdělí provozovatel</p>
        <p class="popisek">Prvních 30 dní zdarma, bez karty, bez závazku.</p>
        ${sekce("03", "Vyzkoušet nebo se přihlásit")}
        <p class="popisek">Zadejte svůj e-mail — pošleme vám jednorázový přihlašovací
        odkaz. Žádné heslo nepotřebujete.</p>
        <div class="pole">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" inputmode="email"
                 placeholder="vas@email.cz" enterkeyhint="send">
        </div>
        <div id="uvod-zprava" aria-live="polite"></div>
        <div class="paticka">
          <a href="zasady.html">Zásady zpracování údajů</a>

          <a href="zpracovatelska-smlouva.html">Zpracovatelská smlouva</a>

        </div>`;
      if (CENIK) $("uvod-cena").textContent = `${CENIK.mesic} ${CENIK.mena} měsíčně`;
      $("email").addEventListener("keydown", (u) => { if (u.key === "Enter") posliOdkaz(); });
      nastavListu([{ popisek: "Poslat přihlašovací odkaz", akce: posliOdkaz }]);
