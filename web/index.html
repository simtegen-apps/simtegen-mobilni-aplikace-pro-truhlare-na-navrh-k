  <style>
    /* Jen rozložení obrazovek tohohle produktu. Barvy, písma, rozměry
       a komponenty jsou v návrhovém systému (styl.css) a barva produktu
       v produkt.css — tady se z nich jenom skládá. */

    /* ── Klávesnice pod spodním panelem ─────────────────────────────
       Panel je position: fixed, a ten se drží LAYOUTOVÉHO viewportu —
       ten se vysunutím klávesnice nezmenší, takže formulář zmizí pod ní.
       --klavesnice drží, kolik pixelů zespodu klávesnice ukousla, a
       počítá ji visualViewport (funkce sledujKlavesnici). */
    :root { --klavesnice: 0px; --viditelna-vyska: 100dvh; }
    .panel {
      bottom: var(--klavesnice);
      max-height: calc(var(--viditelna-vyska) - var(--mezera-6));
    }
    /* Hlavní akce panelu zůstane v dosahu palce i u dlouhého formuláře
       a i když je nad ní vysunutá klávesnice. */
    .panel-akce {
      position: sticky; bottom: 0; z-index: 1;
      display: flex; flex-direction: column; gap: var(--mezera-2);
      margin-top: var(--mezera-1);
      padding: var(--mezera-3) 0 var(--mezera-2);
      background: var(--barva-papir);
      border-top: 1px solid var(--barva-linka);
    }

    /* Odkaz vpravo v číslovaném nadpisu sekce je tlačítko (přepíná obrazovku,
       ne adresu) — vzhled i dotykový cíl musí odpovídat odkazu. */
    .sekce-titulek button {
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      background: none; border: 0; padding: 0 0 0 var(--mezera-3);
      min-height: var(--dotyk); color: var(--barva-inkoust); font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }

    /* Výkres stěny a půdorysu. Šířka vždy 100 %, výška podle poměru,
       takže se na 360 px nic nevysouvá vodorovně. */
    .vykres-plocha { width: 100%; height: auto; display: block; }
    .vykres-popis { font-family: var(--pismo-mono); font-size: var(--velikost-5);
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--barva-tuzka); }

    /* Režim „Posouvat ve výkresu“: prst nad výkresem posouvá skříňky
       a okna, ne stránku. Platí jen v tomhle režimu, jinak se výkresem
       dá normálně rolovat. */
    .vykres-plocha.uprava { touch-action: none; user-select: none; -webkit-user-select: none; }
    .vykres-plocha.uprava [data-prvek] { cursor: grab; }
    .vykres-plocha.uprava [data-uchyt] { cursor: ew-resize; }
    .vykres-akce { display: flex; flex-wrap: wrap; gap: var(--mezera-2); margin-top: var(--mezera-3); }
    .vykres-akce .tlacitko { flex: 1 1 10rem; }

    /* Trojice rozměrů Š/V/H vedle sebe — palcem dosažitelná i na 360 px. */
    .trojice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--mezera-3); }
    .dvojice-poli { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--mezera-3); }
    .trojice .pole input { font-size: var(--velikost-1); }

    /* Řádek seznamu, který je akce, a ne odkaz na adresu: návrhový systém
       počítá u .radek s <li> a <a>, takže tlačítku je potřeba srovnat
       výchozí vzhled prohlížeče (rám, pozadí, zarovnání). Barvy se dědí. */
    button.radek { width: 100%; background: none; border-left: 0; border-right: 0;
      border-top: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    button.radek:hover { background: var(--barva-list); }
    .seznam > li { display: flex; }

    /* Ikony v navigaci a prázdných stavech: inline SVG, barvu dědí z textu. */
    .ikona-svg { width: 22px; height: 22px; display: block; flex: none; }
    .prazdno .ikona-svg { width: 40px; height: 40px; }
    .radek > .ikona-svg { color: var(--barva-tuzka); }

    /* Kostry načítání mají tvar toho, co přijde. */
    .kostra-radek { height: 56px; margin-bottom: 1px; }
    .kostra-nadpis { height: var(--mezera-6); width: 60%; }
    .kostra-radka { height: var(--mezera-4); }
    .kostra-karta { height: 9rem; }
    .kostra-tabulka { height: 6rem; }

    /* Úvod: ukázka pod přihlášením. Bez ukázky (play.js nenašel /ukazka.json)
       zmizí tlačítko i jeho popisek. */
    .uvod-ukazka { display: flex; flex-direction: column; gap: var(--mezera-2);
      margin-top: var(--mezera-4); padding-top: var(--mezera-4);
      border-top: 1px solid var(--barva-linka); }
    html:not(.sg-ukazka) .uvod-ukazka { display: none; }

    /* Ceník variant jen na webu: Google Play v aplikaci prodává jen svůj
       produkt (play.js), takže tam ceník s variantami, které koupit nejdou,
       nepatří. Stejně opatrně jako [data-objednavka] ve styl.css: dokud
       play.js nepotvrdí prohlížeč (sg-web), ceník variant se neukáže. */
    html[data-aplikace]:not(.sg-web) .cena-web,
    html.sg-v-aplikaci .cena-web { display: none; }
    html:not(.sg-v-aplikaci) .cena-aplikace { display: none; }

    /* Účet: bloky pravého sloupce pod sebou. */
    #ucet-mrizka .s7 > * + * { margin-top: var(--mezera-4); }
    #ucet-mrizka .s7 > :empty { display: none; }
  </style>

  <script type="module">
    // Modul, ne klasický skript: pravidla kolizí a svislého rozsahu skříněk
    // si aplikace bere ze stejného souboru jako server (web/kolize.js), aby
    // se varování na obrazovce nerozešla s varováními v uloženém kusovníku.
    import { TYPY_SKRINEK, celeCislo, svislyRozsah, zkontrolujStenu } from "./kolize.js";
    // Anglická slova oboru (díly, olepení, hlášky kontroly) sdílí obrazovka
    // s CSV ze serveru — stejný důvod jako u kolize.js.
    import { TYPY_SKRINEK_EN, dilEn, hranyEn, hlaskaEn, materialEn } from "./texty-oboru.js";

    // Tohle je jen ZOBRAZENÍ ceny. Závazný ceník je na serveru (cenik.js) —
    // podle něj se počítá částka objednávky a číslo odtud slouží jen jako
    // kontrola, že zákazník viděl totéž. Doplní se tedy obojí najednou ze
    // SCHVÁLENÉ ceny, ve stejném kroku, ve kterém se do data-manifest.json
    // zapíše `cena_dph`. Dokud je null, aplikace nikde neslibuje číslo,
    // které neprošlo bránou majitele.
    // Schváleno majitelem (build 10). `mesic` je výchozí varianta Standard;
    // varianty a jejich texty se ukazují přesně tak, jak je majitel schválil
    // — nic se z nich nedopočítává (jen celková částka objednávky = měsíce ×
    // cena varianty, stejně jako na serveru v cenik.js).
    window.CENIK = { mesic: 449, mena: "Kč" };
    // `objednat` jako na serveru: objednat jde jen Standard (jediná varianta
    // s definovaným obsahem), Sólo a Tým se jen zobrazují.
    window.CENIK_VARIANTY = [
      { klic: "solo", nazev: "SimteGen Kusovník – Sólo", mesic: 249, objednat: false,
        popis: "249 Kč za firmu a měsíc" },
      { klic: "standard", nazev: "SimteGen Kusovník – Standard", mesic: 449, objednat: true,
        popis: "449 Kč za firmu a měsíc; obsahuje: neomezený počet zakázek a uložených "
          + "projektů, návrh a vizualizace kuchyně/skříněk v tabletu i telefonu, automatické "
          + "generování kusovníku (rozměry desek a polic) pro nářezové centrum" },
      { klic: "tym", nazev: "SimteGen Kusovník – Tým", mesic: 890, objednat: false,
        popis: "890 Kč za firmu a měsíc" },
    ];
    window.ZKUSEBNI_DOBA = "Zkušební doba 14 dní";
    const VARIANTY = window.CENIK_VARIANTY;

    const KLIC_KONCEPTU = "rozpracovana-zakazka";

    const $ = (id) => document.getElementById(id);
    const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (z) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
    const cislo = celeCislo;
    // Datum, číslo i částku píše šablona — v angličtině „9 Nov“, „0.52“, „CZK 449“.
    const datum = (unix) => SimteGen.datum(unix);

    // ── Jazyk ──────────────────────────────────────────────────────────
    // Texty obrazovek jsou ve web/texty.js (česky i anglicky) a píšou se přes
    // SimteGen.t. Data truhláře (názvy zakázek, stěn, desek) se nepřekládají;
    // slova, která do dat píše aplikace sama (díly, olepení, hlášky kontroly),
    // přeloží texty-oboru.js až při zobrazení.
    const anglicky = () => SimteGen.jazyk() === "en";
    const typSkrinky = (typ) =>
      (anglicky() ? TYPY_SKRINEK_EN[typ] : TYPY_SKRINEK[typ]) || SimteGen.t("skrinka.nazev");
    const nazevDilu = (nazev, klic) => (anglicky() ? dilEn(nazev, klic) : nazev);
    const popisHran = (popis) => (anglicky() ? hranyEn(popis) : popis);
    const nazevMaterialu = (nazev) => (anglicky() ? materialEn(nazev) : nazev);
    const textHlasky = (text) => (anglicky() ? hlaskaEn(text) : text);

    // Hláška ze serveru je česky. Anglická stránka ukáže místo ní svou větu
    // pro danou akci — truhlář má vědět, co se stalo a co s tím.
    function chybaServeru(data, klic) {
      return !anglicky() && data && data.chyba ? data.chyba : SimteGen.t(klic);
    }

    // Volbu jazyka si pamatuje VÝHRADNĚ simtegen.js (localStorage „sg-volba“,
    // v manifestu pod uloziste_v_prohlizeci); tahle stránka sama jazyk nikam
    // neukládá — jen ho čte přes SimteGen.jazyk().
    // Přepnutí jazyka: simtegen.js si volbu zapamatuje a stránku načte znovu
    // přes location.replace(adresa). Aplikace má ale v adrese vždy #obrazovku,
    // a na adresu, která se liší jen kotvou, prohlížeč stránku znovu nenačte —
    // přepínač by vypadal mrtvý. Proto se před jeho klepnutím do adresy dočasně
    // vloží ?jazyk=…, který simtegen.js zase smaže: adresa se pak liší a stránka
    // se načte. Kotva zůstane, takže start() vrátí stejnou obrazovku.
    document.addEventListener("click", (udalost) => {
      const tlacitko = udalost.target.closest && udalost.target.closest("[data-prepinac-jazyka] button");
      if (!tlacitko || tlacitko.getAttribute("aria-pressed") === "true") return;
      const adresa = new URL(location.href);
      if (adresa.searchParams.has("jazyk")) return;
      adresa.searchParams.set("jazyk", SimteGen.jazyk());
      history.replaceState(history.state, "", adresa.toString());
    }, true);

    // Ikony kreslené jedním tahem na mřížce 24, tah 1,6 — z tématu dílny.
    const IKONY = {
      linka: '<rect x="3" y="4" width="18" height="16"/>'
        + '<path d="M3 12h18M12 4v16M10.2 8.6v1.6M10.2 14.4v1.6M13.8 8.6v1.6M13.8 14.4v1.6"/>',
      metr: '<rect x="2" y="9" width="20" height="7"/><circle cx="7" cy="12.5" r="1.9"/>'
        + '<path d="M12.5 9v2M15.5 9v2.8M18.5 9v2"/>',
      skrinka: '<rect x="4" y="3" width="16" height="18"/><path d="M12 3v18"/>'
        + '<path d="M10.2 11.2v1.6M13.8 11.2v1.6"/>',
      kusovnik: '<rect x="5" y="3" width="14" height="18"/>'
        + '<path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>',
      oko: '<path d="M2.5 12S6 6.2 12 6.2 21.5 12 21.5 12 18 17.8 12 17.8 2.5 12 2.5 12Z"/>'
        + '<circle cx="12" cy="12" r="2.6"/>',
    };

    function ikona(nazev) {
      return `<svg class="ikona-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">${IKONY[nazev] || ""}</svg>`;
    }

    // Nadpis sekce obyčejnými slovy (DESIGN.md v3: bez čísel „01 —“).
    function sekce(nazev, akce) {
      return `<div class="sekce-titulek"><span>${esc(nazev)}</span>${
        akce ? `<button type="button" data-sekce="${esc(akce.klic)}">${esc(akce.popisek)} →</button>` : ""
      }</div>`;
    }

    const VYCHOZI_ROZMERY = {
      spodni: { sirka_mm: 600, vyska_mm: 720, hloubka_mm: 510, pocet_polic: 1, pocet_dvirek: 1 },
      horni: { sirka_mm: 600, vyska_mm: 720, hloubka_mm: 320, pocet_polic: 1, pocet_dvirek: 1 },
      vysoka: { sirka_mm: 600, vyska_mm: 2000, hloubka_mm: 560, pocet_polic: 4, pocet_dvirek: 2 },
      rohova: { sirka_mm: 900, vyska_mm: 720, hloubka_mm: 510, pocet_polic: 1, pocet_dvirek: 1 },
    };

    const stav = {
      ja: null,
      zakazky: null,
      zakazkyChyba: false,
      vseZakazky: false,
      dokument: null,
      stenaIndex: 0,
      kusovnik: null,
      standard: null,
      ukazka: [],
      materialy: [],
      hlaseni: [],
      nahledRezim: "pohled",
      upravaVykresu: false,    // stěna: posouvání prstem ve výkresu
      posledniPosun: null,     // { stenaIndex, druh, i, puvodni } pro „Vrátit posun“
      ukladani: "cisto",   // cisto | ceka | chyba
    };

    // ── Komunikace s vlastním API ──────────────────────────────────────
    async function api(cesta, metoda, telo) {
      const odpoved = await fetch(cesta, {
        method: metoda || "GET",
        headers: telo ? { "Content-Type": "application/json" } : undefined,
        body: telo ? JSON.stringify(telo) : undefined,
      });
      const data = await odpoved.json().catch(() => ({}));
      if (odpoved.status === 402) {
        toast(SimteGen.t("predplatne.vyprselo_toast"));
        jdi("ucet");
      }
      return { ok: odpoved.ok, status: odpoved.status, data };
    }

    function toast(text) {
      const misto = $("toast-misto");
      misto.innerHTML = "";
      const bublina = document.createElement("div");
      bublina.className = "toast";
      bublina.textContent = text;
      misto.appendChild(bublina);
      setTimeout(() => { if (bublina.parentNode) bublina.remove(); }, 3200);
    }

    // ── Router ─────────────────────────────────────────────────────────
    // Vlastní historie: aplikace běží bez adresního řádku, takže hardwarové
    // tlačítko zpět na Androidu musí mít co vracet. Každá obrazovka proto
    // přidá záznam do history a reaguje na popstate.
    // titulek = klíč ve web/texty.js
    const OBRAZOVKY = {
      uvod: { titulek: "obrazovka.uvod", vykresli: vykresliUvod },
      zakazky: { titulek: "obrazovka.zakazky", vykresli: vykresliZakazky },
      zakazka: { titulek: "obrazovka.zakazka", zpet: true, vykresli: vykresliZakazku },
      stena: { titulek: "obrazovka.stena", zpet: true, vykresli: vykresliStenu },
      nahled: { titulek: "obrazovka.nahled", zpet: true, vykresli: vykresliNahled },
      kusovnik: { titulek: "obrazovka.kusovnik", zpet: true, vykresli: vykresliKusovnik },
      standard: { titulek: "obrazovka.standard", vykresli: vykresliStandard },
      ucet: { titulek: "obrazovka.ucet", vykresli: vykresliUcet },
    };
    const KORENOVE = { zakazky: 1, standard: 1, ucet: 1 };
    // Obrazovky uvnitř zakázky: v adrese nesou číslo zakázky (#nahled/12,
    // #stena/12/0), aby je start() po novém načtení stránky — přepnutí
    // jazyka, obnovení v prohlížeči — otevřel znovu na stejném místě.
    const VNITRNI = { zakazka: 1, stena: 1, nahled: 1, kusovnik: 1 };

    let aktualni = { nazev: "uvod", parametry: {} };

    function adresaObrazovky(nazev, parametry) {
      const zakazka = nazev === "zakazka" ? Number(parametry.id)
        : stav.dokument ? stav.dokument.zakazka.id : 0;
      if (!VNITRNI[nazev] || !zakazka) return "#" + nazev;
      if (nazev === "stena") return `#stena/${zakazka}/${cislo(parametry.index, stav.stenaIndex)}`;
      return `#${nazev}/${zakazka}`;
    }

    function jdi(nazev, parametry, nahradit) {
      const kam = { nazev, parametry: parametry || {} };
      const stavHistorie = { obrazovka: nazev, parametry: kam.parametry };
      const adresa = adresaObrazovky(nazev, kam.parametry);
      if (nahradit) history.replaceState(stavHistorie, "", adresa);
      else history.pushState(stavHistorie, "", adresa);
      zobraz(kam);
    }

    function zobraz(kam) {
      aktualni = kam;
      const def = OBRAZOVKY[kam.nazev] || OBRAZOVKY.zakazky;
      document.querySelectorAll(".obrazovka").forEach((o) =>
        o.classList.toggle("aktivni", o.id === "o-" + kam.nazev));
      $("titulek").textContent = SimteGen.t(def.titulek);
      // .skryte, ne atribut hidden: komponenty návrhového systému mají
      // display v třídě, a ta by atribut přebila.
      $("zpet").classList.toggle("skryte", !def.zpet);
      document.querySelectorAll(".navigace [data-cil]").forEach((b) => {
        const aktivni = b.dataset.cil === kam.nazev;
        if (aktivni) b.setAttribute("aria-current", "page");
        else b.removeAttribute("aria-current");
      });
      nastavListu([]);
      window.scrollTo(0, 0);
      def.vykresli(kam.parametry);
    }

    // Vizuální kontrola (vizualni_kontrola.py) prochází obrazovky tímhle
    // jménem — bez něj by jen přepnula třídu a změřila prázdnou sekci.
    window.ukaz = (id) => {
      const nazev = String(id || "").replace(/^o-/, "");
      if (OBRAZOVKY[nazev]) jdi(nazev, {}, true);
    };

    window.addEventListener("popstate", (udalost) => {
      const s = udalost.state;
      if (s && s.obrazovka) zobraz({ nazev: s.obrazovka, parametry: s.parametry || {} });
      else zobraz({ nazev: stav.ja && stav.ja.prihlasen ? "zakazky" : "uvod", parametry: {} });
    });

    $("zpet").addEventListener("click", () => history.back());
    document.querySelectorAll(".navigace [data-cil]").forEach((b) =>
      b.addEventListener("click", () => jdi(b.dataset.cil)));

    function nastavListu(tlacitka) {
      const lista = $("lista-dole");
      lista.innerHTML = "";
      lista.classList.toggle("skryte", !tlacitka.length);
      for (const t of tlacitka) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tlacitko" + (t.vedlejsi ? " vedlejsi" : "");
        button.textContent = t.popisek;
        // Háček pro snímky do obchodu (aplikace.snimky[].kliky) — chování nemění.
        if (t.klic) button.dataset.akce = t.klic;
        if (t.zakazane) button.disabled = true;
        button.addEventListener("click", t.akce);
        lista.appendChild(button);
      }
    }

    /** Položka seznamu, která je akce: <li> s tlačítkem ve tvaru řádku. */
    function radekTlacitko(obsahHtml, akce, data) {
      const li = document.createElement("li");
      const polozka = document.createElement("button");
      polozka.type = "button";
      polozka.className = "radek";
      polozka.innerHTML = obsahHtml;
      // data-* háčky pro snímky do obchodu (aplikace.snimky[].kliky).
      for (const [klic, hodnota] of Object.entries(data || {})) polozka.dataset[klic] = hodnota;
      polozka.addEventListener("click", akce);
      li.appendChild(polozka);
      return li;
    }

    function napojSekce(cil, akce) {
      cil.querySelectorAll("[data-sekce]").forEach((b) => {
        const fn = akce[b.dataset.sekce];
        if (fn) b.addEventListener("click", fn);
      });
    }

    /**
     * Obrazovka za přihlášením otevřená bez přihlášení. Menu je vidět vždy
     * (je to kostra aplikace), takže na ni jde klepnout i z úvodu — ať tam
     * místo prázdna nebo hlášky o chybě stojí, co s tím.
     */
    function nutnePrihlaseni(cil) {
      if (stav.ja && stav.ja.prihlasen) return false;
      cil.innerHTML = `<div class="prazdno">${ikona("linka")}
        <p>${esc(SimteGen.t("prihlaseni.nutne"))}</p></div>`;
      const tlacitko = document.createElement("button");
      tlacitko.type = "button";
      tlacitko.className = "tlacitko";
      tlacitko.textContent = SimteGen.t("prihlaseni.na_uvod");
      tlacitko.addEventListener("click", () => jdi("uvod"));
      cil.querySelector(".prazdno").appendChild(tlacitko);
      nastavListu([]);
      return true;
    }

    // ── Klávesnice ─────────────────────────────────────────────────────
    // Spodní panel je position: fixed, a ten se drží layoutového viewportu.
    // Ten se vysunutím klávesnice NEZMENŠÍ, takže formulář zůstane pod ní.
    // visualViewport jako jediný ví, kolik místa klávesnice sebrala.
    function sledujKlavesnici() {
      const vv = window.visualViewport;
      if (!vv) return;
      const koren = document.documentElement;
      const prepocti = () => {
        const skryto = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        koren.style.setProperty("--klavesnice", `${skryto}px`);
        koren.style.setProperty("--viditelna-vyska", `${Math.round(vv.height)}px`);
      };
      vv.addEventListener("resize", prepocti);
      vv.addEventListener("scroll", prepocti);
      prepocti();
    }

    // ── Spodní panel ───────────────────────────────────────────────────
    function otevriPanel(titulek, obsahHtml, pripoj) {
      zavriPanel();
      const misto = $("panel-misto");
      const pozadi = document.createElement("div");
      pozadi.className = "panel-pozadi";
      pozadi.addEventListener("click", zavriPanel);
      const panel = document.createElement("div");
      panel.className = "panel";
      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-modal", "true");
      panel.setAttribute("aria-label", titulek);
      panel.innerHTML = `<p class="stitek">${esc(SimteGen.t("panel.uprava"))}</p>
        <h2>${esc(titulek)}</h2>${obsahHtml}`;
      misto.appendChild(pozadi);
      misto.appendChild(panel);
      if (pripoj) pripoj(panel);

      // Klávesnice se vysune až po fokusu, takže se na políčko musí
      // doscrollovat s odstupem — jinak by se rolovalo do místa, které
      // za okamžik zakryje.
      panel.addEventListener("focusin", (u) => {
        if (!u.target.scrollIntoView) return;
        setTimeout(() => u.target.scrollIntoView({ block: "center", behavior: "smooth" }), 280);
      });
      // Enter odešle: v textovém poli spustí hlavní akci panelu.
      panel.addEventListener("keydown", (u) => {
        if (u.key === "Escape") { zavriPanel(); return; }
        if (u.key !== "Enter" || u.target.tagName === "TEXTAREA") return;
        const hlavni = panel.querySelector(".panel-akce .tlacitko");
        if (!hlavni) return;
        u.preventDefault();
        hlavni.click();
      });

      const prvni = panel.querySelector("input, select, textarea, button");
      if (prvni) prvni.focus({ preventScroll: true });
    }

    function zavriPanel() {
      $("panel-misto").innerHTML = "";
    }

    // ── Rozepsaná zakázka v telefonu ───────────────────────────────────
    // U zákazníka bývá mizerný signál. Rozepsaná zakázka se proto drží
    // i v telefonu a po uložení na server se odsud maže.
    function ulozKoncept() {
      if (!stav.dokument) return;
      try {
        localStorage.setItem(KLIC_KONCEPTU, JSON.stringify({
          zakazka_id: stav.dokument.zakazka.id,
          dokument: stav.dokument,
          cas: Math.floor(Date.now() / 1000),
        }));
      } catch { /* plná nebo zakázaná paměť prohlížeče nesmí shodit měření */ }
    }

    function nactiKoncept(zakazkaId) {
      try {
        const text = localStorage.getItem(KLIC_KONCEPTU);
        if (!text) return null;
        const koncept = JSON.parse(text);
        return koncept && koncept.zakazka_id === zakazkaId ? koncept : null;
      } catch {
        return null;
      }
    }

    function zahodKoncept() {
      try { localStorage.removeItem(KLIC_KONCEPTU); } catch { /* nevadí */ }
    }

    // ── Ukládání zakázky ───────────────────────────────────────────────
    let casovacUlozeni = null;

    function zmeneno() {
      stav.ukladani = "ceka";
      ulozKoncept();
      if (casovacUlozeni) clearTimeout(casovacUlozeni);
      casovacUlozeni = setTimeout(ulozNaServer, 1200);
    }

    async function ulozNaServer() {
      if (!stav.dokument) return;
      if (casovacUlozeni) { clearTimeout(casovacUlozeni); casovacUlozeni = null; }
      const id = stav.dokument.zakazka.id;
      const { ok, data } = await api(`/api/zakazky/${id}`, "PUT", stav.dokument)
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) {
        stav.ukladani = "chyba";
        prekresliStavUlozeni();
        return;
      }
      stav.dokument = data;
      stav.ukladani = "cisto";
      zahodKoncept();
      prekresliStavUlozeni();
    }

    function prekresliStavUlozeni() {
      document.querySelectorAll("[data-ulozeni]").forEach((prvek) => {
        if (stav.ukladani === "cisto") {
          prvek.className = "rozmer";
          prvek.textContent = SimteGen.t("ulozeni.ulozeno");
        } else if (stav.ukladani === "ceka") {
          prvek.className = "rozmer";
          prvek.textContent = SimteGen.t("ulozeni.ukladam");
        } else {
          prvek.className = "hlaska varovani";
          prvek.textContent = SimteGen.t("ulozeni.neulozeno");
        }
      });
    }

    // ── Výkres: pohled na stěnu a půdorys ──────────────────────────────
    // Kreslí se jako na papír: podlaha, sokl, pracovní deska, dvířka se
    // spárou a úchytkou, police čárkovaně jako skrytá hrana a pod stěnou
    // kóta s celkovou délkou. Úchytky nesou barvu produktu — jediné místo
    // ve výkrese, kde se používá, a nese informaci „tohle je čelo“.
    // moznosti.uprava = režim posouvání: každá skříňka a otvor je skupina
    // [data-prvek], za kterou jde chytit, a vpravo má úchyt šířky.
    // moznosti.aktivni = { druh, i } právě taženého prvku — dostane kóty
    // od obou konců stěny, ať truhlář vidí čísla, aniž by je psal.
    function nakresliPohled(stena, standard, kolizni, moznosti) {
      const st = standard || {};
      const kolize = kolizni || new Set();
      const uprava = Boolean(moznosti && moznosti.uprava);
      const aktivni = (moznosti && moznosti.aktivni) || null;
      const D = Math.max(1, cislo(stena.delka_mm, 3600));
      const V = Math.max(1, cislo(stena.vyska_mm, 2600));
      // Tloušťky čar a písmo jsou zlomky výšky stěny, protože viewBox je
      // v milimetrech — jinak by čára na krátké stěně byla jako prkno.
      const tenka = Math.max(3, Math.round(V / 330));
      const stredni = Math.max(5, Math.round(V / 190));
      const silna = Math.max(8, Math.round(V / 115));
      const pismo = Math.round(V / 24);
      const kota = Math.round(V * 0.13);
      const okraj = Math.round(Math.max(D, V) * 0.05);
      const carka = `${Math.round(V / 55)} ${Math.round(V / 90)}`;
      const y = (mm) => V - mm;            // výška nad podlahou → osa SVG
      const c = [];

      // Úchyt šířky na pravé hraně: viditelná lišta a kolem ní širší
      // průhledná plocha, aby se dala chytit i palcem na telefonu.
      const uchyt = (x, s, horni, spodni) => {
        if (!uprava) return "";
        const vyska = spodni - horni;
        const sirkaLisy = Math.max(stredni * 2, Math.round(V / 45));
        const delkaLisy = Math.min(vyska * 0.5, V / 7);
        const zachyt = Math.max(sirkaLisy * 3, Math.round(D / 16));
        return `<rect data-uchyt="sirka" x="${x + s - zachyt / 2}" y="${horni}" width="${zachyt}"
            height="${vyska}" fill="transparent"/>
          <rect data-uchyt="sirka" x="${x + s - sirkaLisy / 2}" y="${horni + (vyska - delkaLisy) / 2}"
            width="${sirkaLisy}" height="${delkaLisy}" fill="var(--barva-papir)"
            stroke="var(--barva-inkoust)" stroke-width="${tenka}"/>`;
      };

      c.push(`<rect x="0" y="0" width="${D}" height="${V}"
        fill="var(--barva-list)" stroke="var(--barva-linka)" stroke-width="${tenka}"/>`);

      (stena.otvory || []).forEach((o, index) => {
        const x = cislo(o.odsazeni_mm, 0);
        const s = Math.max(1, cislo(o.sirka_mm, 0));
        const v = Math.max(1, cislo(o.vyska_mm, 0));
        const dole = o.typ === "dvere" ? 0 : Math.max(0, cislo(o.parapet_mm, 0));
        c.push(`<g data-prvek="otvor" data-i="${index}">`);
        c.push(`<rect x="${x}" y="${y(dole + v)}" width="${s}" height="${v}"
          fill="var(--barva-papir)" stroke="var(--barva-tuzka-2)" stroke-width="${stredni}"/>`);
        c.push(`<path d="M${x + s / 2} ${y(dole + v)}V${y(dole)}M${x} ${y(dole + v / 2)}H${x + s}"
          stroke="var(--barva-tuzka-2)" stroke-width="${tenka}"/>`);
        if (o.typ !== "dvere") {
          c.push(`<rect x="${x - s * 0.03}" y="${y(dole)}" width="${s * 1.06}"
            height="${Math.round(V / 70)}" fill="var(--barva-tuzka-2)"/>`);
        }
        c.push(uchyt(x, s, y(dole + v), y(dole)));
        c.push("</g>");
      });

      const skrinky = stena.skrinky || [];
      skrinky.forEach((sk, index) => {
        const x = cislo(sk.odsazeni_mm, 0);
        const s = Math.max(1, cislo(sk.sirka_mm, 0));
        const [y1, y2] = svislyRozsah(sk, st);
        const v = Math.max(1, y2 - y1);
        const problem = kolize.has(index);
        const barva = problem ? "var(--barva-chyba)" : "var(--barva-inkoust)";
        c.push(`<g data-prvek="skrinka" data-i="${index}">`);

        if (sk.typ !== "horni" && y1 > 0) {
          c.push(`<rect x="${x + s * 0.04}" y="${y(y1)}" width="${s * 0.92}" height="${y1}"
            fill="var(--barva-plocha-2)" stroke="var(--barva-linka)" stroke-width="${tenka}"/>`);
        }

        c.push(`<rect x="${x}" y="${y(y2)}" width="${s}" height="${v}"
          fill="${problem ? "var(--barva-chyba-pozadi)" : "var(--barva-list)"}"
          stroke="${barva}" stroke-width="${stredni}"/>`);

        const police = Math.max(0, cislo(sk.pocet_polic, 0));
        for (let i = 1; i <= police; i += 1) {
          const yy = y1 + (v * i) / (police + 1);
          c.push(`<line x1="${x + s * 0.1}" y1="${y(yy)}" x2="${x + s * 0.9}" y2="${y(yy)}"
            stroke="var(--barva-linka-2)" stroke-width="${tenka}" stroke-dasharray="${carka}"/>`);
        }

        // Pořadí čel je stejné jako v rozpadu: zásuvky nahoře, dvířka pod nimi.
        const zasuvek = Math.max(0, cislo(sk.pocet_zasuvek, 0));
        const dvirek = Math.max(0, cislo(sk.pocet_dvirek, 0));
        const madlo = Math.max(Math.round(V / 95), Math.round(v / 16));
        let hranice = y2;
        for (let i = 0; i < zasuvek; i += 1) {
          const vyskaCela = dvirek > 0
            ? Math.min(cislo(sk.zasuvka_vyska_mm, 140), v / (zasuvek + 1))
            : v / zasuvek;
          hranice -= vyskaCela;
          if (hranice < y1) break;
          if (i < zasuvek - 1 || dvirek > 0) {
            c.push(`<line x1="${x}" y1="${y(hranice)}" x2="${x + s}" y2="${y(hranice)}"
              stroke="${barva}" stroke-width="${tenka}"/>`);
          }
          c.push(`<rect x="${x + s * 0.3}" y="${y(hranice + vyskaCela / 2 + madlo / 2)}"
            width="${s * 0.4}" height="${madlo}" fill="var(--barva-produktu)"/>`);
        }
        if (dvirek > 0 && hranice > y1) {
          const sirkaDvirek = s / dvirek;
          const stredDvirek = y1 + (hranice - y1) / 2;
          const delkaMadla = Math.min((hranice - y1) * 0.35, 220);
          for (let i = 0; i < dvirek; i += 1) {
            const leve = x + sirkaDvirek * i;
            if (i > 0) {
              c.push(`<line x1="${leve}" y1="${y(hranice)}" x2="${leve}" y2="${y(y1)}"
                stroke="${barva}" stroke-width="${tenka}"/>`);
            }
            // Úchytka u otevírací hrany — u dvojice dvířek tedy uprostřed.
            const mx = dvirek > 1 && i === 0
              ? leve + sirkaDvirek * 0.88
              : leve + sirkaDvirek * 0.12;
            c.push(`<rect x="${mx - madlo / 2}" y="${y(stredDvirek + delkaMadla / 2)}"
              width="${madlo}" height="${delkaMadla}" fill="var(--barva-produktu)"/>`);
          }
        }

        if (s > D / 10) {
          c.push(`<text x="${x + s / 2}" y="${y(y1) - pismo * 0.5}" text-anchor="middle"
            font-size="${pismo}" fill="var(--barva-tuzka)">${s}</text>`);
        }
        c.push(uchyt(x, s, y(y2), y(y1)));
        c.push("</g>");
      });

      // Pracovní deska leží na spodní řadě — bez ní to není kuchyně.
      const spodniRada = skrinky.filter((sk) => sk.typ === "spodni");
      if (spodniRada.length) {
        const odX = Math.min(...spodniRada.map((sk) => cislo(sk.odsazeni_mm, 0)));
        const doX = Math.max(...spodniRada.map((sk) =>
          cislo(sk.odsazeni_mm, 0) + cislo(sk.sirka_mm, 0)));
        const vrch = Math.max(...spodniRada.map((sk) => svislyRozsah(sk, st)[1]));
        const tl = Math.round(V / 65);
        c.push(`<rect x="${odX - tl}" y="${y(vrch + tl)}" width="${doX - odX + 2 * tl}"
          height="${tl}" fill="var(--barva-tuzka)" pointer-events="none"/>`);
      }

      // Kóty taženého prvku: od levého kraje stěny a od pravého kraje,
      // u okna i parapet. Kreslí se jen během tahu.
      const tazeny = aktivni
        ? (aktivni.druh === "skrinka" ? skrinky : stena.otvory || [])[aktivni.i] : null;
      if (tazeny) {
        const x = cislo(tazeny.odsazeni_mm, 0);
        const s = Math.max(1, cislo(tazeny.sirka_mm, 0));
        const jeOtvor = aktivni.druh === "otvor";
        const dole = jeOtvor
          ? (tazeny.typ === "dvere" ? 0 : Math.max(0, cislo(tazeny.parapet_mm, 0)))
          : svislyRozsah(tazeny, st)[0];
        const nahore = jeOtvor ? dole + Math.max(1, cislo(tazeny.vyska_mm, 0))
          : svislyRozsah(tazeny, st)[1];
        const ky = y((dole + nahore) / 2);
        const zarazka = Math.round(kota * 0.25);
        const kotaH = (od, po) => {
          if (po - od < 1) return;
          c.push(`<path d="M${od} ${ky}H${po}M${od} ${ky - zarazka}V${ky + zarazka}M${po} ${ky - zarazka}V${ky + zarazka}"
            stroke="var(--barva-inkoust)" stroke-width="${tenka}" pointer-events="none"/>`);
          c.push(`<text x="${(od + po) / 2}" y="${ky - zarazka * 1.3}" text-anchor="middle"
            font-size="${pismo}" fill="var(--barva-inkoust)" pointer-events="none">${Math.round(po - od)}</text>`);
        };
        kotaH(0, x);
        kotaH(x + s, D);
        if (jeOtvor && dole > 0) {
          const kx = x + s / 2;
          c.push(`<path d="M${kx} ${y(dole)}V${V}" stroke="var(--barva-inkoust)"
            stroke-width="${tenka}" stroke-dasharray="${carka}" pointer-events="none"/>`);
          c.push(`<text x="${kx + pismo * 0.4}" y="${y(dole / 2)}" font-size="${pismo}"
            fill="var(--barva-inkoust)" pointer-events="none">${dole}</text>`);
        }
      }

      c.push(`<line x1="${-okraj}" y1="${V}" x2="${D + okraj}" y2="${V}"
        stroke="var(--barva-inkoust)" stroke-width="${silna}"/>`);
      const ky = V + kota;
      c.push(`<path d="M0 ${ky}H${D}M0 ${ky - kota * 0.28}V${ky + kota * 0.28}M${D} ${ky - kota * 0.28}V${ky + kota * 0.28}"
        stroke="var(--barva-tuzka)" stroke-width="${tenka}"/>`);
      c.push(`<text x="${D / 2}" y="${ky - kota * 0.42}" text-anchor="middle"
        font-size="${pismo}" fill="var(--barva-tuzka)">${D} mm</text>`);

      return `<svg class="vykres-plocha${uprava ? " uprava" : ""}"
        viewBox="${-okraj} ${-okraj} ${D + 2 * okraj} ${V + okraj + kota * 1.3}"
        role="img" aria-label="${esc(SimteGen.t("vykres.pohled_popis", {
          nazev: stena.nazev || "", delka: D, vyska: V, pocet: skrinky.length }))}">${c.join("")}</svg>`;
    }

    function nakresliPudorys(steny) {
      // Stěny se skládají za sebou a po každé se zatáčí o 90° dovnitř —
      // tak vznikne tvar rovné, L i U kuchyně. Zdi jsou šrafované na 45°,
      // jak se kreslí řez ve výkrese; skříňky mají čelo silnější čarou.
      const idSrafy = `srafy-${Math.random().toString(36).slice(2, 8)}`;
      const tloustkaZdi = 120;
      let x = 0;
      let y = 0;
      let dx = 1;
      let dy = 0;
      const body = [];
      const zdi = [];
      const kusy = [];
      for (const stena of steny) {
        const D = Math.max(1, cislo(stena.delka_mm, 3600));
        const x2 = x + dx * D;
        const y2 = y + dy * D;
        const nx = -dy;   // normála dovnitř místnosti
        const ny = dx;

        const zed = [
          [x, y],
          [x2, y2],
          [x2 - nx * tloustkaZdi, y2 - ny * tloustkaZdi],
          [x - nx * tloustkaZdi, y - ny * tloustkaZdi],
        ];
        for (const bod of zed) body.push(bod);
        zdi.push(`<polygon points="${zed.map((b) => b.join(",")).join(" ")}"
          fill="url(#${idSrafy})" stroke="var(--barva-inkoust)" stroke-width="24"/>`);

        for (const sk of stena.skrinky || []) {
          const o = cislo(sk.odsazeni_mm, 0);
          const s = Math.max(1, cislo(sk.sirka_mm, 0));
          const h = Math.max(1, cislo(sk.hloubka_mm, 510));
          const ax = x + dx * o;
          const ay = y + dy * o;
          const rohy = [
            [ax, ay],
            [ax + dx * s, ay + dy * s],
            [ax + dx * s + nx * h, ay + dy * s + ny * h],
            [ax + nx * h, ay + ny * h],
          ];
          for (const bod of rohy) body.push(bod);
          kusy.push(`<polygon points="${rohy.map((b) => b.join(",")).join(" ")}"
            fill="var(--barva-list)" stroke="var(--barva-inkoust)" stroke-width="40"`
            + (sk.typ === "horni" ? ' stroke-dasharray="130 90"' : "") + "/>");
          if (sk.typ !== "horni") {
            kusy.push(`<line x1="${rohy[3][0]}" y1="${rohy[3][1]}"
              x2="${rohy[2][0]}" y2="${rohy[2][1]}" stroke="var(--barva-produktu)"
              stroke-width="90"/>`);
          }
        }
        x = x2;
        y = y2;
        dx = nx;
        dy = ny;
      }
      if (!body.length) return "";
      const xs = body.map((b) => b[0]);
      const ys = body.map((b) => b[1]);
      const minX = Math.min(...xs) - 300;
      const minY = Math.min(...ys) - 300;
      const sirka = Math.max(...xs) - minX + 600;
      const vyska = Math.max(...ys) - minY + 600;
      const defs = `<defs><pattern id="${idSrafy}" width="140" height="140"
        patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="140" stroke="var(--barva-tuzka-3)" stroke-width="24"/>
        </pattern></defs>`;
      return `<svg class="vykres-plocha" viewBox="${minX} ${minY} ${sirka} ${vyska}" role="img"
        aria-label="${esc(SimteGen.t("vykres.pudorys_popis"))}">${defs}${zdi.join("")}${kusy.join("")}</svg>`;
    }

    // Pořadí položek odpovídá barvám, které jim styl.css dá: inkoust,

    function legenda() {

    // Kontrola stěny je JEDNA funkce sdílená se serverem (web/kolize.js);

    // Hlášky přicházejí česky (stejné věty jdou do uloženého kusovníku);

    function kontrolaSteny(stena) {

        { typ: "spodni", odsazeni_mm: 600, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 0, pocet_dvirek: 0, pocet_zasuvek: 3 },
        { typ: "spodni", odsazeni_mm: 1200, sirka_mm: 900, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 1, pocet_dvirek: 2, pocet_zasuvek: 0 },
        { typ: "spodni", odsazeni_mm: 2100, sirka_mm: 900, vyska_mm: 720, hloubka_mm: 510,
          pocet_polic: 1, pocet_dvirek: 2, pocet_zasuvek: 0 },
        { typ: "horni", odsazeni_mm: 0, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 320,
          pocet_polic: 1, pocet_dvirek: 1, pocet_zasuvek: 0 },
        { typ: "horni", odsazeni_mm: 600, sirka_mm: 600, vyska_mm: 720, hloubka_mm: 320,
          pocet_polic: 1, pocet_dvirek: 1, pocet_zasuvek: 0 },
        { typ: "horni", odsazeni_mm: 2100, sirka_mm: 900, vyska_mm: 720, hloubka_mm: 320,
          pocet_polic: 1, pocet_dvirek: 2, pocet_zasuvek: 0 },

    // ── Obrazovka: úvod a přihlášení ───────────────────────────────────
    // Odkaz na nápovědu hlídá vykresli_napovedu.py přesně v tomhle tvaru,
    // proto je česká patička napsaná doslova. Právní texty a nápověda jsou
    // jen česky — anglická patička to řekne a odkazy vedou na tytéž stránky.

    let navstevaZapocitana = false;
    function zapoctiNavstevu() {
      if (navstevaZapocitana) return;
      navstevaZapocitana = true;
      api("/api/navsteva", "POST", { stranka: "uvod" }).catch(() => {});

    async function posliOdkaz() {
      const zprava = $("uvod-zprava");
      zprava.className = "hlaska";
      zprava.textContent = SimteGen.t("obecne.odesilam");
      const { ok, data } = await api("/api/prihlaseni", "POST", { email: $("email").value })
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) {
        zprava.className = "hlaska chyba";
        zprava.textContent = chybaServeru(data, "uvod.chyba_odeslani");
        return;
      }
      if (data.odkaz) {
        zprava.className = "hlaska";
        zprava.innerHTML = `<a href="${esc(data.odkaz)}">${esc(SimteGen.t("uvod.vyvojovy"))}</a>`;
        return;
      }
      zprava.className = "hlaska uspech";
      zprava.textContent = SimteGen.t("uvod.odeslano");
    }

    // ── Obrazovka: zakázky ─────────────────────────────────────────────
    async function vykresliZakazky() {
      const cil = $("o-zakazky");
      if (nutnePrihlaseni(cil)) return;
      nastavListu([{ popisek: SimteGen.t("zakazky.nova"), akce: panelNovaZakazka }]);
      const nadpis = sekce(SimteGen.t("zakazky.nadpis"));
      if (stav.zakazky === null) {
        cil.innerHTML = `${nadpis}<div class="seznam">
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>
          <div class="kostra kostra-radek"></div></div>`;
        const { ok, data } = await api("/api/zakazky").catch(() => ({ ok: false, data: {} }));
        stav.zakazkyChyba = !ok;
        stav.zakazky = ok ? (data.zakazky || []) : [];
        if (aktualni.nazev !== "zakazky") return;
      }

      if (stav.zakazkyChyba) {
        cil.innerHTML = `${nadpis}
          <div class="hlaska chyba">${esc(SimteGen.t("zakazky.chyba"))}</div>`;
        const znovu = document.createElement("button");
        znovu.type = "button";
        znovu.className = "tlacitko vedlejsi";
        znovu.textContent = SimteGen.t("obecne.znovu");
        znovu.addEventListener("click", () => { stav.zakazky = null; vykresliZakazky(); });
        cil.appendChild(znovu);
        return;
      }

      if (!stav.zakazky.length) {
        // Ukázková data nahraje a jedním klepnutím zase odstraní simtegen.js;
        // tlačítko ukáže jen účtu, kterému to jde.
        cil.innerHTML = `${nadpis}
          <div class="prazdno">${ikona("metr")}
          <p>${esc(SimteGen.t("zakazky.prazdne"))}</p></div>`;
        const zacit = document.createElement("button");
        zacit.type = "button";
        zacit.className = "tlacitko";
        zacit.textContent = SimteGen.t("zakazky.nova");
        zacit.addEventListener("click", panelNovaZakazka);
        const ukazka = document.createElement("button");
        ukazka.type = "button";
        ukazka.className = "tlacitko vedlejsi";
        ukazka.setAttribute("data-ukazkova-data", "");
        ukazka.textContent = SimteGen.t("zakazky.ukazkova_data");
        cil.querySelector(".prazdno").append(zacit, ukazka);
        return;
      }

      const vse = stav.zakazky;
      const videt = stav.vseZakazky ? vse : vse.slice(0, 5);
      const dilu = vse.reduce((s, z) => s + (z.pocet_dilu || 0), 0);
      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">${esc(SimteGen.t("zakazky.v_uctu"))}</p>
          <div class="cislo-radek"><span class="cislo-obri">${vse.length}</span>
            <p>${dilu
              ? `${esc(SimteGen.t("zakazky.dilu_celkem", { pocet: SimteGen.pocet(dilu, "pocet.dil") }))}<br>
                ${esc(SimteGen.t("zakazky.v_kusovnicich"))}`
              : esc(SimteGen.t("zakazky.bez_kusovniku"))}</p></div>
        </div>
        ${sekce(SimteGen.t("zakazky.nadpis"), vse.length > 5
          ? { klic: "vse", popisek: SimteGen.t(stav.vseZakazky ? "zakazky.jen_posledni" : "zakazky.vse") }
          : null)}
        <ul class="seznam" id="seznam-zakazek"></ul>`;
      const seznam = $("seznam-zakazek");
      videt.forEach((z, i) => {
        seznam.appendChild(radekTlacitko(
          `<span class="poradi">${String(i + 1).padStart(2, "0")}</span>
           <span class="hlavni"><strong>${esc(z.nazev)}</strong>
           <span>${esc(z.oznaceni_zakaznika || SimteGen.t("zakazky.bez_oznaceni"))} · ${esc(datum(z.zmeneno))}</span></span>
           <span class="vpravo">${z.pocet_dilu ? esc(SimteGen.pocet(z.pocet_dilu, "pocet.dil")) : "—"}</span>`,
          () => jdi("zakazka", { id: z.id }), { zakazka: z.id }));
      });
      napojSekce(cil, { vse: () => { stav.vseZakazky = !stav.vseZakazky; vykresliZakazky(); } });
    }

    function panelNovaZakazka() {
      otevriPanel(SimteGen.t("zakazky.nova"), `
        <div class="pole">
          <label for="nz-nazev">${esc(SimteGen.t("zakazka.nazev"))}</label>
          <input id="nz-nazev" type="text" placeholder="${esc(SimteGen.t("zakazka.nazev_vzor"))}"
            enterkeyhint="done">
          <span class="napoveda">${esc(SimteGen.t("zakazka.nazev_napoveda"))}</span>

          <label for="nz-zakaznik">${esc(SimteGen.t("zakazka.zakaznik_nepovinne"))}</label>
          <input id="nz-zakaznik" type="text" placeholder="${esc(SimteGen.t("zakazka.zakaznik_vzor"))}">
          <span class="napoveda">${esc(SimteGen.t("zakazka.zakaznik_napoveda"))}</span>
        </div>
        <div id="nz-zprava" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="nz-ulozit">${esc(SimteGen.t("zakazka.zalozit"))}</button>
        </div>`,
        (panel) => {
          panel.querySelector("#nz-ulozit").addEventListener("click", async () => {
            const zprava = panel.querySelector("#nz-zprava");
            zprava.className = "hlaska";
            zprava.textContent = SimteGen.t("zakazka.zakladam");
            const { ok, data } = await api("/api/zakazky", "POST", {
              nazev: panel.querySelector("#nz-nazev").value,
              oznaceni_zakaznika: panel.querySelector("#nz-zakaznik").value,
            }).catch(() => ({ ok: false, data: {} }));
            if (!ok) {
              zprava.className = "hlaska chyba";
              zprava.textContent = chybaServeru(data, "zakazka.chyba_zalozeni");
              return;
            }
            zavriPanel();
            stav.zakazky = null;
            toast(SimteGen.t("zakazka.zalozena"));
            jdi("zakazka", { id: data.id });
          });
        });
    }

    // ── Obrazovka: zakázka ─────────────────────────────────────────────
    /** Načte zakázku do stav.dokument; přednost má novější neuložené měření z telefonu. */
    async function nactiDokument(id) {
      const { ok, data } = await api(`/api/zakazky/${id}`).catch(() => ({ ok: false, data: {} }));
      if (!ok) return { ok, data };
      stav.dokument = data;
      stav.kusovnik = null;
      stav.ukladani = "cisto";
      const koncept = nactiKoncept(id);
      if (koncept && koncept.cas > (data.zakazka.zmeneno || 0)) {
        stav.dokument = koncept.dokument;
        toast(SimteGen.t("zakazka.koncept_obnoven"));
        zmeneno();
      }
      return { ok, data };
    }

    async function vykresliZakazku(parametry) {
      const cil = $("o-zakazka");
      if (nutnePrihlaseni(cil)) return;
      const id = Number(parametry.id);
      if (!stav.dokument || stav.dokument.zakazka.id !== id) {
        cil.innerHTML = `<div class="kostra kostra-karta"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        const { ok, data } = await nactiDokument(id);
        if (!ok) {
          cil.innerHTML = `<div class="hlaska chyba">${esc(chybaServeru(data, "zakazka.chyba_nacteni"))}</div>`;
          nastavListu([{ popisek: SimteGen.t("zakazka.zpet_na_zakazky"), vedlejsi: true,
            akce: () => jdi("zakazky") }]);
          return;
        }
        if (aktualni.nazev !== "zakazka") return;
      }
      if (!stav.standard) await nactiStandard();

      const dokument = stav.dokument;
      $("titulek").textContent = dokument.zakazka.nazev;
      const skrinek = (dokument.steny || []).reduce((s, x) => s + (x.skrinky || []).length, 0);
      const posledni = dokument.posledni_kusovnik;
      const platny = posledni && posledni.vytvoreno >= (dokument.zakazka.zmeneno || 0);

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">${esc(SimteGen.t(platny ? "zakazka.dilu_v_kusovniku" : "zakazka.skrinek"))}</p>
          <div class="cislo-radek">
            <span class="cislo-obri">${platny ? posledni.pocet_dilu : skrinek}</span>
            <p>${esc(dokument.zakazka.oznaceni_zakaznika || SimteGen.t("zakazka.bez_oznaceni"))}<br>
            ${esc(platny
              ? SimteGen.t("zakazka.odhad_desek", {
                pocet: SimteGen.pocet(posledni.odhad_desek, "pocet.deska"), datum: datum(posledni.vytvoreno) })
              : SimteGen.pocet((dokument.steny || []).length, "pocet.stena"))}</p>
          </div>
          ${posledni && !platny ? `<p class="hlaska varovani">${esc(SimteGen.t("zakazka.zmenena"))}</p>` : ""}
          <p data-ulozeni class="rozmer">${esc(SimteGen.t("ulozeni.ulozeno"))}</p>
        </div>
        ${sekce(SimteGen.t("zakazka.steny"), { klic: "stena", popisek: SimteGen.t("obecne.pridat") })}
        <div id="seznam-sten"></div>
        ${sekce(SimteGen.t("obrazovka.zakazka"))}
        <ul class="seznam" id="akce-zakazky"></ul>`;

      const seznamSten = $("seznam-sten");
      if (!(dokument.steny || []).length) {
        seznamSten.innerHTML = `<div class="prazdno">${ikona("metr")}
          <p>${esc(SimteGen.t("zakazka.prazdna"))}</p></div>`;
        const start = document.createElement("button");
        start.type = "button";
        start.className = "tlacitko vedlejsi";
        start.textContent = SimteGen.t("zakazka.pridat_stenu");
        start.addEventListener("click", pridejStenu);
        seznamSten.querySelector(".prazdno").appendChild(start);
      } else {
        const seznam = document.createElement("ul");
        seznam.className = "seznam";
        dokument.steny.forEach((stena, index) => {
          const { hlasky } = kontrolaSteny(stena);
          seznam.appendChild(radekTlacitko(
            `<span class="poradi">${String(index + 1).padStart(2, "0")}</span>
             <span class="hlavni"><strong>${esc(stena.nazev)}</strong>
             <span>${stena.delka_mm} × ${stena.vyska_mm} mm ·
             ${esc(SimteGen.pocet((stena.skrinky || []).length, "pocet.skrinka"))}</span></span>
             <span class="vpravo">${hlasky.length ? hlasky.length + " ⚠" : "›"}</span>`,
            () => jdi("stena", { index }), { stena: index }));
        });
        seznamSten.appendChild(seznam);
      }

      const akce = $("akce-zakazky");
      pridejAkci(akce, SimteGen.t("akce.nahled"), SimteGen.t("akce.nahled_popis"), () => jdi("nahled"),
        { akce: "nahled" });
      pridejAkci(akce, SimteGen.t("akce.kopie"), SimteGen.t("akce.kopie_popis"), kopirujZakazku);
      pridejAkci(akce, SimteGen.t("akce.upravit"), "", panelUpravZakazku);
      pridejAkci(akce, SimteGen.t("akce.smazat_zakazku"), SimteGen.t("akce.nevratne"), smazZakazku);

      napojSekce(cil, { stena: pridejStenu });
      prekresliStavUlozeni();
      nastavListu([
        { popisek: SimteGen.t("kusovnik.vygenerovat"), akce: vygenerujKusovnik, zakazane: skrinek === 0,
          klic: "kusovnik" },
      ]);
    }

    function pridejAkci(seznam, nazev, popis, akce, data) {
      seznam.appendChild(radekTlacitko(
        `<span class="hlavni"><strong>${esc(nazev)}</strong>${
          popis ? `<span>${esc(popis)}</span>` : ""}</span><span class="vpravo">›</span>`,
        akce, data));
    }

    function pridejStenu() {
      const poradi = (stav.dokument.steny || []).length;
      stav.dokument.steny.push({
        nazev: SimteGen.t("stena.nova", { pismeno: String.fromCharCode(65 + poradi) }),
        delka_mm: 3600, vyska_mm: 2600, roh_vlevo: 0, roh_vpravo: 0,
        otvory: [], skrinky: [],
      });
      zmeneno();
      jdi("stena", { index: poradi });
    }

    function panelUpravZakazku() {
      const z = stav.dokument.zakazka;
      otevriPanel(SimteGen.t("obrazovka.zakazka"), `
        <div class="pole"><label for="uz-nazev">${esc(SimteGen.t("obecne.nazev"))}</label>
          <input id="uz-nazev" type="text" value="${esc(z.nazev)}"></div>
        <div class="pole"><label for="uz-zakaznik">${esc(SimteGen.t("zakazka.zakaznik"))}</label>
          <input id="uz-zakaznik" type="text" value="${esc(z.oznaceni_zakaznika || "")}"></div>
        <div class="pole"><label for="uz-poznamka">${esc(SimteGen.t("zakazka.poznamka"))}</label>
          <textarea id="uz-poznamka" rows="3" maxlength="1000">${esc(z.poznamka || "")}</textarea></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="uz-ulozit">${esc(SimteGen.t("zakazka.ulozit"))}</button>
        </div>`,
        (panel) => {
          panel.querySelector("#uz-ulozit").addEventListener("click", () => {
            z.nazev = panel.querySelector("#uz-nazev").value.trim() || z.nazev;
            z.oznaceni_zakaznika = panel.querySelector("#uz-zakaznik").value.trim();
            z.poznamka = panel.querySelector("#uz-poznamka").value.trim();
            zavriPanel();
            zmeneno();
            stav.zakazky = null;
            vykresliZakazku({ id: z.id });
            toast(SimteGen.t("obecne.ulozeno"));
          });
        });
    }

    async function kopirujZakazku() {
      const id = stav.dokument.zakazka.id;
      toast(SimteGen.t("zakazka.kopiruji"));
      const { ok, data } = await api(`/api/zakazky/${id}/kopie`, "POST", {})
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(chybaServeru(data, "zakazka.chyba_kopie")); return; }
      stav.zakazky = null;
      stav.dokument = null;
      toast(SimteGen.t("zakazka.kopie_hotova"));
      jdi("zakazka", { id: data.id });
    }

    async function smazZakazku() {
      const z = stav.dokument.zakazka;
      // Server maže zakázku natvrdo, proto otázka místo vrácení.
      if (!await SimteGen.potvrd(SimteGen.t("zakazka.smazat_otazka", { nazev: z.nazev }), {
        popis: SimteGen.t("zakazka.smazat_popis"),
        ano: SimteGen.t("akce.smazat_zakazku"), nebezpecne: true })) return;
      const { ok, data } = await api(`/api/zakazky/${z.id}`, "DELETE")
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(chybaServeru(data, "obecne.chyba_smazani")); return; }
      zahodKoncept();
      stav.dokument = null;
      stav.zakazky = null;
      toast(SimteGen.t("zakazka.smazana"));
      jdi("zakazky", {}, true);
    }

    // ── Obrazovka: stěna ───────────────────────────────────────────────
    function vykresliStenu(parametry) {
      const cil = $("o-stena");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }
      const index = cislo(parametry.index, stav.stenaIndex);
      const stena = (stav.dokument.steny || [])[index];
      if (!stena) { jdi("zakazka", { id: stav.dokument.zakazka.id }, true); return; }
      stav.stenaIndex = index;
      $("titulek").textContent = stena.nazev;

      const { kolizni, hlasky } = kontrolaSteny(stena);
      const uprava = stav.upravaVykresu;
      const lzeVratit = Boolean(stav.posledniPosun && stav.posledniPosun.stenaIndex === index);

      cil.innerHTML = `
        <div class="karta vykres">
          ${nakresliPohled(stena, stav.standard, kolizni, { uprava })}
          ${legenda()}
          ${uprava ? `<p class="rozmer" id="st-odecet" aria-live="polite">${esc(SimteGen.t("stena.navod_tahu"))}</p>` : ""}
          <div class="vykres-akce">
            <button type="button" class="tlacitko vedlejsi" id="st-uprava"
              aria-pressed="${uprava ? "true" : "false"}">${esc(SimteGen.t(uprava
                ? "stena.posouvani_hotovo" : "stena.posouvat"))}</button>
            ${uprava && lzeVratit
              ? `<button type="button" class="tlacitko vedlejsi" id="st-vratit">${esc(SimteGen.t("stena.vratit_posun"))}</button>`
              : ""}
          </div>
        </div>
        ${hlasky.length ? `<div class="hlaska varovani">${hlasky.map(esc).join("<br>")}</div>` : ""}
        ${sekce(SimteGen.t("stena.rozmery"))}
        <div class="dvojice-poli">
          <div class="pole"><label for="st-delka">${esc(SimteGen.t("stena.delka"))}</label>
            <input id="st-delka" type="number" inputmode="numeric" min="200" max="20000"
                   value="${cislo(stena.delka_mm, 3600)}"></div>
          <div class="pole"><label for="st-vyska">${esc(SimteGen.t("stena.vyska"))}</label>
            <input id="st-vyska" type="number" inputmode="numeric" min="500" max="5000"
                   value="${cislo(stena.vyska_mm, 2600)}"></div>
        </div>
        <div class="pole"><label for="st-nazev">${esc(SimteGen.t("stena.nazev"))}</label>
          <input id="st-nazev" type="text" value="${esc(stena.nazev)}"></div>
        <label class="volba"><input type="checkbox" id="st-roh-vlevo"
          ${stena.roh_vlevo ? "checked" : ""}> ${esc(SimteGen.t("stena.roh_vlevo"))}</label>
        <label class="volba"><input type="checkbox" id="st-roh-vpravo"
          ${stena.roh_vpravo ? "checked" : ""}> ${esc(SimteGen.t("stena.roh_vpravo"))}</label>
        ${sekce(SimteGen.t("stena.otvory"), { klic: "otvor", popisek: SimteGen.t("obecne.pridat") })}
        <div id="seznam-otvoru"></div>
        ${sekce(SimteGen.t("stena.skrinky"))}
        <div id="seznam-skrinek"></div>
        <p data-ulozeni class="rozmer">${esc(SimteGen.t("ulozeni.ulozeno"))}</p>
        <ul class="seznam" id="akce-steny"></ul>`;

      const napoj = (id, klic, jeCislo) => {
        const prvek = $(id);
        prvek.addEventListener("change", () => {
          stena[klic] = jeCislo ? cislo(prvek.value, stena[klic])
            : (prvek.type === "checkbox" ? (prvek.checked ? 1 : 0) : prvek.value.trim());
          zmeneno();
          vykresliStenu({ index });
        });
      };
      napoj("st-delka", "delka_mm", true);
      napoj("st-vyska", "vyska_mm", true);
      napoj("st-nazev", "nazev", false);
      napoj("st-roh-vlevo", "roh_vlevo", false);
      napoj("st-roh-vpravo", "roh_vpravo", false);

      const otvory = $("seznam-otvoru");
      if (!(stena.otvory || []).length) {
        otvory.innerHTML = `<p class="popisek">${esc(SimteGen.t("stena.bez_otvoru"))}</p>`;
      } else {
        const seznam = document.createElement("ul");
        seznam.className = "seznam";
        stena.otvory.forEach((o, i) => {
          const dvere = o.typ === "dvere";
          seznam.appendChild(radekTlacitko(
            `<span class="hlavni">
             <strong>${esc(SimteGen.t(dvere ? "otvor.dvere" : "otvor.okno"))} ${o.sirka_mm} × ${o.vyska_mm} mm</strong>
             <span>${esc(SimteGen.t(dvere ? "otvor.poloha_dvere" : "otvor.poloha_okno",
               { od: o.odsazeni_mm, parapet: o.parapet_mm }))}</span>
             </span><span class="vpravo">›</span>`,
            () => panelOtvor(stena, i, index)));
        });
        otvory.appendChild(seznam);
      }

      const skrinky = $("seznam-skrinek");
      if (!(stena.skrinky || []).length) {
        skrinky.innerHTML = `<div class="prazdno">${ikona("skrinka")}
          <p>${esc(SimteGen.t("stena.bez_skrinek"))}</p></div>`;
      } else {
        const seznam = document.createElement("ul");
        seznam.className = "seznam";
        stena.skrinky.forEach((sk, i) => {
          const casti = [
            SimteGen.t("skrinka.od", { od: cislo(sk.odsazeni_mm, 0) }),
            SimteGen.pocet(cislo(sk.pocet_polic, 0), "pocet.police"),
            SimteGen.pocet(cislo(sk.pocet_dvirek, 0), "pocet.dvirka"),
          ];
          if (sk.pocet_zasuvek) casti.push(SimteGen.pocet(cislo(sk.pocet_zasuvek, 0), "pocet.zasuvka"));
          seznam.appendChild(radekTlacitko(
            `<span class="poradi">${String(i + 1).padStart(2, "0")}</span>
             ${ikona("skrinka")}<span class="hlavni">
             <strong>${esc(typSkrinky(sk.typ))}
               ${sk.sirka_mm} × ${sk.vyska_mm} × ${sk.hloubka_mm}</strong>
             <span>${esc(casti.join(" · "))}</span>
             </span><span class="vpravo">${kolizni.has(i) ? "⚠" : "›"}</span>`,
            () => panelSkrinka(stena, i, index)));
        });
        skrinky.appendChild(seznam);
      }

      pridejAkci($("akce-steny"), SimteGen.t("akce.nahled"), "", () => jdi("nahled"));
      pridejAkci($("akce-steny"), SimteGen.t("stena.smazat"), SimteGen.t("stena.smazat_popis"), () => {
        const zakazkaId = stav.dokument.zakazka.id;
        const [vyjmuta] = stav.dokument.steny.splice(index, 1);
        zmeneno();
        SimteGen.vratitelne(SimteGen.t("stena.smazana"), () => {
          // Dokument se po uložení na server vyměňuje — vrací se do aktuálního.
          if (!stav.dokument || stav.dokument.zakazka.id !== zakazkaId) {
            toast(SimteGen.t("stena.nejde_vratit"));
            return;
          }
          const kam = Math.min(index, stav.dokument.steny.length);
          stav.dokument.steny.splice(kam, 0, vyjmuta);
          zmeneno();
          jdi("stena", { index: kam });
        });
        jdi("zakazka", { id: zakazkaId }, true);
      });

      $("st-uprava").addEventListener("click", () => {
        stav.upravaVykresu = !stav.upravaVykresu;
        vykresliStenu({ index });
      });
      const vratit = $("st-vratit");
      if (vratit) {
        vratit.addEventListener("click", () => {
          const p = stav.posledniPosun;
          stav.posledniPosun = null;
          // Dokument se po uložení na server vyměňuje — bere se ten aktuální.
          const ted = (stav.dokument.steny || [])[index] || stena;
          const pole = p.druh === "skrinka" ? ted.skrinky : ted.otvory;
          const prvek = pole && pole[p.i];
          // Vrací se jen tehdy, když má prvek pořád polohu z posunu; když ho
          // mezitím někdo upravil nebo smazal, vrátil by se jiný prvek.
          if (!prvek || ["odsazeni_mm", "sirka_mm", "parapet_mm"]
            .some((klic) => cislo(prvek[klic], 0) !== cislo(p.po[klic], 0))) {
            vykresliStenu({ index });
            toast(SimteGen.t("stena.posun_nejde_vratit"));
            return;
          }
          prvek.odsazeni_mm = p.puvodni.odsazeni_mm;
          prvek.sirka_mm = p.puvodni.sirka_mm;
          prvek.parapet_mm = p.puvodni.parapet_mm;
          zmeneno();
          vykresliStenu({ index });
          toast(SimteGen.t("stena.posun_vracen"));
        });
      }
      if (uprava) napojTah(cil.querySelector(".vykres-plocha"), stena, index);

      napojSekce(cil, { otvor: () => panelOtvor(stena, -1, index) });
      prekresliStavUlozeni();
      nastavListu([{ popisek: SimteGen.t("stena.pridat_skrinku"), akce: () => panelSkrinka(stena, -1, index) }]);
    }

    // ── Posouvání ve výkresu ───────────────────────────────────────────
    // Tah prstem nebo myší mění TATÁŽ čísla jako formulář (odsazení, šířka,
    // parapet), takže kusovník i kontrola stěny o tahu nic vědět nemusí.
    // Krok je 10 mm; do 10 px od hrany sousední skříňky, otvoru nebo konce
    // stěny se prvek k hraně přichytí. Přesné číslo jde dál zapsat v panelu.
    const KROK_TAHU_MM = 10;
    const PRICHYCENI_PX = 10;
    const PRAH_TAHU_PX = 6;

    function napojTah(svg, vychoziStena, index) {
      if (!svg) return;
      // Po automatickém uložení se stav.dokument vymění za odpověď serveru,
      // proto se stěna bere znovu při každém chycení a výsledek tahu se na
      // konci zapisuje do právě platného dokumentu.
      const platnaStena = () =>
        (stav.dokument && (stav.dokument.steny || [])[index]) || vychoziStena;
      let stena = vychoziStena;
      const D = Math.max(1, cislo(stena.delka_mm, 3600));
      const V = Math.max(1, cislo(stena.vyska_mm, 2600));
      const odecet = $("st-odecet");
      let tah = null;

      const bodVMm = (udalost) => {
        const matice = svg.getScreenCTM();
        if (!matice) return { x: 0, y: 0 };
        const bod = svg.createSVGPoint();
        bod.x = udalost.clientX;
        bod.y = udalost.clientY;
        const p = bod.matrixTransform(matice.inverse());
        return { x: p.x, y: p.y };
      };
      const mmNaPx = () => {
        const matice = svg.getScreenCTM();
        return matice && matice.a ? 1 / matice.a : 1;
      };
      const naKrok = (mm) => Math.round(mm / KROK_TAHU_MM) * KROK_TAHU_MM;
      const omez = (hodnota, min, max) => Math.min(Math.max(hodnota, min), Math.max(min, max));

      // Hrany, ke kterým se přichytává: konce stěny a hrany ostatních prvků.
      const hrany = (druh, i) => {
        const vysledek = [0, D];
        (stena.skrinky || []).forEach((sk, j) => {
          if (druh === "skrinka" && j === i) return;
          const x = cislo(sk.odsazeni_mm, 0);
          vysledek.push(x, x + cislo(sk.sirka_mm, 0));
        });
        (stena.otvory || []).forEach((o, j) => {
          if (druh === "otvor" && j === i) return;
          const x = cislo(o.odsazeni_mm, 0);
          vysledek.push(x, x + cislo(o.sirka_mm, 0));
        });
        return vysledek;
      };
      const nejblizsi = (hodnota, kandidati, mez) => {
        let nalez = null;
        for (const k of kandidati) {
          const vzdalenost = Math.abs(k - hodnota);
          if (vzdalenost <= mez && (nalez === null || vzdalenost < Math.abs(nalez - hodnota))) nalez = k;
        }
        return nalez;
      };

      const popisPrvku = (t) => {
        const p = t.prvek;
        const nazev = t.druh === "skrinka"
          ? SimteGen.t("skrinka.cislo", { cislo: String(t.i + 1).padStart(2, "0") })
          : SimteGen.t(p.typ === "dvere" ? "otvor.dvere" : "otvor.okno");
        const casti = [nazev, SimteGen.t("skrinka.od", { od: p.odsazeni_mm }),
          SimteGen.t("tah.sirka", { sirka: p.sirka_mm })];
        if (t.druh === "otvor" && p.typ !== "dvere") casti.push(SimteGen.t("tah.parapet", { parapet: p.parapet_mm }));
        return casti.join(" · ");
      };

      const prekresli = () => {
        const { kolizni } = kontrolaSteny(stena);
        const docasny = document.createElement("div");
        docasny.innerHTML = nakresliPohled(stena, stav.standard, kolizni, {
          uprava: true, aktivni: tah && tah.pohnuto ? { druh: tah.druh, i: tah.i } : null,
        });
        svg.replaceChildren(...docasny.firstElementChild.childNodes);
        if (odecet && tah) odecet.textContent = popisPrvku(tah);
      };

      svg.addEventListener("pointerdown", (udalost) => {
        if (tah || (udalost.pointerType === "mouse" && udalost.button !== 0)) return;
        const skupina = udalost.target.closest("[data-prvek]");
        if (!skupina) return;
        stena = platnaStena();
        const druh = skupina.dataset.prvek;
        const i = Number(skupina.dataset.i);
        const pole = druh === "skrinka" ? stena.skrinky : stena.otvory;
        if (!pole || !pole[i]) return;
        tah = {
          druh, i, prvek: pole[i], puvodni: { ...pole[i] },
          sirka: Boolean(udalost.target.closest("[data-uchyt]")),
          start: bodVMm(udalost), pohnuto: false, id: udalost.pointerId,
        };
        svg.setPointerCapture(udalost.pointerId);
        udalost.preventDefault();
      });

      svg.addEventListener("pointermove", (udalost) => {
        if (!tah || udalost.pointerId !== tah.id) return;
        const bod = bodVMm(udalost);
        const dx = bod.x - tah.start.x;
        const dy = bod.y - tah.start.y;
        const naPx = mmNaPx();
        if (!tah.pohnuto && Math.hypot(dx, dy) < PRAH_TAHU_PX * naPx) return;
        tah.pohnuto = true;
        const p = tah.prvek;
        const puv = tah.puvodni;
        const mez = PRICHYCENI_PX * naPx;
        const kandidati = hrany(tah.druh, tah.i);
        const x0 = cislo(puv.odsazeni_mm, 0);

        if (tah.sirka) {
          const [min, max] = tah.druh === "skrinka" ? [100, 1400] : [200, D];
          let pravy = x0 + cislo(puv.sirka_mm, 0) + dx;
          const prichyceno = nejblizsi(pravy, kandidati, mez);
          pravy = prichyceno !== null ? prichyceno : naKrok(pravy);
          p.sirka_mm = omez(Math.round(pravy - x0), min, Math.min(max, D - x0));
        } else {
          const s = cislo(p.sirka_mm, 0);
          let levy = x0 + dx;
          const kLevemu = nejblizsi(levy, kandidati, mez);
          const kPravemu = nejblizsi(levy + s, kandidati, mez);
          if (kLevemu !== null && (kPravemu === null
              || Math.abs(kLevemu - levy) <= Math.abs(kPravemu - levy - s))) levy = kLevemu;
          else if (kPravemu !== null) levy = kPravemu - s;
          else levy = naKrok(levy);
          p.odsazeni_mm = omez(Math.round(levy), 0, D - s);
          // Okno jde posunout i nahoru a dolů (parapet); skříňky ne — jejich
          // výšku nad podlahou dává konstrukční standard, ne tah.
          if (tah.druh === "otvor" && p.typ !== "dvere") {
            const parapet = naKrok(cislo(puv.parapet_mm, 0) - dy);
            p.parapet_mm = omez(parapet, 0, V - cislo(p.vyska_mm, 0));
          }
        }
        prekresli();
      });

      const konec = (udalost, zrusit) => {
        if (!tah || udalost.pointerId !== tah.id) return;
        const t = tah;
        tah = null;
        if (svg.hasPointerCapture(udalost.pointerId)) svg.releasePointerCapture(udalost.pointerId);
        if (!t.pohnuto) {
          if (zrusit) return;
          // Klepnutí bez posunu otevře rozměry jako v seznamu pod výkresem.
          if (t.druh === "skrinka") panelSkrinka(stena, t.i, index);
          else panelOtvor(stena, t.i, index);
          return;
        }
        if (zrusit) {
          Object.assign(t.prvek, t.puvodni);
          vykresliStenu({ index });
          return;
        }
        const po = {
          odsazeni_mm: t.prvek.odsazeni_mm, sirka_mm: t.prvek.sirka_mm, parapet_mm: t.prvek.parapet_mm,
        };
        // Uložení mohlo doběhnout během tahu a dokument vyměnit: výsledek
        // se proto propíše i do prvku v právě platném dokumentu.
        const ted = platnaStena();
        const pole = t.druh === "skrinka" ? ted.skrinky : ted.otvory;
        if (pole && pole[t.i] && pole[t.i] !== t.prvek) Object.assign(pole[t.i], po);
        stav.posledniPosun = { stenaIndex: index, druh: t.druh, i: t.i, puvodni: t.puvodni, po };
        zmeneno();
        vykresliStenu({ index });
      };
      svg.addEventListener("pointerup", (udalost) => konec(udalost, false));
      svg.addEventListener("pointercancel", (udalost) => konec(udalost, true));
    }

            if (novy) stena.otvory.push(novyOtvor);
            else stena.otvory[poradi] = novyOtvor;
            zavriPanel();
            zmeneno();
            vykresliStenu({ index: stenaIndex });
            toast(SimteGen.t("obecne.ulozeno"));
          });
          const smazat = panel.querySelector("#ot-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              stena.otvory.splice(poradi, 1);
              zavriPanel();
              zmeneno();
              vykresliStenu({ index: stenaIndex });

            });
          }
        });
    }

            ...VYCHOZI_ROZMERY.spodni,
            pocet_zasuvek: 0, zasuvka_vyska_mm: 140, zada_typ_prepis: "",
            material_id: null, poznamka: "",

            <input id="sk-sirka" type="number" inputmode="numeric" min="100" max="1400"

          <input id="sk-odsazeni" type="number" inputmode="numeric" value="${cislo(sk.odsazeni_mm, 0)}"></div>
        <div class="trojice">
          <div class="pole"><label for="sk-police">${esc(SimteGen.t("skrinka.police"))}</label>
            <input id="sk-police" type="number" inputmode="numeric" min="0" max="12"
                   value="${cislo(sk.pocet_polic, 0)}"></div>
          <div class="pole"><label for="sk-dvirka">${esc(SimteGen.t("skrinka.dvirka"))}</label>
            <input id="sk-dvirka" type="number" inputmode="numeric" min="0" max="4"
                   value="${cislo(sk.pocet_dvirek, 0)}"></div>

        </div>
        <div class="pole"><label for="sk-celo">${esc(SimteGen.t("skrinka.celo"))}</label>
          <input id="sk-celo" type="number" inputmode="numeric" min="50" max="600"
                 value="${cislo(sk.zasuvka_vyska_mm, 140)}">

            <option value="drazka"${sk.zada_typ_prepis === "drazka" ? " selected" : ""}>${esc(SimteGen.t("zada.drazka"))}</option>
            <option value="nasazena"${sk.zada_typ_prepis === "nasazena" ? " selected" : ""}>${esc(SimteGen.t("zada.nasazena"))}</option>

        (panel) => {
          panel.querySelector("#sk-typ").addEventListener("change", (u) => {
            const vychozi = VYCHOZI_ROZMERY[u.target.value];

            panel.querySelector("#sk-hloubka").value = vychozi.hloubka_mm;
            panel.querySelector("#sk-police").value = vychozi.pocet_polic;
            panel.querySelector("#sk-dvirka").value = vychozi.pocet_dvirek;

          panel.querySelector("#sk-ulozit").addEventListener("click", () => {
            const chyba = panel.querySelector("#sk-chyba");
            const sirka = cislo(panel.querySelector("#sk-sirka").value, 0);
            const vyska = cislo(panel.querySelector("#sk-vyska").value, 0);
            const hloubka = cislo(panel.querySelector("#sk-hloubka").value, 0);
            const meze = [

            panel.querySelectorAll(".pole").forEach((p) => p.classList.remove("chybne"));
            for (const [hodnota, min, max, nazev, idPole] of meze) {
              if (hodnota < min || hodnota > max) {
                chyba.className = "hlaska chyba";
                chyba.textContent = SimteGen.t("skrinka.mez", { nazev: SimteGen.t(nazev), min, max });
                panel.querySelector("#" + idPole).closest(".pole").classList.add("chybne");
                return;

            const nova = {
              typ: panel.querySelector("#sk-typ").value,

              sirka_mm: sirka, vyska_mm: vyska, hloubka_mm: hloubka,
              pocet_polic: Math.max(0, cislo(panel.querySelector("#sk-police").value, 0)),
              pocet_dvirek: Math.max(0, cislo(panel.querySelector("#sk-dvirka").value, 0)),
              pocet_zasuvek: Math.max(0, cislo(panel.querySelector("#sk-zasuvky").value, 0)),
              zasuvka_vyska_mm: cislo(panel.querySelector("#sk-celo").value, 140),
              zada_typ_prepis: panel.querySelector("#sk-zada").value,

                ? Number(panel.querySelector("#sk-material").value) : null,

            if (novy) stena.skrinky.push(nova);
            else stena.skrinky[poradi] = nova;
            zavriPanel();
            zmeneno();
            vykresliStenu({ index: stenaIndex });
            toast(SimteGen.t("skrinka.ulozena"));
          });

          const smazat = panel.querySelector("#sk-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              stena.skrinky.splice(poradi, 1);
              zavriPanel();
              zmeneno();
              vykresliStenu({ index: stenaIndex });
              toast(SimteGen.t("skrinka.smazana"));
