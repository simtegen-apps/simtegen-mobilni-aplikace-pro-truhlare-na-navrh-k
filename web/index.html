    }

    let navstevaZapocitana = false;
    function zapoctiNavstevu() {
      if (navstevaZapocitana) return;
      navstevaZapocitana = true;
      api("/api/navsteva", "POST", { stranka: "uvod" }).catch(() => {});
    }

    async function posliOdkaz() {
      const zprava = $("uvod-zprava");
      zprava.className = "hlaska";
      zprava.textContent = "Odesílám…";
      const { ok, data } = await api("/api/prihlaseni", "POST", { email: $("email").value })
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) {
        zprava.className = "hlaska chyba";
        zprava.textContent = data.chyba
          || "E-mail se nepodařilo odeslat, zkuste to prosím znovu.";
        return;
      }
      if (data.odkaz) {
        zprava.className = "hlaska";
        zprava.innerHTML = `<a href="${esc(data.odkaz)}">Vývojový režim — přihlásit tímto odkazem</a>`;
        return;
      }
      zprava.className = "hlaska uspech";
      zprava.textContent = "Přihlašovací odkaz najdete v e-mailu.";
    }

    // ── Obrazovka: zakázky ─────────────────────────────────────────────
    async function vykresliZakazky() {
      const cil = $("o-zakazky");
      if (nutnePrihlaseni(cil)) return;
      nastavListu([{ popisek: "Nová zakázka", akce: panelNovaZakazka }]);
      if (stav.zakazky === null) {
        cil.innerHTML = `${sekce("01", "Zakázky")}<div class="seznam">
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>
          <div class="kostra kostra-radek"></div></div>`;
        const { ok, data } = await api("/api/zakazky").catch(() => ({ ok: false, data: {} }));
        stav.zakazkyChyba = !ok;
        stav.zakazky = ok ? (data.zakazky || []) : [];
        if (aktualni.nazev !== "zakazky") return;
      }

      if (stav.zakazkyChyba) {
        cil.innerHTML = `${sekce("01", "Zakázky")}
          <div class="hlaska chyba">Zakázky se nepodařilo načíst.</div>`;
        const znovu = document.createElement("button");
        znovu.type = "button";
        znovu.className = "tlacitko vedlejsi";
        znovu.textContent = "Zkusit znovu";
        znovu.addEventListener("click", () => { stav.zakazky = null; vykresliZakazky(); });
        cil.appendChild(znovu);
        return;
      }

      if (!stav.zakazky.length) {
        cil.innerHTML = `${sekce("01", "Zakázky")}
          <div class="prazdno">${ikona("metr")}
          <p>Zatím tu není žádná zakázka. Začněte změřením stěny u zákazníka —
          rozměry skříněk jsou předvyplněné.</p></div>`;
        const zacit = document.createElement("button");
        zacit.type = "button";
        zacit.className = "tlacitko";
        zacit.textContent = "Nová zakázka";
        zacit.addEventListener("click", panelNovaZakazka);
        cil.querySelector(".prazdno").appendChild(zacit);
        return;
      }

      const vse = stav.zakazky;
      const videt = stav.vseZakazky ? vse : vse.slice(0, 5);
      const dilu = vse.reduce((s, z) => s + (z.pocet_dilu || 0), 0);
      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">Zakázek v účtu</p>
          <div class="cislo-radek"><span class="cislo-obri">${vse.length}</span>
            <p>${dilu ? dilu + " dílů celkem<br>v posledních kusovnících" : "zatím bez kusovníku"}</p></div>
        </div>
        ${sekce("01", "Zakázky", vse.length > 5
          ? { klic: "vse", popisek: stav.vseZakazky ? "Jen poslední" : "Vše" } : null)}
        <ul class="seznam" id="seznam-zakazek"></ul>`;
      const seznam = $("seznam-zakazek");
      videt.forEach((z, i) => {
        seznam.appendChild(radekTlacitko(
          `<span class="poradi">${String(i + 1).padStart(2, "0")}</span>
           <span class="hlavni"><strong>${esc(z.nazev)}</strong>
           <span>${esc(z.oznaceni_zakaznika || "bez označení")} · ${datum(z.zmeneno)}</span></span>
           <span class="vpravo">${z.pocet_dilu ? z.pocet_dilu + " dílů" : "—"}</span>`,
          () => jdi("zakazka", { id: z.id })));
      });
      napojSekce(cil, { vse: () => { stav.vseZakazky = !stav.vseZakazky; vykresliZakazky(); } });
    }

    function panelNovaZakazka() {
      otevriPanel("Nová zakázka", `
        <div class="pole">
          <label for="nz-nazev">Název zakázky</label>
          <input id="nz-nazev" type="text" placeholder="Kuchyň Novákovi" enterkeyhint="done">
          <span class="napoveda">Podle čeho ji poznáte v seznamu.</span>
        </div>
        <div class="pole">
          <label for="nz-zakaznik">Označení zákazníka (nepovinné)</label>
          <input id="nz-zakaznik" type="text" placeholder="Novák, Brno">
          <span class="napoveda">Pište jen to, co opravdu potřebujete — jsou to údaje
          vašeho zákazníka.</span>
        </div>
        <div id="nz-zprava" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="nz-ulozit">Založit zakázku</button>
        </div>`,
        (panel) => {
          panel.querySelector("#nz-ulozit").addEventListener("click", async () => {
            const zprava = panel.querySelector("#nz-zprava");
            zprava.className = "hlaska";
            zprava.textContent = "Zakládám…";
            const { ok, data } = await api("/api/zakazky", "POST", {
              nazev: panel.querySelector("#nz-nazev").value,
              oznaceni_zakaznika: panel.querySelector("#nz-zakaznik").value,
            }).catch(() => ({ ok: false, data: {} }));
            if (!ok) {
              zprava.className = "hlaska chyba";
              zprava.textContent = data.chyba || "Zakázku se nepodařilo založit.";
              return;
            }
            zavriPanel();
            stav.zakazky = null;
            toast("Zakázka založena.");
            jdi("zakazka", { id: data.id });
          });
        });
    }

    // ── Obrazovka: zakázka ─────────────────────────────────────────────
    async function vykresliZakazku(parametry) {
      const cil = $("o-zakazka");
      if (nutnePrihlaseni(cil)) return;
      const id = Number(parametry.id);
      if (!stav.dokument || stav.dokument.zakazka.id !== id) {
        cil.innerHTML = `<div class="kostra kostra-karta"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        const { ok, data } = await api(`/api/zakazky/${id}`).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          cil.innerHTML = `<div class="hlaska chyba">${esc(data.chyba
            || "Zakázku se nepodařilo načíst.")}</div>`;
          nastavListu([{ popisek: "Zpět na zakázky", vedlejsi: true, akce: () => jdi("zakazky") }]);
          return;
        }
        stav.dokument = data;
        stav.kusovnik = null;
        stav.ukladani = "cisto";
        const koncept = nactiKoncept(id);
        if (koncept && koncept.cas > (data.zakazka.zmeneno || 0)) {
          stav.dokument = koncept.dokument;
          toast("Obnovili jsme neuložené měření z telefonu.");
          zmeneno();
        }
        if (aktualni.nazev !== "zakazka") return;
      }
      if (!stav.standard) await nactiStandard();

      const dokument = stav.dokument;
      $("titulek").textContent = dokument.zakazka.nazev;
      const skrinek = (dokument.steny || []).reduce((s, x) => s + (x.skrinky || []).length, 0);
      const posledni = dokument.posledni_kusovnik;
      const platny = posledni && posledni.vytvoreno >= (dokument.zakazka.zmeneno || 0);

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">${platny ? "Dílů v kusovníku" : "Skříněk v zakázce"}</p>
          <div class="cislo-radek">
            <span class="cislo-obri">${platny ? posledni.pocet_dilu : skrinek}</span>
            <p>${esc(dokument.zakazka.oznaceni_zakaznika || "bez označení zákazníka")}<br>
            ${platny ? "odhad " + posledni.odhad_desek + " desek · " + datum(posledni.vytvoreno)
              : (dokument.steny || []).length + "× stěna"}</p>
          </div>
          ${posledni && !platny ? `<p class="hlaska varovani">Zakázka se od posledního
            kusovníku změnila — přepočítejte ho.</p>` : ""}
          <p data-ulozeni class="rozmer">Uloženo</p>
        </div>
        ${sekce("01", "Stěny", { klic: "stena", popisek: "Přidat" })}
        <div id="seznam-sten"></div>
        ${sekce("02", "Zakázka")}
        <ul class="seznam" id="akce-zakazky"></ul>`;

      const seznamSten = $("seznam-sten");
      if (!(dokument.steny || []).length) {
        seznamSten.innerHTML = `<div class="prazdno">${ikona("metr")}
          <p>Zakázka je prázdná — přidejte první stěnu.</p></div>`;
        const start = document.createElement("button");
        start.type = "button";
        start.className = "tlacitko vedlejsi";
        start.textContent = "Přidat stěnu";
        start.addEventListener("click", pridejStenu);
        seznamSten.querySelector(".prazdno").appendChild(start);
      } else {
        const seznam = document.createElement("ul");
        seznam.className = "seznam";
        dokument.steny.forEach((stena, index) => {
          const { hlasky } = kontrolaSteny(stena);
          seznam.appendChild(radekTlacitko(
            `<span class="poradi">${String(index + 1).padStart(2, "0")}</span>
             <span class="hlavni"><strong>${esc(stena.nazev)}</strong>
             <span>${stena.delka_mm} × ${stena.vyska_mm} mm ·
             ${(stena.skrinky || []).length}× skříňka</span></span>
             <span class="vpravo">${hlasky.length ? hlasky.length + " ⚠" : "›"}</span>`,
            () => jdi("stena", { index })));
        });
        seznamSten.appendChild(seznam);
      }

      const akce = $("akce-zakazky");
      pridejAkci(akce, "Náhled a kontrola", "pohled, půdorys a varování", () => jdi("nahled"));
      pridejAkci(akce, "Kopírovat jako šablonu", "nová zakázka se stejnými stěnami", kopirujZakazku);
      pridejAkci(akce, "Upravit název a poznámku", "", panelUpravZakazku);
      pridejAkci(akce, "Smazat zakázku", "nevratné", smazZakazku);

      napojSekce(cil, { stena: pridejStenu });
      prekresliStavUlozeni();
      nastavListu([
        { popisek: "Vygenerovat kusovník", akce: vygenerujKusovnik, zakazane: skrinek === 0 },
      ]);
    }

    function pridejAkci(seznam, nazev, popis, akce) {
      seznam.appendChild(radekTlacitko(
        `<span class="hlavni"><strong>${esc(nazev)}</strong>${
          popis ? `<span>${esc(popis)}</span>` : ""}</span><span class="vpravo">›</span>`,
        akce));
    }

    function pridejStenu() {
      const poradi = (stav.dokument.steny || []).length;
      stav.dokument.steny.push({
        nazev: `Stěna ${String.fromCharCode(65 + poradi)}`,
        delka_mm: 3600, vyska_mm: 2600, roh_vlevo: 0, roh_vpravo: 0,
        otvory: [], skrinky: [],
      });
      zmeneno();
      jdi("stena", { index: poradi });
    }

    function panelUpravZakazku() {
      const z = stav.dokument.zakazka;
      otevriPanel("Zakázka", `
        <div class="pole"><label for="uz-nazev">Název</label>
          <input id="uz-nazev" type="text" value="${esc(z.nazev)}"></div>
        <div class="pole"><label for="uz-zakaznik">Označení zákazníka</label>
          <input id="uz-zakaznik" type="text" value="${esc(z.oznaceni_zakaznika || "")}"></div>
        <div class="pole"><label for="uz-poznamka">Poznámka</label>
          <textarea id="uz-poznamka" rows="3" maxlength="1000">${esc(z.poznamka || "")}</textarea></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="uz-ulozit">Uložit</button>
        </div>`,
        (panel) => {
          panel.querySelector("#uz-ulozit").addEventListener("click", () => {
            z.nazev = panel.querySelector("#uz-nazev").value.trim() || z.nazev;
            z.oznaceni_zakaznika = panel.querySelector("#uz-zakaznik").value.trim();
            z.poznamka = panel.querySelector("#uz-poznamka").value.trim();
            zavriPanel();
            zmeneno();
            stav.zakazky = null;
            vykresliZakazku({ id: z.id });
            toast("Uloženo.");
          });
        });
    }

    async function kopirujZakazku() {
      const id = stav.dokument.zakazka.id;
      toast("Kopíruji…");
      const { ok, data } = await api(`/api/zakazky/${id}/kopie`, "POST", {})
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(data.chyba || "Kopii se nepodařilo vytvořit."); return; }
      stav.zakazky = null;
      stav.dokument = null;
      toast("Kopie je hotová.");
      jdi("zakazka", { id: data.id });
    }

    async function smazZakazku() {
      const z = stav.dokument.zakazka;
      if (!confirm(`Opravdu smazat zakázku „${z.nazev}“ včetně stěn a kusovníků? `
        + "Krok je nevratný.")) return;
      const { ok, data } = await api(`/api/zakazky/${z.id}`, "DELETE")
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(data.chyba || "Smazání se nepovedlo."); return; }
      zahodKoncept();
      stav.dokument = null;
      stav.zakazky = null;
      toast("Zakázka smazána.");
      jdi("zakazky", {}, true);
    }

    // ── Obrazovka: stěna ───────────────────────────────────────────────
    function vykresliStenu(parametry) {
      const cil = $("o-stena");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }
      const index = cislo(parametry.index, stav.stenaIndex);
      const stena = (stav.dokument.steny || [])[index];
      if (!stena) { jdi("zakazka", { id: stav.dokument.zakazka.id }, true); return; }
      stav.stenaIndex = index;
      $("titulek").textContent = stena.nazev;

      const { kolizni, hlasky } = kontrolaSteny(stena);

      cil.innerHTML = `
        <div class="karta vykres">
          ${nakresliPohled(stena, stav.standard, kolizni)}
          ${legenda()}
        </div>
        ${hlasky.length ? `<div class="hlaska varovani">${hlasky.map(esc).join("<br>")}</div>` : ""}
        ${sekce("01", "Rozměry stěny")}
        <div class="dvojice-poli">
          <div class="pole"><label for="st-delka">Délka (mm)</label>
            <input id="st-delka" type="number" inputmode="numeric" min="200" max="20000"
                   value="${cislo(stena.delka_mm, 3600)}"></div>
          <div class="pole"><label for="st-vyska">Výška (mm)</label>
            <input id="st-vyska" type="number" inputmode="numeric" min="500" max="5000"
                   value="${cislo(stena.vyska_mm, 2600)}"></div>
        </div>
        <div class="pole"><label for="st-nazev">Název stěny</label>
          <input id="st-nazev" type="text" value="${esc(stena.nazev)}"></div>
        <label class="volba"><input type="checkbox" id="st-roh-vlevo"
          ${stena.roh_vlevo ? "checked" : ""}> Roh vlevo (sousední stěna ubírá hloubku korpusu)</label>
        <label class="volba"><input type="checkbox" id="st-roh-vpravo"
          ${stena.roh_vpravo ? "checked" : ""}> Roh vpravo</label>
        ${sekce("02", "Okna a dveře", { klic: "otvor", popisek: "Přidat" })}
        <div id="seznam-otvoru"></div>
        ${sekce("03", "Skříňky")}
        <div id="seznam-skrinek"></div>
        <p data-ulozeni class="rozmer">Uloženo</p>
        <ul class="seznam" id="akce-steny"></ul>`;

      const napoj = (id, klic, jeCislo) => {
        const prvek = $(id);
        prvek.addEventListener("change", () => {
          stena[klic] = jeCislo ? cislo(prvek.value, stena[klic])
            : (prvek.type === "checkbox" ? (prvek.checked ? 1 : 0) : prvek.value.trim());
          zmeneno();
          vykresliStenu({ index });
        });
      };
      napoj("st-delka", "delka_mm", true);
      napoj("st-vyska", "vyska_mm", true);
      napoj("st-nazev", "nazev", false);
      napoj("st-roh-vlevo", "roh_vlevo", false);
      napoj("st-roh-vpravo", "roh_vpravo", false);

      const otvory = $("seznam-otvoru");
      if (!(stena.otvory || []).length) {
        otvory.innerHTML = `<p class="popisek">Žádné okno ani dveře. Přidejte je, ať vidíte,
          kam skříňka nesmí.</p>`;
      } else {
        const seznam = document.createElement("ul");
        seznam.className = "seznam";
        stena.otvory.forEach((o, i) => {
          seznam.appendChild(radekTlacitko(
            `<span class="hlavni">
             <strong>${o.typ === "dvere" ? "Dveře" : "Okno"} ${o.sirka_mm} × ${o.vyska_mm} mm</strong>
             <span>od ${o.odsazeni_mm} mm${o.typ === "dvere" ? "" : " · parapet " + o.parapet_mm + " mm"}</span>
             </span><span class="vpravo">›</span>`,
            () => panelOtvor(stena, i, index)));
        });
        otvory.appendChild(seznam);
      }

      const skrinky = $("seznam-skrinek");
      if (!(stena.skrinky || []).length) {
        skrinky.innerHTML = `<div class="prazdno">${ikona("skrinka")}
          <p>Zatím žádná skříňka. Přidejte první — rozměry jsou předvyplněné.</p></div>`;
      } else {
        const seznam = document.createElement("ul");
        seznam.className = "seznam";
        stena.skrinky.forEach((sk, i) => {
          seznam.appendChild(radekTlacitko(
            `<span class="poradi">${String(i + 1).padStart(2, "0")}</span>
             ${ikona("skrinka")}<span class="hlavni">
             <strong>${esc(TYPY_SKRINEK[sk.typ] || "Skříňka")}
               ${sk.sirka_mm} × ${sk.vyska_mm} × ${sk.hloubka_mm}</strong>
             <span>od ${cislo(sk.odsazeni_mm, 0)} mm · ${sk.pocet_polic}× police ·
               ${sk.pocet_dvirek}× dvířka${sk.pocet_zasuvek ? " · " + sk.pocet_zasuvek + "× zásuvka" : ""}</span>
             </span><span class="vpravo">${kolizni.has(i) ? "⚠" : "›"}</span>`,
            () => panelSkrinka(stena, i, index)));
        });
        skrinky.appendChild(seznam);
      }

      pridejAkci($("akce-steny"), "Náhled a kontrola", "", () => jdi("nahled"));
      pridejAkci($("akce-steny"), "Smazat stěnu", "i se skříňkami na ní", () => {
        if (!confirm(`Opravdu smazat ${stena.nazev} i se skříňkami?`)) return;
        stav.dokument.steny.splice(index, 1);
        zmeneno();
        toast("Stěna smazána.");
        jdi("zakazka", { id: stav.dokument.zakazka.id }, true);
      });

      napojSekce(cil, { otvor: () => panelOtvor(stena, -1, index) });
      prekresliStavUlozeni();
      nastavListu([{ popisek: "Přidat skříňku", akce: () => panelSkrinka(stena, -1, index) }]);
    }

    function panelOtvor(stena, poradi, stenaIndex) {
      const novy = poradi < 0;
      const o = novy
        ? { typ: "okno", odsazeni_mm: 1200, sirka_mm: 1200, vyska_mm: 1400, parapet_mm: 900 }
        : { ...stena.otvory[poradi] };
      otevriPanel(novy ? "Nové okno nebo dveře" : "Okno nebo dveře", `
        <div class="pole"><label for="ot-typ">Typ</label>
          <select id="ot-typ">
            <option value="okno"${o.typ === "okno" ? " selected" : ""}>Okno</option>
            <option value="dvere"${o.typ === "dvere" ? " selected" : ""}>Dveře</option>
          </select></div>
        <div class="trojice">
          <div class="pole"><label for="ot-odsazeni">Od kraje</label>
            <input id="ot-odsazeni" type="number" inputmode="numeric" value="${o.odsazeni_mm}"></div>
          <div class="pole"><label for="ot-sirka">Šířka</label>
            <input id="ot-sirka" type="number" inputmode="numeric" value="${o.sirka_mm}"></div>
          <div class="pole"><label for="ot-vyska">Výška</label>
            <input id="ot-vyska" type="number" inputmode="numeric" value="${o.vyska_mm}"></div>
        </div>
        <div class="pole"><label for="ot-parapet">Parapet nad podlahou (mm)</label>
          <input id="ot-parapet" type="number" inputmode="numeric" value="${o.parapet_mm}">
          <span class="napoveda">U dveří se parapet nepoužije.</span></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="ot-ulozit">Uložit</button>
          ${novy ? "" : `<button type="button" class="tlacitko varovne" id="ot-smazat">Smazat</button>`}
        </div>`,
        (panel) => {
          panel.querySelector("#ot-ulozit").addEventListener("click", () => {
            const novyOtvor = {
              typ: panel.querySelector("#ot-typ").value,
              odsazeni_mm: cislo(panel.querySelector("#ot-odsazeni").value, 0),
              sirka_mm: cislo(panel.querySelector("#ot-sirka").value, 1000),
              vyska_mm: cislo(panel.querySelector("#ot-vyska").value, 1400),
              parapet_mm: cislo(panel.querySelector("#ot-parapet").value, 900),
            };
            if (novy) stena.otvory.push(novyOtvor);
            else stena.otvory[poradi] = novyOtvor;
            zavriPanel();
            zmeneno();
            vykresliStenu({ index: stenaIndex });
            toast("Uloženo.");
          });
          const smazat = panel.querySelector("#ot-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              stena.otvory.splice(poradi, 1);
              zavriPanel();
              zmeneno();
              vykresliStenu({ index: stenaIndex });
              toast("Smazáno.");
            });
          }
        });
    }

    function panelSkrinka(stena, poradi, stenaIndex) {
      const novy = poradi < 0;
      const predchozi = (stena.skrinky || [])[(stena.skrinky || []).length - 1];
      const sk = novy
        ? {
            typ: "spodni",
            odsazeni_mm: predchozi
              ? cislo(predchozi.odsazeni_mm, 0) + cislo(predchozi.sirka_mm, 600) : 0,
            ...VYCHOZI_ROZMERY.spodni,
            pocet_zasuvek: 0, zasuvka_vyska_mm: 140, zada_typ_prepis: "",
            material_id: null, poznamka: "",
          }
        : { ...stena.skrinky[poradi] };

      const volbyMaterialu = [`<option value="">Výchozí (LTD ${
        stav.standard ? stav.standard.tloustka_mm : 18} mm)</option>`]
        .concat(stav.materialy.map((m) =>
          `<option value="${m.id}"${Number(sk.material_id) === m.id ? " selected" : ""}>`
          + `${esc(m.nazev)}</option>`)).join("");

      otevriPanel(novy ? "Nová skříňka" : "Skříňka", `
        <div class="trojice">
          <div class="pole"><label for="sk-sirka">Šířka</label>
            <input id="sk-sirka" type="number" inputmode="numeric" min="100" max="1400"
                   value="${cislo(sk.sirka_mm, 600)}"></div>
          <div class="pole"><label for="sk-vyska">Výška</label>
            <input id="sk-vyska" type="number" inputmode="numeric" min="100" max="2600"
                   value="${cislo(sk.vyska_mm, 720)}"></div>
          <div class="pole"><label for="sk-hloubka">Hloubka</label>
            <input id="sk-hloubka" type="number" inputmode="numeric" min="100" max="900"
                   value="${cislo(sk.hloubka_mm, 510)}"></div>
        </div>
        <p class="popisek">Rozměry korpusu v mm, hloubka bez dvířek.</p>
        <div class="pole"><label for="sk-typ">Typ</label>
          <select id="sk-typ">${Object.keys(TYPY_SKRINEK).map((t) =>
            `<option value="${t}"${sk.typ === t ? " selected" : ""}>${TYPY_SKRINEK[t]}</option>`).join("")}
          </select></div>
        <div class="pole"><label for="sk-odsazeni">Odsazení od levého kraje stěny (mm)</label>
          <input id="sk-odsazeni" type="number" inputmode="numeric" value="${cislo(sk.odsazeni_mm, 0)}"></div>
        <div class="trojice">
          <div class="pole"><label for="sk-police">Police</label>
            <input id="sk-police" type="number" inputmode="numeric" min="0" max="12"
                   value="${cislo(sk.pocet_polic, 0)}"></div>
          <div class="pole"><label for="sk-dvirka">Dvířka</label>
            <input id="sk-dvirka" type="number" inputmode="numeric" min="0" max="4"
                   value="${cislo(sk.pocet_dvirek, 0)}"></div>
          <div class="pole"><label for="sk-zasuvky">Zásuvky</label>
            <input id="sk-zasuvky" type="number" inputmode="numeric" min="0" max="8"
                   value="${cislo(sk.pocet_zasuvek, 0)}"></div>
        </div>
        <div class="pole"><label for="sk-celo">Výška čela zásuvky (mm)</label>
          <input id="sk-celo" type="number" inputmode="numeric" min="50" max="600"
                 value="${cislo(sk.zasuvka_vyska_mm, 140)}">
          <span class="napoveda">Použije se, když má skříňka zásuvky i dvířka —
          zásuvky sedí nahoře, dvířka doberou zbytek.</span></div>
        <div class="pole"><label for="sk-material">Materiál</label>
          <select id="sk-material">${volbyMaterialu}</select></div>
        <div class="pole"><label for="sk-zada">Záda</label>
          <select id="sk-zada">
            <option value=""${!sk.zada_typ_prepis ? " selected" : ""}>Podle standardu</option>
            <option value="drazka"${sk.zada_typ_prepis === "drazka" ? " selected" : ""}>Do drážky</option>
            <option value="nasazena"${sk.zada_typ_prepis === "nasazena" ? " selected" : ""}>Nasazená</option>
          </select></div>
        <div id="sk-chyba" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="sk-ulozit">Uložit skříňku</button>
          ${novy ? "" : `<button type="button" class="tlacitko varovne" id="sk-smazat">Smazat skříňku</button>`}
        </div>`,
        (panel) => {
          panel.querySelector("#sk-typ").addEventListener("change", (u) => {
            const vychozi = VYCHOZI_ROZMERY[u.target.value];
            if (!vychozi) return;
            panel.querySelector("#sk-sirka").value = vychozi.sirka_mm;
            panel.querySelector("#sk-vyska").value = vychozi.vyska_mm;
            panel.querySelector("#sk-hloubka").value = vychozi.hloubka_mm;
            panel.querySelector("#sk-police").value = vychozi.pocet_polic;
            panel.querySelector("#sk-dvirka").value = vychozi.pocet_dvirek;
          });

          panel.querySelector("#sk-ulozit").addEventListener("click", () => {
            const chyba = panel.querySelector("#sk-chyba");
            const sirka = cislo(panel.querySelector("#sk-sirka").value, 0);
            const vyska = cislo(panel.querySelector("#sk-vyska").value, 0);
            const hloubka = cislo(panel.querySelector("#sk-hloubka").value, 0);
            const meze = [
              [sirka, 100, 1400, "Šířka", "sk-sirka"],
              [vyska, 100, 2600, "Výška", "sk-vyska"],
              [hloubka, 100, 900, "Hloubka", "sk-hloubka"],
            ];
            panel.querySelectorAll(".pole").forEach((p) => p.classList.remove("chybne"));
            for (const [hodnota, min, max, nazev, idPole] of meze) {
              if (hodnota < min || hodnota > max) {
                chyba.className = "hlaska chyba";
                chyba.textContent = `${nazev} musí být ${min}–${max} mm.`;
                panel.querySelector("#" + idPole).closest(".pole").classList.add("chybne");
                return;
              }
            }
            const nova = {
              typ: panel.querySelector("#sk-typ").value,
              odsazeni_mm: Math.max(0, cislo(panel.querySelector("#sk-odsazeni").value, 0)),
              sirka_mm: sirka, vyska_mm: vyska, hloubka_mm: hloubka,
              pocet_polic: Math.max(0, cislo(panel.querySelector("#sk-police").value, 0)),
              pocet_dvirek: Math.max(0, cislo(panel.querySelector("#sk-dvirka").value, 0)),
              pocet_zasuvek: Math.max(0, cislo(panel.querySelector("#sk-zasuvky").value, 0)),
              zasuvka_vyska_mm: cislo(panel.querySelector("#sk-celo").value, 140),
              zada_typ_prepis: panel.querySelector("#sk-zada").value,
              material_id: panel.querySelector("#sk-material").value
                ? Number(panel.querySelector("#sk-material").value) : null,
              poznamka: sk.poznamka || "",
            };
            if (novy) stena.skrinky.push(nova);
            else stena.skrinky[poradi] = nova;
            zavriPanel();
            zmeneno();
            vykresliStenu({ index: stenaIndex });
            toast("Skříňka uložena.");
          });

          const smazat = panel.querySelector("#sk-smazat");
          if (smazat) {
            smazat.addEventListener("click", () => {
              stena.skrinky.splice(poradi, 1);
              zavriPanel();
              zmeneno();
              vykresliStenu({ index: stenaIndex });
              toast("Skříňka smazána.");
            });
          }
        });
    }

    // ── Obrazovka: náhled ──────────────────────────────────────────────
    function vykresliNahled() {
      const cil = $("o-nahled");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }
      const steny = stav.dokument.steny || [];
      if (!steny.length) {
        cil.innerHTML = `<div class="prazdno">${ikona("oko")}
          <p>Přidejte stěnu, ať je co ukázat.</p></div>`;
        nastavListu([{ popisek: "Zpět na zakázku", vedlejsi: true,
          akce: () => jdi("zakazka", { id: stav.dokument.zakazka.id }, true) }]);
        return;
      }

      const vsechnyHlasky = [];
      let kresba = "";
      const pudorys = stav.nahledRezim === "pudorys";
      if (pudorys) {
        kresba = `<div class="karta vykres">${nakresliPudorys(steny)}
          <p class="vykres-popis">Šrafovaně zeď · čárkovaně horní řada · silnou čarou čelo</p></div>`;
        for (const stena of steny) {
          for (const h of kontrolaSteny(stena).hlasky) vsechnyHlasky.push(h);
        }
      } else {
        const kusy = [];
        for (const stena of steny) {
          const { kolizni, hlasky } = kontrolaSteny(stena);
          for (const h of hlasky) vsechnyHlasky.push(h);
          kusy.push(`<div class="karta vykres"><p class="stitek">${esc(stena.nazev)}</p>
            ${nakresliPohled(stena, stav.standard, kolizni)}</div>`);
        }
        kresba = kusy.join("");
      }

      cil.innerHTML = `
        ${sekce("01", pudorys ? "Půdorys" : "Pohled na stěny",
          { klic: "prepni", popisek: pudorys ? "Pohled" : "Půdorys" })}
        ${kresba}
        ${legenda()}
        ${sekce("02", "Kontrola")}
        ${vsechnyHlasky.length
          ? `<div class="hlaska varovani">${vsechnyHlasky.map(esc).join("<br>")}</div>`
          : `<div class="hlaska uspech">Nic se nepřekrývá a nic nezasahuje do oken.</div>`}`;

      napojSekce(cil, {
        prepni: () => {
          stav.nahledRezim = pudorys ? "pohled" : "pudorys";
          vykresliNahled();
        },
      });
      nastavListu([{ popisek: "Vygenerovat kusovník", akce: vygenerujKusovnik }]);
    }

    // ── Obrazovka: kusovník ────────────────────────────────────────────
    async function vygenerujKusovnik() {
      if (!stav.dokument) return;
      if (stav.ukladani !== "cisto") await ulozNaServer();
      jdi("kusovnik", { pocitat: true });
    }

    async function vykresliKusovnik(parametry) {
      const cil = $("o-kusovnik");
      if (!stav.dokument) { jdi("zakazky", {}, true); return; }

      // Kusovník v paměti musí patřit k otevřené zakázce — jinak by se po
      // přepnutí zakázky ukázala cizí čísla.
      const cizi = stav.kusovnik && stav.kusovnik.zakazka.id !== stav.dokument.zakazka.id;
      if (parametry.pocitat || !stav.kusovnik || cizi) {
        cil.innerHTML = `<div class="kostra kostra-tabulka"></div>
          <div class="kostra kostra-radek"></div><div class="kostra kostra-radek"></div>
          <div class="kostra kostra-radek"></div>`;
        nastavListu([]);
        const { ok, data } = await api("/api/kusovnik", "POST",
          { zakazka_id: stav.dokument.zakazka.id }).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          if (data.chyba && data.chyba.indexOf("skříňku") > -1) {
            cil.innerHTML = `<div class="prazdno">${ikona("kusovnik")}
              <p>Nejdřív přidejte aspoň jednu skříňku.</p></div>`;
          } else {
            cil.innerHTML = `<div class="hlaska chyba">${esc(data.chyba
              || "Kusovník se nepodařilo spočítat.")}</div>`;
          }
          nastavListu([{ popisek: "Zpět na zakázku", vedlejsi: true,
            akce: () => jdi("zakazka", { id: stav.dokument.zakazka.id }, true) }]);
          return;
        }
        stav.kusovnik = data;
        stav.dokument.posledni_kusovnik = {
          id: data.id, pocet_dilu: data.souhrn.pocet_dilu,
          odhad_desek: data.souhrn.odhad_desek, vytvoreno: data.vytvoreno,
        };
        toast("Kusovník uložen do zakázky.");
        if (aktualni.nazev !== "kusovnik") return;
        // Ať se při návratu tlačítkem zpět/vpřed nepočítá (a neukládá) znovu.
        aktualni.parametry = {};
        history.replaceState({ obrazovka: "kusovnik", parametry: {} }, "", "#kusovnik");
      }

      const k = stav.kusovnik;
      const plocha = (k.souhrn.plocha_cm2 / 10000).toFixed(2).replace(".", ",");
      const podleMaterialu = new Map();
      for (const p of k.polozky) {
        const klic = `${p.material} · ${p.tloustka_mm} mm`;
        if (!podleMaterialu.has(klic)) podleMaterialu.set(klic, []);
        podleMaterialu.get(klic).push(p);
      }

      const skupiny = [...podleMaterialu.entries()].map(([nazev, polozky], i) => `
        ${sekce(String(i + 2).padStart(2, "0"), nazev)}
        <ul class="seznam jen-telefon">${polozky.map((p) => `
          <li class="radek"><span class="hlavni">
            <strong>${esc(p.nazev)} ${p.a_mm} × ${p.b_mm}</strong>
            <span>${esc(p.hrany_popis)}${p.vlakno ? " · vlákno po délce" : ""}</span>
          </span><span class="vpravo">${p.ks}×</span></li>`).join("")}</ul>
        <div class="tabulka-obal jen-siroke"><table class="tabulka">
          <thead><tr><th>Díl</th><th>Rozměr</th><th>Řez pro pilu</th><th>Olepení</th><th>Ks</th></tr></thead>
          <tbody>${polozky.map((p) => `<tr>
            <td>${esc(p.nazev)}</td>
            <td class="rozmer-bunka">${p.a_mm} × ${p.b_mm}</td>
            <td class="rozmer-bunka">${p.delka_mm} × ${p.sirka_mm}${p.vlakno ? " · vlákno" : ""}</td>
            <td><span class="kod">${esc(p.hrany_popis)}</span></td>
            <td>${p.ks}</td></tr>`).join("")}</tbody>
        </table></div>`).join("");

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">Dílů v kusovníku</p>
          <div class="cislo-radek"><span class="cislo-obri">${k.souhrn.pocet_dilu}</span>
            <p>odhad ${k.souhrn.odhad_desek} desek<br>${plocha} m² plochy</p></div>
          <p class="vykres-popis">${esc(k.zakazka.nazev)} · ${datum(k.vytvoreno)}</p>
        </div>
        ${sekce("01", "Jak číst rozměry")}
        <p class="popisek">${k.standard.rozmer_s_olepenim
          ? "Uvedené rozměry jsou hotové díly po olepení."
          : "Uvedené rozměry jsou řez bez olepení."}
          U dílu je šířka × výška, jak leží ve skříňce; v CSV je délka po vlákně.</p>
        <p class="hlaska varovani">Rozměry před odesláním do nářezového centra zkontrolujte.</p>
        ${(k.varovani || []).length
          ? `<div class="hlaska varovani">${k.varovani.map(esc).join("<br>")}</div>` : ""}
        ${skupiny}
        <p class="popisek">Odhad desek je orientační — nářezové centrum si nářez
        optimalizuje samo a většinou vyjde líp.</p>`;

      nastavListu([
        { popisek: "Stáhnout CSV", akce: () => stahniCsv(k.id) },
        { popisek: "Hotovo", vedlejsi: true, akce: oznacHotovou },
      ]);
    }

    async function stahniCsv(id) {
      toast("Připravuji soubor…");
      const odpoved = await fetch(`/api/kusovnik/${id}/csv`).catch(() => null);
      if (!odpoved || !odpoved.ok) { toast("Soubor se nepodařilo stáhnout."); return; }
      const blob = await odpoved.blob();
      const adresa = URL.createObjectURL(blob);
      const odkaz = document.createElement("a");
      odkaz.href = adresa;
      odkaz.download = `kusovnik-${id}.csv`;
      document.body.appendChild(odkaz);
      odkaz.click();
      odkaz.remove();
      setTimeout(() => URL.revokeObjectURL(adresa), 10000);
      toast("Soubor je stažený.");
    }

    async function oznacHotovou() {
      if (!stav.dokument) return;
      stav.dokument.zakazka.stav = "hotova";
      await ulozNaServer();
      stav.zakazky = null;
      toast("Zakázka je označená jako hotová.");
      jdi("zakazka", { id: stav.dokument.zakazka.id }, true);
    }

    // ── Obrazovka: standard ────────────────────────────────────────────
    async function nactiStandard() {
      const { ok, data } = await api("/api/standard").catch(() => ({ ok: false, data: {} }));
      if (ok) {
        stav.standard = data.standard;
        stav.ukazka = data.ukazka || [];
      }
      const m = await api("/api/materialy").catch(() => ({ ok: false, data: {} }));
      if (m.ok) stav.materialy = m.data.materialy || [];
      return ok;
    }

    const POLE_STANDARDU = [
      ["01", "Korpus", [
        ["tloustka_mm", "Tloušťka desky (mm)", "Z ní se počítá světlost korpusu."],
        ["zada_tloustka_mm", "Tloušťka zad (mm)", "Typicky 3 mm HDF."],
        ["drazka_hloubka_mm", "Hloubka drážky na záda (mm)", "Platí, když jsou záda v drážce."],
        ["drazka_odsazeni_mm", "Odsazení drážky od zadní hrany (mm)", ""],
        ["odskok_police_mm", "Odskok police od hloubky (mm)", "O kolik je police mělčí než korpus."],
        ["traverza_sirka_mm", "Šířka traverzy (mm)", "Když má spodní skříňka místo víka traverzy."],
      ]],
      ["02", "Čela a hrany", [
        ["spara_okraj_desetiny", "Spára po obvodu čel (desetiny mm)", "15 = 1,5 mm."],
        ["spara_mezi_desetiny", "Spára mezi čely (desetiny mm)", "30 = 3 mm."],
        ["hrana_pohledova_desetiny", "Pohledová hrana (desetiny mm)",
          "Dvířka, čela zásuvek a přední hrana boku. 20 = 2 mm ABS."],
        ["hrana_ostatni_desetiny", "Ostatní hrana (desetiny mm)",
          "Přední hrana dna, víka a polic. 8 = 0,8 mm ABS."],
      ]],
      ["03", "Deska, prořez a kresba", [
        ["prorez_mm", "Prořez pily (mm)", "Vstupuje jen do odhadu počtu desek."],
        ["deska_x_mm", "Formát desky — délka (mm)", ""],
        ["deska_y_mm", "Formát desky — šířka (mm)", ""],
        ["sokl_mm", "Výška soklu (mm)", "Kvůli výkresu a kontrole kolizí."],
        ["vyska_horni_mm", "Spodní hrana horních skříněk (mm)", "Kvůli výkresu a kontrole kolizí."],
      ]],
    ];
    const VSECHNA_POLE = POLE_STANDARDU.flatMap(([, , pole]) => pole);

    async function vykresliStandard() {
      const cil = $("o-standard");
      if (nutnePrihlaseni(cil)) return;
      if (!stav.standard) {
        cil.innerHTML = `<div class="kostra kostra-tabulka"></div>
          <div class="kostra kostra-karta"></div>`;
        nastavListu([]);
        const ok = await nactiStandard();
        if (!ok) {
          cil.innerHTML = `<div class="hlaska chyba">Standard se nepodařilo načíst.</div>`;
          nastavListu([{ popisek: "Zkusit znovu", vedlejsi: true, akce: vykresliStandard }]);
          return;
        }
        if (aktualni.nazev !== "standard") return;
      }
      const s = stav.standard;

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">Tloušťka desky</p>
          <div class="cislo-radek"><span class="cislo-obri">${s.tloustka_mm}</span>
            <p>mm · ${esc(s.nazev)}<br>podle toho se počítá každý kusovník</p></div>
        </div>
        ${sekce("00", "Ukázka: skříňka 600 × 720 × 510")}
        <ul class="seznam" id="ukazka"></ul>
        <p class="popisek">Rozměry se přepočítají, jakmile parametr změníte.</p>
        <div class="pole"><label for="std-nazev">Název standardu</label>
          <input id="std-nazev" type="text" value="${esc(s.nazev)}"></div>
        <div class="pole"><label for="std-zada-typ">Záda</label>
          <select id="std-zada-typ">
            <option value="drazka"${s.zada_typ === "drazka" ? " selected" : ""}>Do drážky</option>
            <option value="nasazena"${s.zada_typ === "nasazena" ? " selected" : ""}>Nasazená</option>
          </select></div>
        <label class="volba"><input type="checkbox" id="std-traverzy"
          ${s.traverzy_spodni ? "checked" : ""}> Spodní skříňky mají místo víka traverzy</label>
        <label class="volba"><input type="checkbox" id="std-olepeni"
          ${s.rozmer_s_olepenim ? "checked" : ""}> Uvedený rozměr je hotový díl po olepení</label>
        <p class="popisek">Nezaškrtnuto = kusovník udává rozměr řezu a hranu si nářezové
        centrum přidá samo. Zaškrtnuto = řez je o tloušťku hrany zmenšený.</p>
        ${POLE_STANDARDU.map(([c, nazev]) => `${sekce(c, nazev)}
          <div class="dvojice-poli" data-skupina="${c}"></div>`).join("")}
        <div id="std-zprava" aria-live="polite"></div>
        ${sekce("04", "Materiály", { klic: "material", popisek: "Přidat" })}
        <div id="std-materialy"></div>`;

      for (const [c, , pole] of POLE_STANDARDU) {
        const misto = cil.querySelector(`[data-skupina="${c}"]`);
        for (const [klic, popisek, napoveda] of pole) {
          const obal = document.createElement("div");
          obal.className = "pole";
          obal.innerHTML = `<label for="std-${klic}">${esc(popisek)}</label>
            <input id="std-${klic}" type="number" inputmode="numeric" value="${cislo(s[klic], 0)}">
            ${napoveda ? `<span class="napoveda">${esc(napoveda)}</span>` : ""}`;
          misto.appendChild(obal);
        }
      }

      vykresliUkazku();
      cil.querySelectorAll("input, select").forEach((prvek) => {
        prvek.addEventListener("input", prepocitejUkazku);
        prvek.addEventListener("change", prepocitejUkazku);
      });

      vykresliMaterialy();
      napojSekce(cil, { material: panelMaterial });
      nastavListu([{ popisek: "Uložit standard", akce: ulozStandard }]);
    }

    function formularStandardu() {
      const s = { ...stav.standard };
      s.nazev = $("std-nazev").value.trim() || "Můj standard";
      s.zada_typ = $("std-zada-typ").value;
      s.traverzy_spodni = $("std-traverzy").checked ? 1 : 0;
      s.rozmer_s_olepenim = $("std-olepeni").checked ? 1 : 0;
      for (const [klic] of VSECHNA_POLE) s[klic] = cislo($("std-" + klic).value, s[klic]);
      return s;
    }

    let casovacUkazky = null;
    function prepocitejUkazku() {
      if (casovacUkazky) clearTimeout(casovacUkazky);
      casovacUkazky = setTimeout(async () => {
        const { ok, data } = await api("/api/standard/ukazka", "POST", formularStandardu())
          .catch(() => ({ ok: false, data: {} }));
        if (!ok) return;
        stav.ukazka = data.ukazka || [];
        vykresliUkazku();
      }, 400);
    }

    function vykresliUkazku() {
      const seznam = $("ukazka");
      if (!seznam) return;
      seznam.innerHTML = stav.ukazka.map((d) => `
        <li class="radek"><span class="poradi">${esc(d.ks)}×</span>
          <span class="hlavni"><strong>${esc(d.nazev)}</strong>
          <span>${esc(d.hrany)}</span></span>
          <span class="vpravo">${esc(d.rozmer)}</span></li>`).join("");
    }

    async function ulozStandard() {
      const zprava = $("std-zprava");
      zprava.className = "hlaska";
      zprava.textContent = "Ukládám…";
      const { ok, data } = await api("/api/standard", "PUT", formularStandardu())
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) {
        zprava.className = "hlaska chyba";
        zprava.textContent = data.chyba || "Standard se nepodařilo uložit.";
        return;
      }
      stav.standard = data.standard;
      stav.ukazka = data.ukazka || [];
      zprava.className = "hlaska uspech";
      zprava.textContent = "Standard uložen.";
      toast("Standard uložen.");
      vykresliUkazku();
    }

    function vykresliMaterialy() {
      const misto = $("std-materialy");
      if (!misto) return;
      if (!stav.materialy.length) {
        misto.innerHTML = `<p class="popisek">Zatím žádný vlastní materiál — díly se počítají
          na výchozí LTD ${stav.standard.tloustka_mm} mm.</p>`;
        return;
      }
      misto.innerHTML = `<ul class="seznam">${stav.materialy.map((m) => `
        <li class="radek"><span class="hlavni"><strong>${esc(m.nazev)}</strong>
          <span>${m.tloustka_mm} mm${m.dekor_kod ? " · " + esc(m.dekor_kod) : ""}${
            m.vlakno ? " · má vlákno" : ""}</span></span>
        <button type="button" class="tlacitko vedlejsi" data-smazat="${m.id}">Smazat</button>
        </li>`).join("")}</ul>`;
      misto.querySelectorAll("[data-smazat]").forEach((b) =>
        b.addEventListener("click", async () => {
          const { ok } = await api(`/api/materialy?id=${b.dataset.smazat}`, "DELETE")
            .catch(() => ({ ok: false }));
          if (!ok) { toast("Materiál se nepodařilo smazat."); return; }
          stav.materialy = stav.materialy.filter((m) => String(m.id) !== b.dataset.smazat);
          vykresliMaterialy();
          toast("Materiál smazán.");
        }));
    }

    function panelMaterial() {
      otevriPanel("Nový materiál", `
        <div class="pole"><label for="mt-nazev">Název</label>
          <input id="mt-nazev" type="text" placeholder="LTD 18 mm dub Sonoma"></div>
        <div class="dvojice-poli">
          <div class="pole"><label for="mt-kod">Kód dekoru</label>
            <input id="mt-kod" type="text" placeholder="H1145"></div>
          <div class="pole"><label for="mt-tloustka">Tloušťka (mm)</label>
            <input id="mt-tloustka" type="number" inputmode="numeric" value="18"></div>
        </div>
        <label class="volba"><input type="checkbox" id="mt-vlakno">
          Dekor má směr vlákna — díly se neotáčí a v kusovníku je délka po vlákně</label>
        <div id="mt-zprava" aria-live="polite"></div>
        <div class="panel-akce">
          <button type="button" class="tlacitko" id="mt-ulozit">Přidat materiál</button>
        </div>`,
        (panel) => {
          panel.querySelector("#mt-ulozit").addEventListener("click", async () => {
            const zprava = panel.querySelector("#mt-zprava");
            zprava.className = "hlaska";
            zprava.textContent = "Ukládám…";
            const { ok, data } = await api("/api/materialy", "POST", {
              nazev: panel.querySelector("#mt-nazev").value,
              dekor_kod: panel.querySelector("#mt-kod").value,
              tloustka_mm: panel.querySelector("#mt-tloustka").value,
              vlakno: panel.querySelector("#mt-vlakno").checked,
            }).catch(() => ({ ok: false, data: {} }));
            if (!ok) {
              zprava.className = "hlaska chyba";
              zprava.textContent = data.chyba || "Materiál se nepodařilo přidat.";
              return;
            }
            zavriPanel();
            const m = await api("/api/materialy").catch(() => ({ ok: false, data: {} }));
            if (m.ok) stav.materialy = m.data.materialy || [];
            vykresliMaterialy();
            toast("Materiál přidán.");
          });
        });
    }

    // ── Obrazovka: účet ────────────────────────────────────────────────
    const STAVY_HLASENI = { nove: "přijato", vyrizuje_se: "řešíme",
      vyrizeno: "vyřízeno", odlozeno: "odloženo" };

    function vykresliUcet() {
      const cil = $("o-ucet");
      if (nutnePrihlaseni(cil)) return;
      const ja = stav.ja || {};
      const p = ja.predplatne;
      const dni = p ? p.dni_zbyva : 0;
      const popisStavu = !p ? ""
        : p.stav === "aktivni" ? `předplatné do ${datum(p.plati_do)}`
        : p.stav === "zkusebni" ? `zkušebního období do ${datum(p.plati_do)}`
        : "předplatné vypršelo";

      const objednavka = p && (p.stav === "vyprselo"
        || (p.stav === "zkusebni" && p.dni_zbyva <= 7));

      cil.innerHTML = `
        <div class="karta vykres">
          <p class="stitek">Dní zbývá</p>
          <div class="cislo-radek"><span class="cislo-obri">${dni}</span>
            <p>${esc(popisStavu)}<br>${esc(ja.email || "")}</p></div>
          ${p && p.stav === "vyprselo" ? `<p class="hlaska chyba">Zakázky máte uložené —
            objednávkou níž se k nim zase dostanete.</p>` : ""}
        </div>
        ${objednavka ? `${sekce("01", "Objednat předplatné")}
          <div class="pole"><label for="ob-mesice">Délka</label>
            <select id="ob-mesice">
              <option value="1">1 měsíc</option>
              <option value="3">3 měsíce</option>
              <option value="12">12 měsíců</option>
            </select></div>
          <p class="popisek">Rozsah: plný přístup k aplikaci — zakázky, standard,
          náhled i generování kusovníků.</p>
          <p class="titulek-cena" id="ob-celkem">podle ceníku</p>
          ${CENIK ? "" : `<p class="hlaska varovani">Ceník zatím není v aplikaci
            zveřejněný — celkovou cenu vám potvrdíme e-mailem dřív, než vystavíme
            fakturu, a do té doby vás objednávka k ničemu nezavazuje.</p>`}
          <div class="pole"><label for="ob-fakturace">Fakturační údaje</label>
            <textarea id="ob-fakturace" rows="3" maxlength="600"
              placeholder="Název / jméno, adresa, IČO (máte-li)"></textarea></div>
          <label class="volba"><input type="checkbox" id="ob-spotrebitel">
            Objednávám jako spotřebitel (mimo podnikání)</label>
          <label class="volba skryte" id="ob-souhlas-radek"><input type="checkbox" id="ob-souhlas">
            Výslovně souhlasím, aby placená služba začala před uplynutím 14denní lhůty
            pro odstoupení, a beru na vědomí, že tím právo na odstoupení ztrácím
            (§ 1837 písm. l) občanského zákoníku).</label>
          <button type="button" class="tlacitko" id="ob-poslat">Objednávka zavazující k platbě</button>
          <div id="ob-zprava" aria-live="polite"></div>` : ""}
        ${sekce(objednavka ? "02" : "01", "Vaše hlášení")}
        <div id="hl-seznam"></div>
        ${sekce(objednavka ? "03" : "02", "Vaše data")}
        <ul class="seznam" id="ucet-akce"></ul>
        <div class="paticka">
          <a href="zasady.html">Zásady zpracování údajů</a>
          <a href="podminky.html">Obchodní podmínky</a>
          <a href="zpracovatelska-smlouva.html">Zpracovatelská smlouva</a>
          <a href="odstoupeni-formular.html">Odstoupení od smlouvy</a>
          <button type="button" class="nahlasit-chybu">Nahlásit chybu</button>
        </div>`;

      if (objednavka) nastavObjednavku();
      nactiHlaseni();

      const akce = $("ucet-akce");
      pridejAkci(akce, "Stáhnout moje data", "všechno, co o vás vedeme, v jednom souboru",
        () => { location.href = "/api/ucet/export"; });
      pridejAkci(akce, "Odhlásit se", "", async () => {
        await api("/api/odhlaseni", "POST");
        zahodKoncept();
        location.reload();
      });
      pridejAkci(akce, "Smazat účet a všechna data", "nevratné", smazUcet);

      nastavListu([]);
    }

    function nastavObjednavku() {
      const prepocti = () => {
        const mesice = Number($("ob-mesice").value);
        $("ob-celkem").textContent = CENIK
          ? `${mesice * CENIK.mesic} ${CENIK.mena} za ${mesice} měs.`
          : "podle ceníku";
      };
      prepocti();
      $("ob-mesice").addEventListener("change", prepocti);
      $("ob-spotrebitel").addEventListener("change", () => {
        $("ob-souhlas-radek").classList.toggle("skryte", !$("ob-spotrebitel").checked);
      });
      $("ob-poslat").addEventListener("click", async () => {
        const zprava = $("ob-zprava");
        zprava.className = "hlaska";
        zprava.textContent = "Odesílám…";
        const mesice = Number($("ob-mesice").value);
        const { ok, data } = await api("/api/objednavka", "POST", {
          mesice,
          cena_czk: CENIK ? mesice * CENIK.mesic : null,
          fakturace: $("ob-fakturace").value,
          spotrebitel: $("ob-spotrebitel").checked,
          souhlas_zahajeni: $("ob-spotrebitel").checked && $("ob-souhlas").checked,
        }).catch(() => ({ ok: false, data: {} }));
        if (!ok) {
          zprava.className = "hlaska chyba";
          zprava.textContent = data.chyba || "Objednávku se nepodařilo odeslat.";
          return;
        }
        zprava.className = "hlaska uspech";
        zprava.textContent = "Děkujeme, objednávku máme. Fakturu pošleme e-mailem.";
      });
    }

    // Formulář pro nové hlášení řídí web/simtegen.js (tlačítko .nahlasit-chybu
    // v navigaci, hlavičce a patičce) — tady se jen ukazuje, co jste poslali
    // a co jsme odpověděli.
    async function nactiHlaseni() {
      const seznam = $("hl-seznam");
      if (!seznam) return;
      const { ok, data } = await api("/api/hlaseni").catch(() => ({ ok: false, data: {} }));
      if (!seznam.isConnected) return;
      const polozky = ok ? (data.hlaseni || []) : [];
      if (!polozky.length) {
        seznam.innerHTML = `<p class="popisek">Zatím jste nic nehlásili. Tlačítkem
          „Nahlásit chybu“ nám napíšete a odpověď uvidíte tady.</p>`;
        return;
      }
      seznam.innerHTML = `<ul class="seznam">${polozky.map((h) => `
        <li class="radek"><span class="hlavni"><strong>${esc(h.text)}</strong>
          <span>${datum(h.vytvoreno)} · ${esc(STAVY_HLASENI[h.stav] || h.stav)}${
            h.odpoved ? " · odpověď: " + esc(h.odpoved) : ""}</span></span></li>`).join("")}</ul>`;
    }

    async function smazUcet() {
      if (!confirm("Opravdu smazat účet, všechny zakázky i kusovníky? Krok je nevratný.")) return;
      const { ok, data } = await api("/api/ucet/smazat", "POST")
        .catch(() => ({ ok: false, data: {} }));
      if (!ok) { toast(data.chyba || "Smazání se nepovedlo."); return; }
      zahodKoncept();
      location.reload();
    }

    // ── Start ──────────────────────────────────────────────────────────
    sledujKlavesnici();

    async function start() {
      const { data } = await api("/api/ja").catch(() => ({ data: {} }));
      stav.ja = data;
      if (!data.prihlasen) {
        jdi("uvod", {}, true);
        return;
      }
      await nactiStandard();
      // Obnovit se dá jen kořenová obrazovka — vnitřní obrazovky potřebují
      // zakázku, kterou z adresy vyčíst nejde.
      const hash = (location.hash || "").replace("#", "");
      jdi(KORENOVE[hash] ? hash : "zakazky", {}, true);
    }

    start();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
